<style>

:root{
  --ink:#101c17;--ink2:#5f6f67;--ink3:#93a09a;
  --paper:#ffffff;--wash:#f6f8f6;--line:#e8ede9;--line2:#c8d2cc;
  --cold:#14618F;--coldw:#eaf4fc;
  --good:#2E7D32;--goodw:#edf7ee;
  --bad:#8e2020;--badw:#fdeeee;
  --warn:#9A5B06;--warnw:#fdf3e6;
  --a:#101c17;--aw:#eef1ef;
  --gold:#E0A020;
  --fs:16px;--lh:1.55;
  --r:16px;--rs:12px;
  --sh:0 1px 2px rgba(16,28,23,.05), 0 1px 1px rgba(16,28,23,.03);
  --sh2:0 4px 14px rgba(16,28,23,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Anuphan",system-ui,sans-serif;background:var(--wash);color:var(--ink);
  font-size:var(--fs);line-height:var(--lh);-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:var(--ink)}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:540px;margin:0 auto;padding:14px 15px calc(92px + env(safe-area-inset-bottom))}
.wrap.bare{padding-bottom:28px}
.num{font-variant-numeric:tabular-nums}
.mut{font-size:calc(var(--fs)*.79);color:var(--ink3)}
.hide{display:none}

.hero{background:var(--aw);border-radius:var(--r);padding:16px 17px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.h1{font-size:calc(var(--fs)*1.55);font-weight:600;color:var(--a);line-height:1.26;letter-spacing:-.01em}
.h2{font-size:calc(var(--fs)*.82);color:var(--a);opacity:.7;margin-top:1px}
.dnum{font-size:calc(var(--fs)*1.55);font-weight:600;color:var(--a);line-height:1;text-align:right}
.dmon{font-size:calc(var(--fs)*.66);color:var(--a);opacity:.6;text-align:right;letter-spacing:.06em;margin-top:3px}

.task{background:var(--a);border-radius:var(--r);padding:19px 17px;color:#fff;margin-bottom:12px;
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;box-shadow:var(--sh2)}
.task:active{transform:scale(.995)}
.task.q{background:var(--paper);color:var(--ink);box-shadow:var(--sh);cursor:default}
.task i{font-size:29px;flex:0 0 auto;opacity:.95}
.tt{font-size:calc(var(--fs)*1.08);font-weight:600;line-height:1.35;display:block;letter-spacing:-.01em}
.ts{font-size:calc(var(--fs)*.82);opacity:.78;line-height:1.5;display:block;margin-top:1px}
.done{background:var(--aw);border-radius:var(--r);padding:17px;text-align:center;color:var(--a);margin-bottom:12px}
.alert{border-radius:var(--rs);padding:11px 13px;margin-bottom:10px;font-size:calc(var(--fs)*.82);
  display:flex;gap:9px;align-items:center;line-height:1.5}
.alert.w{background:var(--warnw);color:var(--warn)}
.alert.e{background:var(--badw);color:var(--bad)}

.card{background:var(--paper);border-radius:var(--r);padding:14px 15px;margin-bottom:9px;box-shadow:var(--sh)}
.card.on{box-shadow:0 0 0 2px var(--a), var(--sh2)}
.card.flat{padding:0;overflow:hidden}
.lbl{font-size:calc(var(--fs)*.73);font-weight:600;color:var(--ink3);margin:18px 0 8px 3px;
  display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.03em;text-transform:uppercase}
.lbl .mut{text-transform:none;letter-spacing:0;font-weight:400}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0}
.rt{font-size:calc(var(--fs)*.94);min-width:0}
.rv{font-size:calc(var(--fs)*.96);font-weight:600;font-variant-numeric:tabular-nums}
.sec{border-top:1px solid var(--line);padding:11px 0 2px;margin-top:9px}
.cn{font-size:calc(var(--fs)*1.02);font-weight:600;letter-spacing:-.01em}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.k{background:var(--paper);border-radius:var(--rs);padding:13px 14px;box-shadow:var(--sh)}
.kk{font-size:calc(var(--fs)*.74);color:var(--ink3)}
.kv{font-size:calc(var(--fs)*1.24);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;margin-top:2px}

.stp{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.stp button{width:44px;height:44px;border-radius:13px;background:var(--wash);
  font-size:20px;padding:0;color:var(--ink2)}
.stp button:active{background:var(--aw);color:var(--a)}
.stp .v{font-size:calc(var(--fs)*1.12);font-weight:600;min-width:34px;text-align:center;
  font-variant-numeric:tabular-nums}

.btn{width:100%;min-height:52px;border-radius:14px;background:var(--ink);color:#fff;
  font-size:var(--fs);font-weight:500;padding:0 15px;margin-top:9px;box-shadow:var(--sh)}
.btn:active{transform:scale(.995)}
.btn.acc{background:var(--a)}
.btn.g{background:var(--paper);color:var(--ink)}
.btn.good{background:var(--good)}
.btn[disabled]{opacity:.35;box-shadow:none}
.sm{min-height:40px;font-size:calc(var(--fs)*.82);padding:0 13px;border-radius:11px;
  background:var(--wash);color:var(--ink2);width:auto;margin:0}

input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;
  font-size:calc(var(--fs)*1.0);background:var(--wash);font-variant-numeric:tabular-nums}
input[type=number]{text-align:right}
input:focus{outline:none;background:var(--paper);border-color:var(--a);box-shadow:0 0 0 3px var(--aw)}
.flbl{font-size:calc(var(--fs)*.7);color:var(--ink3);display:block;margin-bottom:4px}

.days{flex:0 0 46px;height:46px;border-radius:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1}
.days b{font-size:calc(var(--fs)*1.08);font-weight:600;font-variant-numeric:tabular-nums}
.days span{font-size:calc(var(--fs)*.5);letter-spacing:.07em;opacity:.7;margin-top:2px}
.fr{display:flex;align-items:center;gap:12px}
.sbar{flex:0 0 76px;height:6px;border-radius:99px;background:var(--wash);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--good)}

.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:900}
.nav-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{padding:10px 2px 11px;font-size:calc(var(--fs)*.67);
  color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.25}
.nav button i{font-size:21px}
.nav button[aria-selected="true"]{color:var(--a);font-weight:600}

.brand{text-align:center;padding:22px 0 22px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.door{min-height:158px;border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;padding:14px 9px;box-shadow:var(--sh)}
.door.d1{background:var(--aw);color:var(--a);box-shadow:var(--sh2)}
.door.d2{background:var(--paper)}
.door:active{transform:scale(.985)}
.door i{font-size:36px;opacity:.9}
.dots{display:flex;justify-content:center;gap:15px;margin:22px 0 10px}
.dot{width:15px;height:15px;border-radius:50%;background:var(--line2);transition:transform .12s}
.dot.on{background:var(--a);transform:scale(1.12)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pad button{min-height:66px;border-radius:18px;background:var(--paper);box-shadow:var(--sh);
  font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--aw);color:var(--a);transform:scale(.97)}
.pad button.blank{background:transparent;box-shadow:none}
.pad button.act{font-size:calc(var(--fs)*.85);color:var(--ink3);background:transparent;box-shadow:none}
.pmsg{text-align:center;font-size:calc(var(--fs)*.85);min-height:26px;line-height:1.6;color:var(--bad)}

table{width:100%;border-collapse:collapse;font-size:calc(var(--fs)*.85)}
th,td{padding:8px 3px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:calc(var(--fs)*.72);color:var(--ink3);font-weight:500}
.msg{padding:12px 14px;border-radius:var(--rs);font-size:calc(var(--fs)*.85);margin:10px 0}
.msg.err{background:var(--badw);color:var(--bad)}
.empty{text-align:center;color:var(--ink3);padding:44px 18px}
.ordertxt{font-size:calc(var(--fs)*1.12);line-height:2.05;white-space:pre-wrap;word-break:break-word;
  font-variant-numeric:tabular-nums}
.chip{background:var(--wash);border-radius:99px;padding:4px 11px;font-size:calc(var(--fs)*.74);color:var(--ink2)}
.cb{flex:0 0 28px;height:28px;border-radius:9px;background:var(--wash);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;
  box-shadow:inset 0 0 0 2px var(--line2)}
.cb[data-on="1"]{background:var(--ink);box-shadow:none}
.dchip{flex:0 0 46px;height:46px;border-radius:13px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1}
#map{height:200px;border-radius:var(--r);margin-bottom:11px;box-shadow:var(--sh)}
.sig{width:100%;height:128px;border:1px dashed var(--line2);border-radius:var(--rs);
  background:var(--wash);touch-action:none;display:block;margin-top:8px}
.tuck{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;
  background:var(--paper);border-radius:var(--rs);margin-bottom:8px;
  font-size:calc(var(--fs)*.92);box-shadow:var(--sh)}
</style>
</head>

async function boot(){

async function loadData(){

 const {data:pr}=await db.from("products").select("id,name,name_th,returnable").eq("active",true);
 (pr||[]).forEach(p=>S.prods[p.id]=p);
 const {data:st,error}=await db.from("stores")
  .select("id,name,suburb,address,terms,price_tag_required,delivery_days,weeks_of_month,route_position,latitude,longitude,parking_note,is_kitchen")
  .eq("active",true).eq("is_kitchen",false).order("route_position",{ascending:true,nullsFirst:false});
 if(error) return fail(error.message);
 S.stores=st||[];
 const ids=S.stores.map(x=>x.id); if(!ids.length) return;

  .select("store_id,product_id,sell_price,retail_price,default_qty").in("store_id",ids);
 S.prices=sp||[];
 if(S.role==="owner"){
  const {data:cs}=await db.from("supplier_products").select("product_id,unit_cost").eq("supplier_id",S.supplierId);
  (cs||[]).forEach(c=>S.costs[c.product_id]=Number(c.unit_cost));
  const {data:spy}=await db.from("supplier_payments").select("amount,paid_on,covers_dates").eq("supplier_id",S.supplierId);
  S.supPay=spy||[];
  const {data:po}=await db.from("purchase_orders")
   .select("id,for_delivery_on,status").order("for_delivery_on",{ascending:false}).limit(8);
  S.orders=po||[];
  const {data:dv}=await db.from("drivers").select("id,name,name_th,pin,active").order("name");
  S.drivers=dv||[];
 }
 const {data:dl}=await db.from("delivery_lines")
  .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at,deliveries!inner(id,store_id,delivered_on)")
  .in("deliveries.store_id",ids);
 S.lines=dl||[];
 const {data:pay}=await db.from("store_payments").select("store_id,amount,paid_on").in("store_id",ids);
 S.payments=pay||[];
}

const hero=(t,s,extra)=>{

/* ---- schedule helpers ---- */
function dueOn(dow,week){
 return S.stores.filter(s=>(s.delivery_days||[]).includes(dow)&&
  (!(s.weeks_of_month||[]).length||s.weeks_of_month.includes(week)));
}
function nextDeliveryFrom(offset){
 for(let i=offset;i<9;i++){
  const d=new Date(); d.setDate(d.getDate()+i);
  if(dueOn(d.getDay(),weekOf(d)).length) return d;
 }
 return null;
}
const orderTarget=()=>{
 const t=nextDeliveryFrom(1);
 if(!t) return null;
 return Math.round((t-new Date(S.today+"T00:00:00"))/864e5)===1?t:null;
};
const runToday=()=>dueOn(S.dow,S.week);
const orderFor=dISO=>S.orders.find(o=>o.for_delivery_on===dISO)||null;

/* ================= TODAY ================= */
function todayTab(){
 const tgt=orderTarget(), stops=runToday();
 const isOrder=!!tgt, isRun=stops.length>0;
 const quiet=!isOrder&&!isRun;
 let task="", alert="";

 if(isOrder){
  const sent=orderFor(iso(tgt));
  let boxes=0,cost=0;
  dueOn(tgt.getDay(),weekOf(tgt)).forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
   const q=oVal(s.id,p.product_id);boxes+=q;cost+=q*(S.costs[p.product_id]||0);}));
  task=sent?`<div class="done"><div style="font-size:calc(var(--fs)*1.05);font-weight:600">${esc(T().orderSent)} ✓</div>
   <div class="mut" style="color:inherit;opacity:.85">${boxes} ${esc(T().forDay(dayName(tgt.getDay())))}</div></div>`
   :`<button class="task" data-go="order"><i class="ti ti-message-2" aria-hidden="true"></i>
   <span><span class="tt">${esc(T().sendOrder)}</span>
   <span class="ts">${esc(T().forDay(dayName(tgt.getDay())))} · ${boxes} · ${money(cost)}</span></span></button>`;
 } else if(isRun){
  if(S.stops==null) S.stops=buildStops();
  const left=S.stops.filter(x=>!x.done).length;
  const boxes=S.stops.reduce((a,s)=>a+s.out.reduce((x,o)=>x+o.qty,0),0);
  task=left===0?`<div class="done"><div style="font-size:calc(var(--fs)*1.05);font-weight:600">${esc(T().roundDone)} ✓</div>
   <div class="mut" style="color:inherit;opacity:.85">${S.stops.length} · ${money(S.stops.reduce((a,s)=>a+dueFor(s),0))} ${esc(T().collected)}</div></div>`
   :`<button class="task" data-go="run"><i class="ti ti-truck-delivery" aria-hidden="true"></i>
   <span><span class="tt">${esc(T().roundOf(dayName(S.dow)))}</span>
   <span class="ts">${esc(T().stopsLoad(left,boxes))}</span></span></button>`;
  const ord=orderFor(S.today);
  if(ord&&ord.status!=="collected")
   alert=`<div class="alert w"><i class="ti ti-alert-triangle" style="font-size:17px" aria-hidden="true"></i>
    <span>${esc(T().orderNotCollected)}</span></div>`;
 } else {
  const nx=nextDeliveryFrom(1);
  const od=nx?new Date(nx.getTime()-864e5):null;
  task=`<div class="task q"><i class="ti ti-coffee" aria-hidden="true"></i>
   <span><span class="tt">${esc(T().nothingDue)}</span>
   <span class="ts mut">${od?esc(T().nextOrder(dayName(od.getDay()))):""}</span></span></div>`;
 }

 $("app").innerHTML=hero(T().itsDay(dayName(S.dow)),
   isOrder?T().orderDay:isRun?T().runDay:T().quietDay)
 +alert+task
 +(S.role==="owner"?frozenBlock(quiet)+moneyBlock(quiet)+(quiet?sellBlock():""):"");
 $("app").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.screen=b.dataset.go;render();});
}
function frozenBlock(full){
 const open=S.lines.filter(l=>!isRet(l.product_id)&&l.settled_at==null);
 if(!open.length) return "";
 const rows=open.map(l=>{
  const st=S.stores.find(s=>s.id===l.deliveries.store_id);
  const days=Math.round((new Date(S.today)-new Date(l.deliveries.delivered_on))/864e5);
  const avg=avgClear(l.deliveries.store_id,l.product_id);
  return {name:st?st.name:"—",pid:l.product_id,qty:l.qty_out,days,avg,
   val:l.qty_out*Number(l.unit_price)};})
  .sort((a,b)=>b.days-a.days);
 const show=full?rows:rows.slice(0,1);
 return `<div class="lbl"><span>${esc(T().frozenShelf)}</span><span class="mut">${esc(T().daysUsual)}</span></div>`+
 show.map(r=>{const slow=r.avg&&r.days>r.avg;
  return `<div class="card"><div class="fr">
  <div class="days" style="background:${slow?"var(--badw)":"var(--goodw)"};color:${slow?"var(--bad)":"var(--good)"}">
   <b>${r.days}</b><span>${S.lang==="th"?"วัน":"DAYS"}</span></div>
  <div style="flex:1;min-width:0"><div style="font-weight:500">${esc(r.name)}</div>
  <div class="mut">${esc(pname(r.pid))} ×${r.qty}${r.avg?" · "+esc(T().usually(r.avg)):""}</div></div>
  <div class="rv">${money(r.val)}</div></div></div>`;}).join("");
}
function avgClear(sid,pid){
 const done=S.lines.filter(l=>l.deliveries.store_id===sid&&l.product_id===pid&&l.settled_at);
 if(!done.length) return null;
 const tot=done.reduce((a,l)=>a+Math.round((new Date(l.settled_at)-new Date(l.deliveries.delivered_on))/864e5),0);
 return Math.round(tot/done.length);
}
function balances(){
 const settled=S.lines.filter(l=>l.settled_at!=null);
 const rev=settled.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_price),0);
 const cost=settled.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_cost),0);
 const paid=S.payments.reduce((a,p)=>a+Number(p.amount),0);
 const mumPaid=S.supPay.reduce((a,p)=>a+Number(p.amount),0);
 const flight=S.lines.filter(l=>l.settled_at==null&&isRet(l.product_id))
  .reduce((a,l)=>a+l.qty_out*Number(l.unit_price),0);
 const mth=settled.filter(l=>l.deliveries.delivered_on.slice(0,7)===S.today.slice(0,7));
 const mRev=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_price),0);
 const mCost=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_cost),0);
 return {owed:rev-paid,flight,mum:cost-mumPaid,margin:rev-cost,monthMargin:mRev-mCost};
}

}

     price:Number(p.sell_price),cost:S.costs[p.product_id]||0,qty:p.default_qty||0}))};});

async function saveStop(i,btn){
 const st=S.stops[i]; btn.disabled=true; btn.textContent="…";
 const now=new Date().toISOString();
 if(DEMO){
  st.back.forEach(b=>{const l=S.lines.find(x=>x.id===b.id);if(l){l.qty_back=b.qty;l.settled_at=now;}});
  st.done=true; return render();
 }
 for(const b of st.back){
  const {error}=await db.from("delivery_lines")
   .update({qty_back:b.qty,reason:b.qty>0?"unsold":null,settled_at:now}).eq("id",b.id);
  if(error){btn.disabled=false;return fail(error.message);}
  const l=S.lines.find(x=>x.id===b.id); if(l){l.qty_back=b.qty;l.settled_at=now;}
 }
 const amt=dueFor(st);
 if(amt>0){
  await db.from("store_payments").insert({store_id:st.store.id,amount:amt,paid_on:S.today,
   notes:S.driver?("Collected by "+S.driver.name):"Collected on delivery"});
  S.payments.push({store_id:st.store.id,amount:amt,paid_on:S.today});
 }
 const rows=st.out.filter(o=>o.qty>0);
 if(rows.length){
  const {data:del,error:de}=await db.from("deliveries")
   .insert({store_id:st.store.id,delivered_on:S.today,completed_at:now,
            recorded_by:S.user?.id||null,driver_ref:S.driver?.id||null,
            docket_photo:st.docket||null}).select("id").single();
  if(de){btn.disabled=false;return fail(de.message);}
  const {data:nl}=await db.from("delivery_lines").insert(rows.map(o=>({
   delivery_id:del.id,product_id:o.pid,supplier_id:S.supplierId,
   qty_out:o.qty,unit_price:o.price,unit_cost:o.cost})))
   .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at");
  (nl||[]).forEach(l=>S.lines.push({...l,deliveries:{id:del.id,store_id:st.store.id,delivered_on:S.today}}));
 }
 st.done=true; render();
}
$("fp").onchange=function(){

  if(st) st.docket=r.result; S.dockTarget=null; render();};
 r.readAsDataURL(f);
};

/* ================= MONEY ================= */
function batchList(){
 const M={};
 S.lines.filter(l=>isRet(l.product_id)).forEach(l=>{
  const d=l.deliveries.delivered_on;
  M[d]=M[d]||{d,stores:new Set(),out:0,back:0,cost:0,rev:0,counted:true};
  const m=M[d]; m.stores.add(l.deliveries.store_id); m.out+=l.qty_out;
  if(l.settled_at==null) m.counted=false;
  const sold=l.qty_back==null?0:(l.qty_out-l.qty_back);
  m.back+=l.qty_back||0; m.cost+=sold*Number(l.unit_cost); m.rev+=sold*Number(l.unit_price);});
 const cleared=new Set(S.supPay.flatMap(p=>p.covers_dates||[]));
 return Object.values(M).sort((a,b)=>b.d.localeCompare(a.d))
  .map(m=>({...m,stores:m.stores.size,cleared:cleared.has(m.d)}));
}

function sigPad(cv){
 const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
 cv.width=r.width*dp;cv.height=r.height*dp;
 const x=cv.getContext("2d");x.scale(dp,dp);
 x.strokeStyle="#12211b";x.lineWidth=2.2;x.lineCap="round";x.lineJoin="round";
 let d=false;
 const pt=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return[t.clientX-b.left,t.clientY-b.top];};
 const st=e=>{e.preventDefault();d=true;const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);};
 const mv=e=>{if(!d)return;e.preventDefault();const[a,b]=pt(e);x.lineTo(a,b);x.stroke();
  if(!S.bDrawn){S.bDrawn=true;const o=$("sok");if(o)o.disabled=false;}};
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);
 window.addEventListener("mouseup",()=>d=false);
 cv.addEventListener("touchstart",st,{passive:false});
 cv.addEventListener("touchmove",mv,{passive:false});
 cv.addEventListener("touchend",()=>d=false);
}
