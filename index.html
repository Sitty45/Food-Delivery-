  --good:#2E7D32; --goodw:#eaf7ea;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Anuphan",system-ui,sans-serif;background:var(--wash);color:var(--ink);
  font-size:var(--fs);line-height:var(--lh);-webkit-text-size-adjust:100%}
.wrap{max-width:540px;margin:0 auto;padding:12px 13px calc(88px + env(safe-area-inset-bottom))}
button,input,textarea,select{font-family:inherit;color:var(--ink)}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.mut{font-size:calc(var(--fs)*.78);color:var(--ink3)}
.hide{display:none}

/* hero */
.hero{background:var(--aw);border:1px solid var(--a);border-radius:16px;padding:15px;
  margin-bottom:11px;display:flex;justify-content:space-between;align-items:flex-start;gap:11px}
.h1{font-size:calc(var(--fs)*1.65);font-weight:600;color:var(--a);line-height:1.25}
.h2{font-size:calc(var(--fs)*.85);color:var(--a);opacity:.85;margin-top:2px}
.dnum{font-size:calc(var(--fs)*1.6);font-weight:600;color:var(--a);line-height:1;text-align:right}
.dmon{font-size:calc(var(--fs)*.7);color:var(--a);opacity:.8;text-align:right;letter-spacing:.04em}
.dnext{font-size:calc(var(--fs)*.65);color:var(--a);opacity:.62;text-align:right;margin-top:4px}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;
  margin-bottom:10px;overflow:hidden}
.card.on{border-color:var(--a);border-width:2px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;padding:12px 13px}
.cn{font-size:calc(var(--fs)*1.02);font-weight:500}
.sec{border-top:1px solid var(--line);padding:9px 13px}
.sec.cold{background:var(--coldw)}
.sl{font-size:calc(var(--fs)*.78);font-weight:500;color:var(--ink2);margin-bottom:3px}
.row{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:6px 0}
.rt{font-size:calc(var(--fs)*.95);min-width:0}
.pill{font-size:calc(var(--fs)*.7);padding:3px 9px;border-radius:99px;white-space:nowrap;
  background:var(--aw);color:var(--a)}
.pill.cold{background:var(--coldw);color:var(--cold)}
.pill.good{background:var(--goodw);color:var(--good)}
.pill.grey{background:var(--wash);color:var(--ink3)}

/* stepper */
.stp{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.stp button{width:46px;height:46px;padding:0;font-size:21px;border-radius:11px;
  border:1px solid var(--line);background:var(--paper)}
.stp button:active{background:var(--wash)}
.stp .v{font-size:calc(var(--fs)*1.15);font-weight:600;min-width:36px;text-align:center;
  font-variant-numeric:tabular-nums}

.btn{width:100%;min-height:var(--tap);border-radius:12px;border:1px solid var(--ink);
  background:var(--ink);color:#fff;font-size:var(--fs);font-weight:500;padding:0 15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.acc{background:var(--a);border-color:var(--a)}
.btn.good{background:var(--good);border-color:var(--good)}
.btn[disabled]{opacity:.38}
.card .btn{border-radius:0;border-left:0;border-right:0;border-bottom:0;min-height:50px}
.sm{min-height:38px;font-size:calc(var(--fs)*.82);padding:0 12px;border-radius:9px;

.note{border-radius:10px;padding:8px 11px;margin-top:5px;font-size:calc(var(--fs)*.86);

.note.acc{background:var(--aw);color:var(--a)}

/* ============ offline write queue ============ */
/* Writes are attempted immediately. If the network is down they are parked in
   localStorage and replayed when the connection returns, so a save inside a
   shop basement never looks like a failure. */
const QKEY="dr_queue";
const qRead=()=>{try{return JSON.parse(localStorage.getItem(QKEY)||"[]");}catch(e){return[];}};
const qWrite=a=>{try{localStorage.setItem(QKEY,JSON.stringify(a));}catch(e){}};
const qCount=()=>qRead().length;

async function runOp(op){
 const t=db.from(op.table);
 if(op.kind==="insert") return await t.insert(op.rows);
 if(op.kind==="update") {
  let b=t.update(op.values);
  Object.entries(op.match).forEach(([k,v])=>{b=b.eq(k,v);});
  return await b;
 }
 return {error:{message:"unknown op"}};
}
async function write(op){
 if(DEMO) return {error:null,queued:false};
 if(!navigator.onLine){const a=qRead();a.push(op);qWrite(a);banner();return{error:null,queued:true};}
 const r=await runOp(op);
 if(r.error && /fetch|network|Failed/i.test(r.error.message||"")){
  const a=qRead();a.push(op);qWrite(a);banner();return{error:null,queued:true};}
 return r;
}
async function flushQueue(){
 if(DEMO) return;
 let a=qRead(); if(!a.length) return;
 const keep=[];
 for(const op of a){
  try{const r=await runOp(op); if(r.error) keep.push(op);}catch(e){keep.push(op);}
 }
 qWrite(keep); banner();
 if(!keep.length && a.length) load();
}
function banner(){
 let b=document.getElementById("qb");
 const n=qCount();
 if(!n){if(b)b.remove();return;}
 if(!b){b=document.createElement("div");b.id="qb";
  b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:1200;background:#9A5B06;color:#fff;"+
   "font-size:12px;text-align:center;padding:5px";
  document.body.appendChild(b);}
 b.textContent=(S.lang==="th"?"รอส่งข้อมูล ":"Waiting to sync ")+n;
}
window.addEventListener("online",flushQueue);

 const SP=[
  [uid(11),uid(1),6,7.5,8],[uid(11),uid(2),6,7.5,8],
  [uid(12),uid(1),6,7.5,12],[uid(12),uid(2),6,7.5,12],
  [uid(13),uid(1),6,8.5,4],[uid(13),uid(2),6,8.5,4],[uid(13),uid(3),8,null,10],
  [uid(14),uid(1),6,null,6],

 ].map(([s,p,sell,ret,q])=>({store_id:s,product_id:p,sell_price:sell,retail_price:ret,default_qty:q}));
 const COST={[uid(1)]:2,[uid(2)]:2,[uid(3)]:3,[uid(4)]:10};

 // Build a few weeks of plausible history ending before today
 const lines=[]; let n=0;
 const base=new Date(); base.setHours(12,0,0,0);
 for(let back=28;back>=4;back--){
  const d=new Date(base); d.setDate(d.getDate()-back);
  const dow=d.getDay(); if(dow!==0&&dow!==4) continue;
  const day=iso(d);
  ST.filter(s=>s.delivery_days.includes(dow)&&
    (!s.weeks_of_month.length||s.weeks_of_month.includes(weekOf(d)))).forEach(s=>{
   SP.filter(x=>x.store_id===s.id).forEach(x=>{
    const pr=P.find(p=>p.id===x.product_id);
    const out=x.default_qty;
    const ret=pr.returnable?Math.max(0,Math.round(out*(0.08+Math.random()*0.16))):null;
    lines.push({id:"L"+(++n),product_id:x.product_id,qty_out:out,qty_back:ret,
     unit_price:x.sell_price,unit_cost:COST[x.product_id],
     settled_at:new Date(d.getTime()+3*864e5).toISOString(),
     deliveries:{id:"DL"+n,store_id:s.id,delivered_on:day}});});});
 }
 // One batch still open — last delivery day, not yet counted back
 const lastD=new Date(base); lastD.setDate(lastD.getDate()-3);
 const ldow=lastD.getDay();
 ST.filter(s=>s.delivery_days.includes(ldow)).forEach(s=>{
  SP.filter(x=>x.store_id===s.id).forEach(x=>{
   lines.push({id:"L"+(++n),product_id:x.product_id,qty_out:x.default_qty,qty_back:null,
    unit_price:x.sell_price,unit_cost:COST[x.product_id],settled_at:null,
    deliveries:{id:"DL"+n,store_id:s.id,delivered_on:iso(lastD)}});});});

 const pays=[...new Set(lines.filter(l=>l.settled_at).map(l=>l.deliveries.store_id))]
  .map(sid=>({store_id:sid,amount:Math.round(120+Math.random()*90),paid_on:iso(base)}));

 return {P,ST,SP,COST,lines,pays};
}

/* ============ load ============ */

 applyType();

 if(!DEMO){
  const {data:{session}}=await db.auth.getSession();
  if(!session) return renderAuth();
  S.user=session.user;
  const {data:pf}=await db.from("profiles").select("role,display_name,lang").eq("id",session.user.id).maybeSingle();
  S.role=pf?.role||"driver";
  S.name=pf?.display_name||session.user.email;
  if(pf?.lang && !localStorage.getItem("dr_lang")){S.lang=pf.lang;applyType();}
  flushQueue();
 } else { S.role="owner"; S.name="Demo"; }
 if(DRIVER) S.role="driver";

 if(DEMO){
  const D=demoData();
  S.supplierId="demo-supplier";
  D.P.forEach(p=>S.prods[p.id]=p);

  S.lines=D.lines; S.payments=D.pays; S.supPay=[]; S.runs=[];

  const b=document.createElement("div");

   "font-size:10px;letter-spacing:.08em;padding:2px 7px;border-radius:99px;opacity:.75";
  document.body.appendChild(b);
  return;
 }

 const {data:sup}=await db.from("suppliers").select("id,name").eq("active",true).limit(1);
 S.supplierId=sup?.[0]?.id||null;

 const {data:pr}=await db.from("products").select("id,name,name_th,returnable,photo_1").eq("active",true);
 (pr||[]).forEach(p=>S.prods[p.id]=p);

 const {data:st,error}=await db.from("stores")
  .select("id,name,suburb,address,terms,price_tag_required,delivery_days,weeks_of_month,route_position,latitude,longitude,parking_note,contact_note")
  .eq("active",true).order("route_position",{ascending:true,nullsFirst:false});
 if(error) return fail(error.message);
 S.stores=st||[];
 const ids=S.stores.map(x=>x.id);
 if(!ids.length){renderAll();return;}

 const {data:sp}=await db.from("store_products")
  .select("store_id,product_id,sell_price,retail_price,default_qty").in("store_id",ids);
 S.prices=sp||[];

 const {data:cs}=await db.from("supplier_products")
  .select("product_id,unit_cost").eq("supplier_id",S.supplierId);
 (cs||[]).forEach(c=>S.costs[c.product_id]=Number(c.unit_cost));

 const {data:dl}=await db.from("delivery_lines")
  .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at,deliveries!inner(id,store_id,delivered_on)")
  .in("deliveries.store_id",ids);
 S.lines=dl||[];

 const {data:pay}=await db.from("store_payments").select("store_id,amount,paid_on").in("store_id",ids);
 S.payments=pay||[];
 const {data:spy}=await db.from("supplier_payments")
  .select("amount,paid_on,covers_dates").eq("supplier_id",S.supplierId);
 S.supPay=spy||[];

 S.runs=rn||[];

 if(S.role==="driver") return renderDriver();
 renderAll();
}

function applyType(){
 const base=[15,16.5,18.5][S.fz]||16.5;
 document.documentElement.style.setProperty("--fs",(S.lang==="th"?base+1:base)+"px");
 document.documentElement.style.setProperty("--lh",S.lang==="th"?1.78:1.55);
}
function setDay(k){
 const d=DAY[k];
 document.documentElement.style.setProperty("--a",d.i);
 document.documentElement.style.setProperty("--aw",d.w);
 document.querySelector('meta[name=theme-color]').setAttribute("content",d.i);
}

/* ============ helpers ============ */
const spOf=(sid,pid)=>S.prices.find(p=>p.store_id===sid&&p.product_id===pid);
const openLines=sid=>S.lines.filter(l=>l.settled_at==null&&l.deliveries.store_id===sid);
const isRet=pid=>S.prods[pid]?.returnable!==false;
function dueOn(dow,week){
 return S.stores.filter(s=>(s.delivery_days||[]).includes(dow)&&
  (!(s.weeks_of_month||[]).length||s.weeks_of_month.includes(week)));
}
function nextDelivery(){
 for(let i=0;i<8;i++){
  const d=new Date(); d.setDate(d.getDate()+i);
  if(dueOn(d.getDay(),weekOf(d)).length) return d;
 }
 return null;
}
function orderTarget(){
 for(let i=1;i<8;i++){
  const d=new Date(); d.setDate(d.getDate()+i);
  if(dueOn(d.getDay(),weekOf(d)).length) return d;
 }
 return null;
}
const isOrderDay=()=>{const t=orderTarget();
 if(!t) return false;
 return Math.round((t-new Date(S.today+"T00:00:00"))/864e5)===1;};

/* ============ hero ============ */
function renderHero(){
 setDay(S.dow);
 const d=new Date(S.today+"T12:00:00");
 const nd=nextDelivery();
 let sub="";
 if(S.tab==="order"){const t=orderTarget();
  sub=isOrderDay()&&t?T().orderFor(dayName(t.getDay())):T().noOrder;}
 else if(S.tab==="deliver"){const n=dueOn(S.dow,S.week).length;
  sub=n?T().stopsLeft(S.stops?S.stops.filter(x=>!x.done).length:n):T().noRound;}
 else sub=T()[S.tab]||"";
 $("hero").innerHTML=`<div class="hero">
  <div><div class="h1">${esc(T().today(dayName(S.dow)))}</div><div class="h2">${esc(sub)}</div></div>
  <div><div class="dnum">${d.getDate()}</div><div class="dmon">${monName(d.getMonth())}</div>
  ${nd?`<div class="dnext">${esc(dayName(nd.getDay())+" "+nd.getDate())}</div>`:""}</div></div>`;
}

 if(ph==="go")    return dvGo(st,d,R);

 if(amt>0){

/* ============ 3. BATCHES ============ */
function batchList(){
 const M={};
 S.lines.forEach(l=>{
  const ret=isRet(l.product_id); if(!ret) return;
  const d=l.deliveries.delivered_on;
  M[d]=M[d]||{d,stores:new Set(),out:0,back:0,cost:0,rev:0,counted:true};
  const m=M[d]; m.stores.add(l.deliveries.store_id); m.out+=l.qty_out;
  if(l.settled_at==null){m.counted=false;}
  const sold=l.qty_back==null?0:(l.qty_out-l.qty_back);
  m.back+=l.qty_back||0; m.cost+=sold*Number(l.unit_cost); m.rev+=sold*Number(l.unit_price);
 });
 const clearedDates=new Set(S.supPay.flatMap(p=>p.covers_dates||[]));
 return Object.values(M).sort((a,b)=>b.d.localeCompare(a.d))
  .map(m=>({...m,stores:m.stores.size,cleared:clearedDates.has(m.d),
   forced:S.forced.has(m.d)}));
}
function frozenList(){
 const clearedDates=new Set(S.supPay.flatMap(p=>p.covers_dates||[]));
 return S.lines.filter(l=>!isRet(l.product_id)).map(l=>({
  id:l.id,d:l.deliveries.delivered_on,store:S.stores.find(s=>s.id===l.deliveries.store_id)?.name||"—",
  pid:l.product_id,qty:l.qty_out,cost:l.qty_out*Number(l.unit_cost),rev:l.qty_out*Number(l.unit_price),
  soldOut:l.settled_at!=null,cleared:clearedDates.has(l.deliveries.delivered_on),
  days:Math.round((new Date(S.today)-new Date(l.deliveries.delivered_on))/864e5)}))
  .sort((a,b)=>b.d.localeCompare(a.d));
}
function renderBatches(){
 const des=batchList(), frz=frozenList();
 const L=S.bPane==="des"?des:frz;
 const payable=x=>S.bPane==="des"?(!x.cleared&&(x.counted||x.forced)):(!x.cleared&&x.soldOut);
 const pay=L.filter(payable);
 const owedD=des.filter(x=>!x.cleared&&(x.counted||x.forced)).reduce((a,x)=>a+x.cost,0);
 const owedF=frz.filter(x=>!x.cleared&&x.soldOut).reduce((a,x)=>a+x.cost,0);

 <button data-bp="frz" aria-selected="${S.bPane==="frz"}">${esc(T().frozen)}<span class="ct">${money(owedF)}</span></button></div>
 <div class="g2 kpi" style="margin-bottom:11px">

 <div><div class="kk">${esc(T().open)}</div><div class="kv">${pay.length}</div></div></div>
 ${pay.length?`<div class="tuck"><span>${pay.length} ${esc(T().toPay)}</span>
  <button class="sm" id="sa">${esc(S.bSel.size===pay.length?T().clearAll:T().selectAll)}</button></div>`:""}
 ${L.length?L.map(x=>S.bPane==="des"?bCardD(x,payable(x)):bCardF(x,payable(x))).join(""):
   `<div class="empty">${esc(T().noData)}</div>`}
 ${S.bSel.size?`<div class="card on" style="margin-top:12px"><div class="ch">

  <canvas class="sig" id="sig"></canvas>
  <div class="g2" style="margin-top:9px">
  <button class="sm" id="sclr" style="width:100%;min-height:46px">${esc(T().cancel)}</button>
  <button class="btn good" id="sok" ${S.bDrawn?"":"disabled"} style="min-height:46px">${esc(T().signClear)}</button>
  </div></div></div>`:""}`;

 $("pane").querySelectorAll("[data-bp]").forEach(b=>b.onclick=()=>{
  S.bPane=b.dataset.bp;S.bSel=new Set();S.bOpen=null;S.bDrawn=false;renderBatches();});
 if($("sa"))$("sa").onclick=()=>{
  S.bSel=S.bSel.size===pay.length?new Set():new Set(pay.map(x=>x.id||x.d));S.bDrawn=false;renderBatches();};
 $("pane").querySelectorAll("[data-bcb]").forEach(e=>e.onclick=ev=>{
  ev.stopPropagation();const k=e.dataset.bcb;const x=L.find(y=>(y.id||y.d)===k);
  if(!payable(x))return; S.bSel.has(k)?S.bSel.delete(k):S.bSel.add(k);S.bDrawn=false;renderBatches();});
 $("pane").querySelectorAll("[data-bo]").forEach(e=>e.onclick=()=>{
  S.bOpen=S.bOpen===e.dataset.bo?null:e.dataset.bo;renderBatches();});
 $("pane").querySelectorAll("[data-force]").forEach(e=>e.onclick=ev=>{
  ev.stopPropagation();S.forced.add(e.dataset.force);renderBatches();});
 if($("sclr"))$("sclr").onclick=()=>{S.bSel=new Set();S.bDrawn=false;renderBatches();};
 if($("sok"))$("sok").onclick=async()=>{
  const dates=[...S.bSel].map(k=>{const x=L.find(y=>(y.id||y.d)===k);return x.d;});
  const c=$("sig");
  if(DEMO){S.supPay.push({amount:total,paid_on:S.today,covers_dates:[...new Set(dates)]});
   S.bSel=new Set();S.bDrawn=false;return renderBatches();}
  const {error}=await db.from("supplier_payments").insert({
   supplier_id:S.supplierId,amount:total,paid_on:S.today,
   covers_dates:[...new Set(dates)],signed_at:new Date().toISOString(),
   signature:c?c.toDataURL("image/png"):null,signed_by:"Mum"});
  if(error) return fail(error.message);
  S.supPay.push({amount:total,paid_on:S.today,covers_dates:[...new Set(dates)]});
  S.bSel=new Set();S.bDrawn=false;renderBatches();};
 if($("sig"))sigPad($("sig"));
}

 <div class="dchip" style="background:${k.w};color:${k.i}"><b>${dt.getDate()}</b><span>${monName(dt.getMonth()).toUpperCase()}</span></div>
 <div style="flex:1;min-width:0" data-bo="${b.d}">

 return `<div class="card ${sel?"on":""}" style="${f.cleared?"opacity:.55":""}">

function sigPad(cv){
 const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
 cv.width=r.width*dp;cv.height=r.height*dp;
 const x=cv.getContext("2d");x.scale(dp,dp);
 x.strokeStyle="#12211b";x.lineWidth=2.2;x.lineCap="round";x.lineJoin="round";
 let d=false;
 const pt=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return[t.clientX-b.left,t.clientY-b.top];};
 const st=e=>{e.preventDefault();d=true;const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);};
 const mv=e=>{if(!d)return;e.preventDefault();const[a,b]=pt(e);x.lineTo(a,b);x.stroke();
  if(!S.bDrawn){S.bDrawn=true;const o=$("sok");if(o)o.disabled=false;}};
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);
 window.addEventListener("mouseup",()=>d=false);
 cv.addEventListener("touchstart",st,{passive:false});
 cv.addEventListener("touchmove",mv,{passive:false});
 cv.addEventListener("touchend",()=>d=false);
}

/* ============ 4. STATS ============ */
function renderStats(){
 const done=S.lines.filter(l=>l.settled_at!=null);
 if(!done.length){$("pane").innerHTML=`<div class="empty">${esc(T().noData)}</div>`;return;}
 const M={};
 done.forEach(l=>{
  const k=l.deliveries.delivered_on.slice(0,7);
  M[k]=M[k]||{days:new Set(),out:0,back:0,rev:0,cost:0};
  const m=M[k]; m.days.add(l.deliveries.delivered_on);
  const ret=l.qty_back||0, sold=l.qty_out-ret;
  m.out+=l.qty_out; m.back+=ret;
  m.rev+=sold*Number(l.unit_price); m.cost+=sold*Number(l.unit_cost);});
 const keys=Object.keys(M).sort().reverse();
 const tot=keys.reduce((a,k)=>{const m=M[k];a.out+=m.out;a.back+=m.back;a.rev+=m.rev;
  a.cost+=m.cost;a.days+=m.days.size;return a;},{out:0,back:0,rev:0,cost:0,days:0});
 $("pane").innerHTML=`
 <div class="g2 kpi" style="margin-bottom:11px">
 <div><div class="kk">${esc(T().boxesOut)}</div><div class="kv">${tot.out}</div></div>
 <div><div class="kk">${esc(T().wastage)}</div><div class="kv">${tot.out?(100*tot.back/tot.out).toFixed(1):0}%</div></div>
 <div><div class="kk">${esc(T().revenue)}</div><div class="kv">${money(tot.rev)}</div></div>
 <div><div class="kk">${esc(T().margin)}</div><div class="kv">${money(tot.rev-tot.cost)}</div></div></div>
 <div class="card"><div class="ch"><div class="cn">${esc(T().byMonth)}</div></div>
 <div class="sec"><table><tr><th>${esc(T().byMonth)}</th><th>${esc(T().deliver)}</th>
 <th>${esc(T().boxesOut)}</th><th>${esc(T().wastage)}</th><th>${esc(T().margin)}</th></tr>
 ${keys.map(k=>{const m=M[k];return `<tr><td>${k}</td><td class="num">${m.days.size}</td>
 <td class="num">${m.out}</td><td class="num">${m.out?(100*m.back/m.out).toFixed(1):0}%</td>
 <td class="num">${money(m.rev-m.cost)}</td></tr>`;}).join("")}</table></div></div>`;
}

/* ============ map ============ */
function drawMap(pts){
 const el=document.getElementById("map");
 if(!el) return;
 if(typeof L==="undefined"){
  el.innerHTML='<div class="empty">Map library did not load.</div>'; return;}
 // The container is recreated on every render, so always rebuild the map.
 if(S.map){try{S.map.remove();}catch(e){} S.map=null;}
 const P=pts.map(s=>({...s,lat:Number(s.latitude),lng:Number(s.longitude)}))
            .filter(s=>isFinite(s.lat)&&isFinite(s.lng));
 if(!P.length){el.innerHTML='<div class="empty">No store coordinates set yet.</div>';return;}
 try{
  S.map=L.map(el,{scrollWheelZoom:false,zoomControl:false,attributionControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
   {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(S.map);
  const acc=DAY[S.dow].i;
  if(P.length>1)
   L.polyline(P.map(s=>[s.lat,s.lng]),{color:acc,weight:3,opacity:.75,dashArray:"6,5"}).addTo(S.map);
  P.forEach((s,i)=>L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",html:
   '<div style="width:27px;height:27px;border-radius:50%;background:'+acc+';color:#fff;display:flex;'+
   'align-items:center;justify-content:center;font:600 13px Anuphan,sans-serif;border:2px solid #fff;'+
   'box-shadow:0 1px 3px rgba(0,0,0,.3)">'+(i+1)+'</div>',iconSize:[27,27],iconAnchor:[13,13]})})
   .addTo(S.map).bindPopup("<b>"+esc(s.name)+"</b><br>"+esc(s.address||"")));
  if(P.length>1) S.map.fitBounds(P.map(s=>[s.lat,s.lng]),{padding:[30,30]});
  else S.map.setView([P[0].lat,P[0].lng],15);
  requestAnimationFrame(()=>S.map&&S.map.invalidateSize());
  setTimeout(()=>S.map&&S.map.invalidateSize(),300);
 }catch(err){
  el.innerHTML='<div class="empty">Map error: '+esc(err.message)+'</div>';
 }
}

if("serviceWorker" in navigator && location.protocol==="https:")
 navigator.serviceWorker.register("sw.js").catch(()=>{});

load().catch(e=>fail(e&&e.message?e.message:String(e)));
