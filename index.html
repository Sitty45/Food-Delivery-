button,input{font-family:inherit;color:var(--ink);border:0;background:none}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button{transition:transform .09s ease,background-color .15s ease,opacity .15s ease}
button:active{transform:scale(.96)}
#app.enter{animation:enter .24s cubic-bezier(.2,.8,.2,1)}

@media (prefers-reduced-motion:reduce){#app.enter{animation:none}button{transition:none}}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(128px + env(safe-area-inset-bottom))}
.wrap.bare{padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom));

.num{font-variant-numeric:tabular-nums}
.mut{font-size:calc(var(--fs)*.8);color:var(--ink3)}
.hide{display:none}

.hero{background:var(--aw);border-radius:var(--r);padding:17px 18px;margin-bottom:14px;

.h1{font-size:calc(var(--fs)*1.45);font-weight:700;color:var(--a);line-height:1.25;letter-spacing:-.02em}

.dmon{font-size:calc(var(--fs)*.62);color:var(--a);opacity:.6;text-align:right;

.tt{font-size:calc(var(--fs)*1.1);font-weight:700;line-height:1.3;display:block}
.ts{font-size:calc(var(--fs)*.82);opacity:.75;line-height:1.5;display:block;margin-top:2px}
.done{background:var(--goodw);border-radius:var(--r);padding:20px;text-align:center;color:var(--good)}
.alert{border-radius:14px;padding:12px 14px;margin-bottom:11px;font-size:calc(var(--fs)*.82);

.card{background:var(--paper);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.card.on{box-shadow:0 0 0 2.5px var(--a),var(--sh2)}
.lbl{font-size:calc(var(--fs)*.72);font-weight:700;color:var(--ink3);margin:20px 0 9px 4px;

.row{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:9px 0}
.rt{font-size:calc(var(--fs)*.95);min-width:0}
.rv{font-size:calc(var(--fs)*.98);font-weight:700;font-variant-numeric:tabular-nums}
.tuck{display:flex;justify-content:space-between;align-items:center;padding:16px;

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--paper);border-radius:14px;padding:14px 15px;box-shadow:var(--sh)}
.kk{font-size:calc(var(--fs)*.74);color:var(--ink3);font-weight:500}
.kv{font-size:calc(var(--fs)*1.26);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:3px}

.stp{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.stp button{width:50px;height:50px;border-radius:15px;background:var(--wash);font-size:22px;color:var(--ink2)}
.stp button:active{background:var(--aw);color:var(--a)}
.stp .v{font-size:calc(var(--fs)*1.18);font-weight:700;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}

.btn{width:100%;min-height:var(--tap);border-radius:16px;background:var(--ink);color:#fff;

.btn.acc{background:var(--a)}.btn.g{background:var(--paper);color:var(--ink)}
.btn.good{background:var(--good)}
.btn.big{min-height:68px;font-size:calc(var(--fs)*1.1);border-radius:19px}

.sm{min-height:46px;font-size:calc(var(--fs)*.84);padding:0 15px;border-radius:13px;

input{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;

.flbl{font-size:calc(var(--fs)*.72);color:var(--ink3);display:block;margin-bottom:5px;font-weight:500}

.days{flex:0 0 50px;height:50px;border-radius:15px;display:flex;flex-direction:column;

.days b{font-size:calc(var(--fs)*1.08);font-weight:700;font-variant-numeric:tabular-nums}
.days span{font-size:calc(var(--fs)*.5);letter-spacing:.09em;opacity:.7;margin-top:3px;font-weight:700}
.fr{display:flex;align-items:center;gap:13px}
.sbar{flex:0 0 72px;height:7px;border-radius:99px;background:var(--wash);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.cb{flex:0 0 32px;height:32px;border-radius:11px;background:var(--wash);display:flex;

.cb[data-on="1"]{background:var(--good);box-shadow:none}
.dchip{flex:0 0 50px;height:50px;border-radius:15px;display:flex;flex-direction:column;

.navwrap{position:fixed;left:0;right:0;bottom:0;z-index:900;

.navcard{max-width:560px;margin:0 auto;position:relative}
.pill{position:absolute;left:50%;top:0;transform:translate(-50%,-58%);

.dots{display:flex;justify-content:center;gap:17px;margin:26px 0 12px}

.pad button.act{font-size:calc(var(--fs)*.86);color:var(--ink3);background:transparent;box-shadow:none;font-weight:600}
.pmsg{text-align:center;font-size:calc(var(--fs)*.85);min-height:28px;color:var(--bad)}

.msg{padding:13px 15px;border-radius:14px;font-size:calc(var(--fs)*.85);margin:10px 0}
.msg.err{background:var(--badw);color:var(--bad)}
.empty{text-align:center;color:var(--ink3);padding:44px 20px}

.ordertxt{font-size:calc(var(--fs)*1.1);line-height:2.05;white-space:pre-wrap;word-break:break-word;font-variant-numeric:tabular-nums}
.chip{background:var(--wash);border-radius:99px;padding:5px 12px;font-size:calc(var(--fs)*.75);color:var(--ink2)}
.seg{display:grid;gap:8px;margin-bottom:12px}

.bar{display:flex;gap:3px;height:7px;margin-bottom:16px}

.huge{width:82px;height:82px;border-radius:24px;background:var(--paper);box-shadow:var(--sh);font-size:35px}

.pips{display:flex;gap:2px}
.pip{width:5px;height:5px;border-radius:50%}
</style>

 lines:[],payments:[],supPay:[],orders:[],orderLines:[],drivers:[],
 tab:"order",sub:"home",orderQty:{},copied:false,orderPick:null,confirmDel:null,

async function key(k,len){
 if(S.busy) return;
 if(k==="del"){S.pin=S.pin.slice(0,-1);S.pmsg="";return pad();}
 if(S.pin.length>=len) return;
 S.pin+=k; pad();
 if(S.pin.length<len) return;
 const p=S.pin; S.busy=true; S.pmsg="…"; pad();
 try{
  if(S.pane==="o6"){
   const {error}=await db.auth.signInWithPassword({email:LOGIN.owner,password:p});
   if(error) throw error;
   S.role="owner"; S.tab="order";
  }else{
   const {error}=await db.auth.signInWithPassword({email:LOGIN.driver,password:DRIVER_PW});
   if(error) throw error;
   const {data,error:e2}=await db.rpc("driver_by_pin",{p});
   if(e2) throw e2;
   const row=Array.isArray(data)?data[0]:data;
   if(!row){await db.auth.signOut();throw new Error(T().wrongPin);}
   S.driver=row; S.role="driver"; S.tab="today";
  }
  S.pin="";S.busy=false;await start();
 }catch(e){
  S.busy=false;S.pin="";
  S.pmsg=/invalid login/i.test(e.message||"")?T().wrongPin:(e.message||T().wrongPin);
  pad();
 }
}

/* ---------- boot ---------- */
async function start(){
 S.screen="app"; $("wrap").classList.remove("bare");
 const now=new Date(); S.dow=now.getDay(); S.today=iso(now); S.week=weekOf(now);
 S.calMonth=now.getMonth(); applyType(); clearErr();
 $("navwrap").classList.add("hide");              // no empty tab bar while loading
 $("app").innerHTML='<div class="empty"><div class="spin"></div></div>';
 try{
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(
   S.lang==="th"?"โหลดช้าเกินไป ลองใหม่อีกครั้ง":"Taking too long — check your connection")),ms))]);
  const {data:{session}}=await withTimeout(db.auth.getSession(),10000);
  if(!session) return showEntry();
  S.user=session.user;
  if(!S.role){
   const {data:pf}=await withTimeout(db.from("profiles").select("role").eq("id",session.user.id).maybeSingle(),10000);
   S.role=pf?pf.role:"driver";
   if(S.role==="driver"&&!S.driver){await db.auth.signOut();return showEntry();}
   S.tab=S.role==="driver"?"today":"order";
  }
  await withTimeout(load(),20000);
  S.stops=buildStops();
  render();
 }catch(e){
  $("app").innerHTML=`<div class="card" style="margin-top:40px;text-align:center;padding:26px 18px">
   <div style="font-size:40px;line-height:1">⚠︎</div>
   <div style="font-weight:700;margin-top:10px">${S.lang==="th"?"โหลดไม่สำเร็จ":"Couldn't load"}</div>
   <div class="mut" style="margin-top:4px">${esc(e.message||String(e))}</div>
   <button class="btn acc" id="retry">${S.lang==="th"?"ลองใหม่":"Try again"}</button>
   <button class="btn g" id="bail">${esc(T().signOut)}</button></div>`;
  $("retry").onclick=()=>start();
  $("bail").onclick=async()=>{try{await db.auth.signOut();}catch(x){} location.href=location.pathname;};
 }
}
async function load(){
 const {data:sup}=await db.from("suppliers").select("id").eq("active",true).limit(1);
 S.supplierId=sup&&sup[0]?sup[0].id:null;
 const {data:pr}=await db.from("products").select("id,name,name_th,returnable").eq("active",true);
 (pr||[]).forEach(p=>{S.prods[p.id]=p;});
 const {data:st,error}=await db.from("stores")
  .select("id,name,suburb,address,terms,price_tag_required,delivery_days,weeks_of_month,route_position,latitude,longitude,parking_note,is_kitchen")
  .eq("active",true).order("route_position",{ascending:true,nullsFirst:false});
 if(error) return fail(error.message);
 S.kitchen=(st||[]).filter(x=>x.is_kitchen)[0]||null;
 S.stores=(st||[]).filter(x=>!x.is_kitchen);
 const ids=S.stores.map(x=>x.id); if(!ids.length) return;
 const {data:sp}=await db.from("store_products")
  .select("store_id,product_id,sell_price,retail_price,default_qty").in("store_id",ids);
 S.prices=sp||[];
 const {data:dl}=await db.from("delivery_lines")
  .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at,deliveries!inner(id,store_id,delivered_on)")
  .in("deliveries.store_id",ids);
 S.lines=dl||[];
 const {data:pay}=await db.from("store_payments").select("store_id,amount,paid_on").in("store_id",ids);
 S.payments=pay||[];
 const {data:po}=await db.from("purchase_orders")
  .select("id,for_delivery_on,status,sent_at").order("for_delivery_on",{ascending:false}).limit(12);
 S.orders=po||[];
 if(S.orders.length){
  const {data:pol}=await db.from("purchase_order_lines")
   .select("id,purchase_order_id,product_id,store_id,qty_plain,qty_price_tagged")
   .in("purchase_order_id",S.orders.map(o=>o.id));
  S.orderLines=pol||[];
 }
 if(S.role==="owner"){
  const {data:cs}=await db.from("supplier_products").select("product_id,unit_cost").eq("supplier_id",S.supplierId);
  (cs||[]).forEach(c=>{S.costs[c.product_id]=Number(c.unit_cost);});
  const {data:spy}=await db.from("supplier_payments").select("amount,paid_on,covers_dates").eq("supplier_id",S.supplierId);
  S.supPay=spy||[];
  const {data:dv}=await db.from("drivers").select("id,name,name_th,pin,active").order("name");
  S.drivers=dv||[];
 }
}

/* ---------- helpers ---------- */
const spOf=(s,p)=>S.prices.filter(x=>x.store_id===s&&x.product_id===p)[0];
const dueOn=(dow,wk)=>S.stores.filter(s=>(s.delivery_days||[]).indexOf(dow)>=0 &&
 (!(s.weeks_of_month||[]).length||s.weeks_of_month.indexOf(wk)>=0));
function nextDelivery(off){
 for(let i=off;i<9;i++){const d=new Date();d.setDate(d.getDate()+i);
  if(dueOn(d.getDay(),weekOf(d)).length) return d;}
 return null;
}
function orderTarget(){
 const t=nextDelivery(1); if(!t) return null;
 return Math.round((t-new Date(S.today+"T00:00:00"))/864e5)===1?t:null;
}
const runToday=()=>dueOn(S.dow,S.week);
const orderFor=d=>S.orders.filter(o=>o.for_delivery_on===d)[0]||null;
const deliveredToday=s=>S.lines.some(l=>l.deliveries.store_id===s&&l.deliveries.delivered_on===S.today);
function buildStops(){
 return runToday().map(s=>{
  const open=S.lines.filter(l=>l.settled_at==null&&l.deliveries.store_id===s.id);
  return {store:s,done:(!S.forceRun&&deliveredToday(s.id)),docket:null,
   back:open.filter(l=>isRet(l.product_id)).map(l=>({id:l.id,pid:l.product_id,out:l.qty_out,price:Number(l.unit_price),qty:0})),
   cold:open.filter(l=>!isRet(l.product_id)).map(l=>({id:l.id,pid:l.product_id,out:l.qty_out,price:Number(l.unit_price)})),
   out:S.prices.filter(p=>p.store_id===s.id).map(p=>({pid:p.product_id,price:Number(p.sell_price),
    cost:S.costs[p.product_id]||0,qty:p.default_qty||0}))};});
}
const dueFor=st=>st.back.reduce((a,b)=>a+(b.out-b.qty)*b.price,0);

/* ---------- shell ---------- */
const OWNER_TABS=[["order","clipboard-list"],["money","cash"],["stores","map-pin"],
 ["calendar","calendar"],["setup","settings"]];
const DRIVER_TABS=[["today","truck-delivery"],["hist","history"]];
function renderNav(){
 const tabs=S.role==="driver"?DRIVER_TABS:OWNER_TABS;
 $("navwrap").classList.remove("hide");
 const d=new Date(S.today+"T12:00:00");
 $("pill").style.setProperty("--pc",DAY[S.dow].a);
 $("pill").innerHTML=`<span class="dotc"></span>${esc(dayName(S.dow))} ${d.getDate()} ${esc(monName(d.getMonth()))}`;
 $("nav").style.gridTemplateColumns="repeat("+tabs.length+",1fr)";
 $("nav").innerHTML=tabs.map(t=>`<button role="tab" data-tab="${t[0]}" aria-selected="${S.tab===t[0]}">
   <i class="ti ti-${t[1]}" aria-hidden="true"></i><span>${esc(T()[t[0]])}</span></button>`).join("");
 $("nav").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  S.tab=b.dataset.tab;S.sub="home";S.storeOpen=null;S.histStore=null;
  window.scrollTo(0,0);render();});

let LAST_KEY="";
const screenKey=()=>[S.role,S.tab,S.sub,S.storeOpen,S.histStore,S.calView,S.storeView,
 S.calMonth,S.dv.phase,S.dv.si,S.dv.pi].join("|");
/* Every tap used to redraw the page and throw away the scroll position.
   Now: same screen keeps its place; a new screen fades in from the top. */
function render(){
 const key=screenKey(), same=(key===LAST_KEY), y=window.scrollY;
 renderInner();
 if(same){ window.scrollTo(0,y); }
 else{
  window.scrollTo(0,0);
  const a=$("app"); a.classList.remove("enter"); void a.offsetWidth; a.classList.add("enter");
 }
 LAST_KEY=key;
}
function renderInner(){
 clearErr(); setAccent(S.dow); renderNav();
 if(S.role==="driver"){
  if(S.tab==="hist") return orderHistory();
  return driverShell();
 }
 if(S.histStore) return storeHistory();
 if(S.storeOpen) return storeDetail();
 if(S.tab==="money") return moneyTab();
 if(S.tab==="stores") return storesTab();
 if(S.tab==="calendar") return calendarTab();
 if(S.tab==="setup") return setupTab();
 if(S.sub==="order") return orderScreen();
 if(S.sub==="run") return runScreen();
 orderTab();
}
function hero(t,s,right){
 const d=new Date(S.today+"T12:00:00");
 return `<div class="hero"><div style="min-width:0">
  <div class="h1">${esc(t)}</div><div class="h2">${esc(s||"")}</div></div>
  <div>${right||`<div class="dnum">${d.getDate()}</div>
  <div class="dmon">${esc(monName(d.getMonth())).toUpperCase()}</div>`}</div></div>`;
}

/* ---------- owner: ORDER tab (today + order) ---------- */
function orderTab(){
 const tgt=orderTarget(), stops=S.stops||[];
 const isOrd=!!tgt, isRun=stops.length>0, quiet=!isOrd&&!isRun;
 let task="",peek="";
 if(isOrd){
  const sent=orderFor(iso(tgt));
  let boxes=0,cost=0;
  dueOn(tgt.getDay(),weekOf(tgt)).forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
   const q=oVal(s.id,p.product_id);boxes+=q;cost+=q*(S.costs[p.product_id]||0);}));
  task=sent?`<div class="done"><div style="font-weight:700">${esc(T().orderSent)} ✓</div>
    <div class="mut" style="color:inherit;opacity:.8">${boxes} · ${esc(T().forDay(dayName(tgt.getDay())))}</div></div>`
   :`<button class="task" data-go="order"><i class="ti ti-message-2" aria-hidden="true"></i>
    <span><span class="tt">${esc(T().sendOrder)}</span>
    <span class="ts">${esc(T().forDay(dayName(tgt.getDay())))} · ${boxes} · ${money(cost)}</span></span></button>`;
 }else if(isRun){
  const left=stops.filter(x=>!x.done).length;
  const boxes=stops.reduce((a,s)=>a+s.out.reduce((x,o)=>x+o.qty,0),0);
  task=left===0?`<div class="done"><div style="font-weight:700">${esc(T().roundDone)} ✓</div></div>
    <button class="btn g" id="redo">${esc(T().runAgain)}</button>`
   :`<button class="task" data-go="run"><i class="ti ti-truck-delivery" aria-hidden="true"></i>
    <span><span class="tt">${esc(T().roundOf(dayName(S.dow)))}</span>
    <span class="ts">${esc(T().stopsLoad(left,boxes))}</span></span></button>`;
 }else{
  const nx=nextDelivery(1), od=nx?new Date(nx.getTime()-864e5):null;
  task=`<div class="task q"><i class="ti ti-coffee" aria-hidden="true"></i>
   <span><span class="tt">${esc(T().nothingDue)}</span>
   <span class="ts mut">${od?esc(T().nextOrder(dayName(od.getDay()))):""}</span></span></div>`;
 }
 const nd=nextDelivery(1);
 if(nd&&!isOrd){
  const already=orderFor(iso(nd));
  peek=`<div class="tuck" data-go="order">
   <span>${esc(T().sendOrder)} · ${esc(dayName(nd.getDay()))} ${nd.getDate()}/${nd.getMonth()+1}</span>
   <span class="mut">${already?esc(T().orderSent)+" ✓":"›"}</span></div>`;
 }
 $("app").innerHTML=hero(T().itsDay(dayName(S.dow)),
  isOrd?T().orderDay:isRun?T().runDay:T().quietDay)+task+peek+frozenBlock(quiet)+ordersList();
 $("app").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.go;render();});
 $("app").querySelectorAll("[data-oped]").forEach(b=>b.onclick=()=>{
  S.orderPick=b.dataset.oped;S.sub="order";render();});
 const rd=$("redo"); if(rd) rd.onclick=()=>{S.forceRun=true;S.stops=buildStops();S.sub="run";render();};
}
function ordersList(){
 if(!S.orders.length) return "";
 return `<div class="lbl">${esc(T().hist)}</div>`+S.orders.slice(0,5).map(o=>{
  const dt=new Date(o.for_delivery_on+"T12:00:00"),k=DAY[dt.getDay()];
  const lines=S.orderLines.filter(l=>l.purchase_order_id===o.id);
  const tot=lines.reduce((a,l)=>a+l.qty_plain+l.qty_price_tagged,0);
  return `<div class="card" data-oped="${o.for_delivery_on}"><div class="fr">
   <div class="dchip" style="background:${k.w};color:${k.i}">
    <b>${dt.getDate()}</b><span>${esc(monName(dt.getMonth())).toUpperCase()}</span></div>
   <div style="flex:1"><div style="font-weight:600">${esc(dayName(dt.getDay()))}</div>
   <div class="mut">${tot} ${esc(T().stops==="ร้าน"?"กล่อง":"boxes")} · ${esc(o.status)}</div></div>
   <span class="mut">›</span></div></div>`;
 }).join("");
}
function avgClear(sid,pid){

async function saveStop(i,btn){
 const st=S.stops[i];
 if(btn){btn.disabled=true;btn.textContent="…";}
 const now=new Date().toISOString();
 try{
  for(let k=0;k<st.back.length;k++){
   const b=st.back[k];
   const {error}=await db.from("delivery_lines")
    .update({qty_back:b.qty,reason:b.qty>0?"unsold":null,settled_at:now}).eq("id",b.id);
   if(error) throw error;
   const l=S.lines.filter(x=>x.id===b.id)[0];
   if(l){l.qty_back=b.qty;l.settled_at=now;}
  }
  const amt=dueFor(st);
  if(amt>0){
   await db.from("store_payments").insert({store_id:st.store.id,amount:amt,paid_on:S.today,
    notes:S.driver?("Collected by "+S.driver.name):"Collected on delivery"});
   S.payments.push({store_id:st.store.id,amount:amt,paid_on:S.today});
  }
  const rows=st.out.filter(o=>o.qty>0);
  if(rows.length){
   const {data:del,error:de}=await db.from("deliveries").insert({
    store_id:st.store.id,delivered_on:S.today,completed_at:now,
    recorded_by:S.user?S.user.id:null,driver_ref:S.driver?S.driver.id:null,
    docket_photo:st.docket||null}).select("id").single();
   if(de) throw de;
   const {data:nl,error:le}=await db.from("delivery_lines").insert(rows.map(o=>({
    delivery_id:del.id,product_id:o.pid,supplier_id:S.supplierId,
    qty_out:o.qty,unit_price:o.price,unit_cost:o.cost})))
    .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at");
   if(le) throw le;
   (nl||[]).forEach(l=>S.lines.push(Object.assign({},l,
    {deliveries:{id:del.id,store_id:st.store.id,delivered_on:S.today}})));
  }
  st.done=true; return true;
 }catch(e){
  if(btn){btn.disabled=false;btn.textContent=T().saveStop;}
  fail(e.message||String(e)); return false;
 }
}

function balances(){
 const set=S.lines.filter(l=>l.settled_at!=null);
 const rev=set.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_price),0);
 const cost=set.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_cost),0);
 const paid=S.payments.reduce((a,p)=>a+Number(p.amount),0);
 const mumPaid=S.supPay.reduce((a,p)=>a+Number(p.amount),0);
 const flight=S.lines.filter(l=>l.settled_at==null&&isRet(l.product_id))
  .reduce((a,l)=>a+l.qty_out*Number(l.unit_price),0);
 const mth=set.filter(l=>l.deliveries.delivered_on.slice(0,7)===S.today.slice(0,7));
 const mr=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_price),0);
 const mc=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_cost),0);
 return {owed:rev-paid,flight,mum:cost-mumPaid,margin:rev-cost,month:mr-mc};
}
function batchList(){
 const M={};
 S.lines.filter(l=>isRet(l.product_id)).forEach(l=>{
  const d=l.deliveries.delivered_on;
  M[d]=M[d]||{d,stores:{},out:0,back:0,cost:0,counted:true};
  const m=M[d];m.stores[l.deliveries.store_id]=1;m.out+=l.qty_out;
  if(l.settled_at==null)m.counted=false;
  const sold=l.qty_back==null?0:(l.qty_out-l.qty_back);
  m.back+=l.qty_back||0;m.cost+=sold*Number(l.unit_cost);});
 const cl={}; S.supPay.forEach(p=>(p.covers_dates||[]).forEach(d=>{cl[d]=1;}));
 return Object.keys(M).sort().reverse().map(k=>Object.assign({},M[k],
  {stores:Object.keys(M[k].stores).length,cleared:!!cl[k]}));
}

function sigPad(cv){
 const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
 cv.width=r.width*dp;cv.height=r.height*dp;
 const x=cv.getContext("2d");x.scale(dp,dp);
 x.strokeStyle="#101c17";x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";
 let d=false;
 const pt=e=>{const b=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  return[t.clientX-b.left,t.clientY-b.top];};
 const st=e=>{e.preventDefault();d=true;const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);};
 const mv=e=>{if(!d)return;e.preventDefault();const p=pt(e);x.lineTo(p[0],p[1]);x.stroke();
  if(!S.bDrawn){S.bDrawn=true;const o=$("sok");if(o)o.disabled=false;}};
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);
 window.addEventListener("mouseup",()=>{d=false;});
 cv.addEventListener("touchstart",st,{passive:false});
 cv.addEventListener("touchmove",mv,{passive:false});
 cv.addEventListener("touchend",()=>{d=false;});
}

function hav(a,b){const R=6371,t=x=>x*Math.PI/180;
 const dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);
 const x=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));}
const road=k=>k*1.35, mins=k=>Math.max(2,Math.round(road(k)/34*60));
const hasLL=s=>s&&isFinite(Number(s.latitude))&&isFinite(Number(s.longitude));
const ll=s=>({lat:Number(s.latitude),lng:Number(s.longitude)});
function sellPct(sid){
 const ls=S.lines.filter(l=>l.deliveries.store_id===sid&&l.settled_at&&isRet(l.product_id));
 const out=ls.reduce((a,l)=>a+l.qty_out,0),back=ls.reduce((a,l)=>a+(l.qty_back||0),0);
 return out?Math.round(100*(out-back)/out):null;
}

let MAP_HOST=null, MAP_LAYER=null, MAP_FIT="";
function drawMap(list,K){
 const slot=$("map"); if(!slot) return;
 if(typeof window.L==="undefined"){slot.innerHTML='<div class="empty">—</div>';return;}

 if(!pts.length){slot.innerHTML='<div class="empty">'+esc(T().noStores)+'</div>';return;}
 try{
  if(!MAP_HOST){
   MAP_HOST=document.createElement("div");

   S.map=window.L.map(MAP_HOST,{scrollWheelZoom:false,zoomControl:false});

    {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(S.map);
   MAP_LAYER=window.L.layerGroup().addTo(S.map);
  }
  slot.appendChild(MAP_HOST);           // move the live map in; tiles stay loaded
  MAP_LAYER.clearLayers();
  const acc=DAY[S.storeView==="thu"?4:S.storeView==="sun"?0:S.dow].i;
  const loop=kk?pts.concat([pts[0]]):pts;
  if(loop.length>1) window.L.polyline(loop.map(p=>[p.lat,p.lng]),
   {color:acc,weight:3,opacity:.7,dashArray:"6,5"}).addTo(MAP_LAYER);
  pts.forEach((p,i)=>window.L.marker([p.lat,p.lng],{icon:window.L.divIcon({className:"",html:
   '<div style="width:29px;height:29px;border-radius:50%;background:'+(p.home?"#93a09a":acc)+
   ';color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px Anuphan,sans-serif;'+
   'border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)">'+(p.home?"⌂":(kk?i:i+1))+'</div>',
   iconSize:[29,29],iconAnchor:[14,14]})}).addTo(MAP_LAYER).bindPopup("<b>"+esc(p.name)+"</b>"));
  const fitKey=pts.map(p=>p.lat.toFixed(4)+","+p.lng.toFixed(4)).join(";");
  const refit=()=>{ if(!S.map) return; S.map.invalidateSize();
   if(fitKey!==MAP_FIT){ S.map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[36,36]}); MAP_FIT=fitKey; } };
  requestAnimationFrame(refit); setTimeout(refit,260);
 }catch(e){slot.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}

 <div class="k"><div class="kk">${esc(T().products)}</div><div class="kv">${prices.length}</div></div></div>

 <div class="lbl">${esc(T().schedule)}</div>

 ${st.parking_note?`<div class="lbl">${esc(T().parking)}</div>
 <div class="card"><div class="rt">🅿 ${esc(st.parking_note)}</div></div>`:""}

 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">

 <div><span class="flbl">${esc(T().youSell)}</span>
  <input type="number" step="0.01" data-pp="${st.id}:${p.product_id}:sell_price" value="${p.sell_price}"></div>
 <div><span class="flbl">${esc(T().defQty)}</span>
  <input type="number" data-pp="${st.id}:${p.product_id}:default_qty" value="${p.default_qty||0}"></div></div></div>`).join("")}
 <button class="btn g" id="sdb">${esc(T().back)}</button>`;
 $("sdb").onclick=()=>{S.storeOpen=null;render();};
 $("app").querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>{S.histStore=b.dataset.hist;render();});
 $("app").querySelectorAll("[data-dd]").forEach(b=>b.onclick=async()=>{
  const p=b.dataset.dd.split(":"),t=S.stores.filter(x=>x.id===p[0])[0];
  const a=(t.delivery_days||[]).slice(),n=+p[1],ix=a.indexOf(n);
  ix>=0?a.splice(ix,1):a.push(n);a.sort();

  await db.from("stores").update({delivery_days:a}).eq("id",p[0]);});
 $("app").querySelectorAll("[data-wk]").forEach(b=>b.onclick=async()=>{
  const p=b.dataset.wk.split(":"),t=S.stores.filter(x=>x.id===p[0])[0];
  const a=(t.weeks_of_month||[]).slice(),n=+p[1],ix=a.indexOf(n);
  ix>=0?a.splice(ix,1):a.push(n);a.sort();
  t.weeks_of_month=a;S.stops=buildStops();render();
  await db.from("stores").update({weeks_of_month:a}).eq("id",p[0]);});
 $("app").querySelectorAll("[data-pp]").forEach(inp=>inp.onchange=async()=>{
  const p=inp.dataset.pp.split(":"),v=parseFloat(inp.value)||0;
  const row=spOf(p[0],p[1]); if(row) row[p[2]]=v;
  S.stops=buildStops();
  const {error}=await db.from("store_products").update({[p[2]]:v})
   .eq("store_id",p[0]).eq("product_id",p[1]);

function storeHistory(){
 const s=S.stores.filter(x=>x.id===S.histStore)[0];
 if(!s){S.histStore=null;return render();}
 const rows={};
 S.lines.filter(l=>l.deliveries.store_id===s.id).forEach(l=>{
  const d=l.deliveries.delivered_on;
  rows[d]=rows[d]||{d,items:[],amount:0,settled:true};
  const sold=l.qty_back==null?null:(l.qty_out-l.qty_back);
  rows[d].items.push({pid:l.product_id,out:l.qty_out,sold});
  if(sold!=null) rows[d].amount+=sold*Number(l.unit_price);
  if(l.settled_at==null) rows[d].settled=false;});
 const list=Object.keys(rows).sort().reverse().map(k=>rows[k]);
 const paid=S.payments.filter(p=>p.store_id===s.id).reduce((a,p)=>a+Number(p.amount),0);
 const billed=list.filter(r=>r.settled).reduce((a,r)=>a+r.amount,0);
 $("app").innerHTML=hero(s.name,s.suburb||"")+
 `<div class="g2"><div class="k"><div class="kk">${esc(T().shopsOwe)}</div>
  <div class="kv">${money(billed-paid)}</div></div>
 <div class="k"><div class="kk">${esc(T().history)}</div><div class="kv">${list.length}</div></div></div>
 ${list.length?list.map(r=>{const dt=new Date(r.d+"T12:00:00"),k=DAY[dt.getDay()];
  return `<div class="card"><div class="fr">
  <div class="dchip" style="background:${k.w};color:${k.i}">
   <b>${dt.getDate()}</b><span>${esc(monName(dt.getMonth())).toUpperCase()}</span></div>
  <div style="flex:1;min-width:0">${r.items.map(it=>`<div style="font-size:calc(var(--fs)*.92)">
   ${esc(pname(it.pid))} <span class="mut">${it.out}${it.sold!=null?" → "+it.sold:""}</span></div>`).join("")}</div>
  <div class="rv">${r.settled?money(r.amount):"—"}</div></div></div>`;}).join("")
  :`<div class="empty">${esc(T().noHistory)}</div>`}
 <button class="btn g" id="hb">${esc(T().back)}</button>`;
 $("hb").onclick=()=>{S.histStore=null;render();};
}

/* ---------- calendar ---------- */
function dayBoxes(d){
 let n=0;
 dueOn(d.getDay(),weekOf(d)).forEach(s=>S.prices.filter(p=>p.store_id===s.id)
  .forEach(p=>{n+=p.default_qty||0;}));
 return n;
}
function calendarTab(){
 const now=new Date(S.today+"T12:00:00");
 const y=now.getFullYear(), m=S.calMonth==null?now.getMonth():S.calMonth;
 const head=`${hero(T().calendar,monName(m)+" "+y)}
 <div class="seg" style="grid-template-columns:1fr 1fr;margin-bottom:10px">
  <button data-cv="cal" aria-selected="${S.calView==="cal"}">${esc(T().calView)}</button>
  <button data-cv="list" aria-selected="${S.calView==="list"}">${esc(T().listView)}</button></div>
 <div class="seg" style="grid-template-columns:1fr 1fr">
  <button data-cm="-1">‹ ${esc(monName((m+11)%12))}</button>
  <button data-cm="1">${esc(monName((m+1)%12))} ›</button></div>`;
 $("app").innerHTML=head+(S.calView==="cal"?calGrid(y,m):calList(y,m));
 $("app").querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{S.calView=b.dataset.cv;render();});
 $("app").querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{
  S.calMonth=(m+ +b.dataset.cm+12)%12;render();});
 $("app").querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{S.storeOpen=b.dataset.sd;render();});
 bindCalEdit();
}
function calGrid(y,m){
 const first=new Date(y,m,1), start=first.getDay(), dim=new Date(y,m+1,0).getDate();
 const cells=[]; for(let i=0;i<start;i++) cells.push(null);
 for(let d=1;d<=dim;d++) cells.push(d);
 const hdr=[0,1,2,3,4,5,6].map(k=>`<div class="hd">${esc(dayName(k).slice(0,S.lang==="th"?2:3))}</div>`).join("");
 let totBoxes=0, totDays=0;
 const body=cells.map(d=>{
  if(!d) return `<div class="cel out"></div>`;
  const dd=new Date(y,m,d), n=dayBoxes(dd), isT=iso(dd)===S.today;
  if(n){totBoxes+=n;totDays++;}
  const c=DAY[dd.getDay()];
  return `<div class="cel ${isT?"tdy":""}"
   style="${n?`background:${c.w};color:${c.i}`:""}">
   <span>${d}</span>
   ${n?`<span style="font-size:calc(var(--fs)*.62);font-weight:700;opacity:.85">${n}</span>`
     :`<span style="font-size:calc(var(--fs)*.62);opacity:0">·</span>`}</div>`;
 }).join("");
 return `<div class="card"><div class="cal">${hdr}${body}</div></div>
 <div class="lbl">${esc(T().thisMonth)}</div>
 <div class="g2">
  <div class="k"><div class="kk">${esc(T().stops)}</div><div class="kv">${totDays}</div></div>
  <div class="k"><div class="kk">${esc(T().boxes)}</div><div class="kv">${totBoxes}</div></div></div>
 ${S.stores.map(s=>`<div class="tuck" data-sd="${s.id}">
  <span>${esc(s.name)}</span>
  <span>${(s.delivery_days||[]).map(d=>
   `<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${DAY[d].a};margin-left:5px"></span>`).join("")}
   ${(s.weeks_of_month||[]).length?`<span class="mut"> wk ${s.weeks_of_month.join(",")}</span>`:""}</span></div>`).join("")}`;
}
/* List view: every delivery day this month, with the order behind it.
   The owner can edit any of them from here. */
function calList(y,m){
 const dim=new Date(y,m+1,0).getDate();
 const days=[];
 for(let d=1;d<=dim;d++){
  const dd=new Date(y,m,d);
  const due=dueOn(dd.getDay(),weekOf(dd));
  if(due.length) days.push({dd,due,d:iso(dd)});
 }
 if(!days.length) return `<div class="empty">${esc(T().noHistory)}</div>`;
 return days.map(x=>{
  const c=DAY[x.dd.getDay()];
  const ord=orderFor(x.d);
  const lines=ord?S.orderLines.filter(l=>l.purchase_order_id===ord.id):[];
  const byProd={};
  if(lines.length) lines.forEach(l=>{byProd[l.product_id]=(byProd[l.product_id]||0)+l.qty_plain+l.qty_price_tagged;});
  else x.due.forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
   byProd[p.product_id]=(byProd[p.product_id]||0)+(p.default_qty||0);}));
  const tot=Object.keys(byProd).reduce((a,k)=>a+byProd[k],0);
  const isT=x.d===S.today;
  return `<div class="card ${isT?"on":""}">
  <div class="fr" style="margin-bottom:6px">
   <div class="dchip" style="background:${c.w};color:${c.i}">
    <b>${x.dd.getDate()}</b><span>${esc(monName(m)).toUpperCase()}</span></div>
   <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(dayName(x.dd.getDay()))}</div>
   <div class="mut">${x.due.length} ${esc(T().stops)} · ${tot} ${esc(T().boxes)}
    · ${ord?esc(ord.status):esc(T().scheduled)}</div></div></div>
  ${Object.keys(byProd).map(pid=>`<div class="row">
   <span class="rt">${esc(pname(pid))}</span>
   ${ord?`<span class="stp">
     <button data-ce="${ord.id}|${pid}|-1">−</button>
     <span class="v">${byProd[pid]}</span>
     <button data-ce="${ord.id}|${pid}|1">+</button></span>`
    :`<span class="rv">${byProd[pid]}</span>`}</div>`).join("")}
  ${ord?"":`<div class="mut" style="margin-top:6px">${esc(T().noOrder)}</div>`}
  </div>`;}).join("");
}
function bindCalEdit(){
 $("app").querySelectorAll("[data-ce]").forEach(b=>b.onclick=async()=>{
  const p=b.dataset.ce.split("|");
  const line=S.orderLines.filter(l=>l.purchase_order_id===p[0]&&l.product_id===p[1])[0];
  if(!line) return;
  const tag=line.qty_price_tagged>0;
  const cur=tag?line.qty_price_tagged:line.qty_plain;
  const nv=Math.max(0,cur+ +p[2]);
  if(tag) line.qty_price_tagged=nv; else line.qty_plain=nv;
  render();
  await db.from("purchase_order_lines")
   .update(tag?{qty_price_tagged:nv}:{qty_plain:nv}).eq("id",line.id);});
}

  <div><span class="flbl">${esc(T().name)}</span><input id="dn1" style="text-align:left"></div>
  <div><span class="flbl">${esc(T().nameTh)}</span><input id="dn2" style="text-align:left"></div></div>
  <div style="margin-top:9px"><span class="flbl">${esc(T().pin)}</span>
   <input id="dp1" type="number" inputmode="numeric"></div>
  <button class="btn acc" id="dadd">${esc(T().addDriver)}</button></div>
 <button class="btn g" id="out2">${esc(T().signOut)}</button>`;
 $("app").querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{
  S.lang=b.dataset.lg;localStorage.setItem("ss_lang",S.lang);applyType();render();});
 $("app").querySelectorAll("[data-fz]").forEach(b=>b.onclick=()=>{
  S.fz=+b.dataset.fz;localStorage.setItem("ss_fz",S.fz);applyType();render();});
 $("app").querySelectorAll("[data-drm]").forEach(b=>b.onclick=async()=>{
  const id=b.dataset.drm;S.drivers=S.drivers.filter(d=>d.id!==id);render();
  await db.from("drivers").delete().eq("id",id);});
 $("dadd").onclick=async()=>{
  const n=$("dn1").value.trim(),nt=$("dn2").value.trim(),p=$("dp1").value.trim();
  if(!n||!/^[0-9]{4}$/.test(p)) return fail("Name and a 4-digit PIN are required.");
  const {data,error}=await db.from("drivers").insert({name:n,name_th:nt||null,pin:p})
   .select("id,name,name_th,pin,active").single();
  if(error) return fail(error.message);
  S.drivers.push(data);render();};
 $("out2").onclick=async()=>{await db.auth.signOut();location.href=location.pathname;};
}

/* ---------- go ---------- */
if("serviceWorker" in navigator && location.protocol==="https:")
 navigator.serviceWorker.register("sw.js").catch(()=>{});
applyType();
db.auth.getSession().then(r=>{
 if(r.data&&r.data.session) return start();
 showEntry();
}).catch(()=>showEntry());
</script>
