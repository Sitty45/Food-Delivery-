<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101c17">
<title>สั่ง/ส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="สั่ง/ส่ง">
<style>
/* ============================================================
   สั่ง/ส่ง design system
   One rule carries the whole UI:
     • LIFTED (shadow) + chevron  = you can tap it
     • FLAT (grey fill, no shadow) = it just shows a number
     • OUTLINED                    = a control (button, toggle, stepper)
     • COLOURED BORDER + ICON DISC = warning / problem / note
   ============================================================ */
:root{
  --ink:#101c17;--ink2:#48574f;--ink3:#6c7a73;
  --page:#f2f4f2;--paper:#fff;--inset:#e6eae7;--wash:#e6eae7;
  --line:#dde3df;--line2:#b8c3bd;
  --good:#23702a;--goodw:#e6f3e7;--goodl:#9fcfa3;
  --bad:#b3261e;--badw:#fdeceb;--badl:#eea39c;
  --warn:#8a5000;--warnw:#fff2d9;--warnl:#f0c060;--warni:#e08e00;
  --info:#1d4f7a;--infow:#e9f1f9;--infol:#b5cde4;--infoi:#2f6fa8;
  --gold:#E0A020;
  --a:#101c17;--aw:#eef1ef;
  --fs:17px;--lh:1.6;
  --r1:20px;--r2:14px;
  --lift:0 1px 1px rgba(16,28,23,.05),0 4px 12px rgba(16,28,23,.09);
  --lift2:0 10px 26px rgba(16,28,23,.22);
  --tap:56px;--navh:78px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--page);height:100%}
html,body{margin:0;padding:0;overscroll-behavior:none;touch-action:manipulation}
body{min-height:100vh;min-height:100dvh;font-family:"Anuphan",system-ui,sans-serif;background:var(--page);color:var(--ink);
 font-size:var(--fs);line-height:var(--lh);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,a,input{touch-action:manipulation}
button,input{font-family:inherit;color:var(--ink);border:0;background:none}
button{cursor:pointer;-webkit-user-select:none;user-select:none;
 transition:transform .09s ease,background-color .15s ease,box-shadow .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--infoi);outline-offset:2px}
#app.enter{animation:enter .22s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app.enter,#err .alert{animation:none}button{transition:none}}
.wrap{max-width:560px;margin:0 auto;
 padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--navh) + 40px + env(safe-area-inset-bottom))}
.wrap.bare{padding:env(safe-area-inset-top) 20px calc(28px + env(safe-area-inset-bottom));
 min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.num{font-variant-numeric:tabular-nums}
.mut{font-size:calc(var(--fs)*.84);color:var(--ink3);line-height:1.45}
.nm{font-weight:600}
.grow{flex:1;min-width:0}
.center{text-align:center}
.hide{display:none!important}

/* ---------- page header ---------- */
.hero{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:4px 2px 18px}
.h1{font-size:calc(var(--fs)*1.5);font-weight:700;line-height:1.2;letter-spacing:-.015em}
.h2{font-size:calc(var(--fs)*.88);color:var(--ink2);margin-top:4px;line-height:1.4}
.htile{flex:0 0 auto;min-width:62px;height:62px;padding:0 10px;border-radius:16px;background:var(--aw);color:var(--a);
 display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dnum{font-size:calc(var(--fs)*1.42);font-weight:700;font-variant-numeric:tabular-nums}
.dmon{font-size:calc(var(--fs)*.68);font-weight:700;margin-top:5px;opacity:.85}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 2px 10px;
 font-size:calc(var(--fs)*.86);font-weight:700;color:var(--ink2)}
.lbl .n{font-weight:500;color:var(--ink3);font-size:.92em}

/* ---------- static content: white, hairline, flat ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r1);padding:16px;margin-bottom:10px}
.card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ct{font-weight:700;font-size:calc(var(--fs)*1.02);margin-bottom:4px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:var(--tap);padding:12px 16px;
 background:var(--paper);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:8px;font-size:calc(var(--fs)*.95)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.card .row+.row{border-top:1px solid var(--line)}
.rt{font-size:calc(var(--fs)*.96);min-width:0}
.rv{font-size:calc(var(--fs)*1);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr{display:flex;align-items:center;gap:13px}
.total{display:flex;justify-content:space-between;align-items:center;gap:12px;
 border-top:1.5px solid var(--ink);margin-top:6px;padding-top:12px}

/* ---------- pressable: lifted, and a chevron when it opens something ---------- */
.link{position:relative;padding-right:48px;box-shadow:var(--lift);cursor:pointer;
 transition:transform .09s ease,box-shadow .15s ease,background-color .15s ease}
.link:active,.pick:active{transform:scale(.985);box-shadow:none;background:#f8faf8}
.pick{box-shadow:var(--lift);cursor:pointer;transition:transform .09s ease,box-shadow .15s ease}
.chk{cursor:pointer}
.link::after,.door::after,.task::after{content:"";position:absolute;top:50%;right:22px;width:10px;height:10px;margin-top:-5px;
 border-top:2.5px solid var(--ink3);border-right:2.5px solid var(--ink3);border-radius:1px;transform:rotate(45deg)}
.task::after,.door.d1::after{border-color:rgba(255,255,255,.92)}

/* ---------- stats: read-only, sunk into the page. never lifted, never a chevron ---------- */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats{margin-bottom:12px}
.k{background:var(--inset);border-radius:var(--r2);padding:13px 14px;min-width:0}
.g3 .k{text-align:center;padding:12px 8px}
.kk{font-size:calc(var(--fs)*.76);color:var(--ink2);font-weight:600;line-height:1.3}
.kk::first-letter,.lbl>span:first-child::first-letter{text-transform:uppercase}
.kv{font-size:calc(var(--fs)*1.32);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
 margin-top:5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv small{font-size:.58em;font-weight:600;margin-left:2px;letter-spacing:0}

/* ---------- status panels (not tappable) ---------- */
.state{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r1);background:var(--inset);
 color:var(--ink2);margin-bottom:12px}
.state>i{font-size:30px;flex:0 0 auto}
.state.good{background:var(--goodw);color:var(--good)}
.state.c{flex-direction:column;text-align:center;padding:30px 18px;gap:6px}
.state.c>i{font-size:54px}
.tt{font-size:calc(var(--fs)*1.1);font-weight:700;line-height:1.3;display:block}
.ts{font-size:calc(var(--fs)*.86);opacity:.85;line-height:1.45;display:block;margin-top:2px}

/* ---------- the one big action of the day ---------- */
.task{position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:96px;padding:18px 54px 18px 20px;
 border-radius:var(--r1);background:var(--a);color:#fff;text-align:left;margin-bottom:12px;box-shadow:var(--lift2)}
.task>i{font-size:32px;flex:0 0 auto}
.task::after{width:12px;height:12px;margin-top:-6px;right:24px;border-width:3px 3px 0 0}

/* ---------- alerts: warnings must be impossible to miss ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-radius:16px;border:1.5px solid;
 margin:0 0 12px;font-size:calc(var(--fs)*.9);line-height:1.45;text-align:left}
.alert .ai{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 color:#fff;font-size:19px}
.alert .at{display:block;font-weight:700}
.alert .ab{display:block;margin-top:2px;opacity:.92}
.alert.warn{background:var(--warnw);border-color:var(--warnl);color:var(--warn)}.alert.warn .ai{background:var(--warni)}
.alert.bad{background:var(--badw);border-color:var(--badl);color:var(--bad)}.alert.bad .ai{background:var(--bad)}
.alert.info{background:var(--infow);border-color:var(--infol);color:var(--info)}.alert.info .ai{background:var(--infoi)}
.alert.good{background:var(--goodw);border-color:var(--goodl);color:var(--good)}.alert.good .ai{background:var(--good)}
.alert .x{flex:0 0 40px;height:40px;margin:-6px -6px -6px auto;border-radius:12px;color:inherit;font-size:20px;
 display:flex;align-items:center;justify-content:center}
#err{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);z-index:1000;padding:0 12px;pointer-events:none}
#err .alert{max-width:536px;margin:0 auto;box-shadow:var(--lift2);pointer-events:auto;
 animation:drop .22s cubic-bezier(.2,.8,.2,1)}

/* ---------- badges: small, never tappable ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--inset);
 color:var(--ink2);font-size:calc(var(--fs)*.74);font-weight:700;line-height:1.5;white-space:nowrap;vertical-align:middle}
.badge i{font-size:1.15em}
.badge.good{background:var(--goodw);color:var(--good)}
.badge.warn{background:var(--warnw);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warnl)}
.badge.bad{background:var(--badw);color:var(--bad);box-shadow:inset 0 0 0 1px var(--badl)}
.badge.ink{background:var(--ink);color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:var(--tap);padding:0 18px;
 margin-top:10px;border-radius:var(--r2);background:var(--ink);color:#fff;font-size:calc(var(--fs)*.98);
 font-weight:700;text-decoration:none;line-height:1.25}
.btn i{font-size:1.3em}
.btn.acc{background:var(--a)}
.btn.good{background:var(--good)}
.btn.danger{background:var(--bad)}
.btn.g{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.g.dt{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--badl)}
.btn.big{min-height:68px;font-size:calc(var(--fs)*1.1);border-radius:18px}
.btn[disabled]{background:var(--inset);color:var(--ink3);box-shadow:none;cursor:default}
.btn[disabled]:active{transform:none}
.help{text-align:center;font-size:calc(var(--fs)*.82);color:var(--ink3);margin-top:8px}
.acts{padding-top:18px;display:flex;flex-direction:column;gap:10px}
.acts .btn{margin-top:0}
.sm{min-height:48px;padding:0 14px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line2);
 color:var(--ink);font-size:calc(var(--fs)*.86);font-weight:600;display:inline-flex;align-items:center;
 justify-content:center;gap:6px}
.sm[data-on="1"]{background:var(--ink);color:#fff;box-shadow:none}
.sm.dt{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--badl)}
.tog{display:grid;gap:6px}
.tog .sm{padding:0;min-width:0}
.seg{display:grid;gap:4px;padding:4px;margin-bottom:12px;background:var(--inset);border-radius:16px}
.seg button{min-height:48px;border-radius:12px;color:var(--ink2);font-size:calc(var(--fs)*.9);font-weight:600;
 display:flex;align-items:center;justify-content:center;gap:6px}
.seg button i{font-size:1.2em}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:var(--lift)}
.mnav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mnav .btn{margin-top:0}

/* stepper */
.stp{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.stp button{width:48px;height:48px;border-radius:13px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line2);
 font-size:24px;font-weight:500;color:var(--ink);display:flex;align-items:center;justify-content:center;line-height:1}
.stp button:active{background:var(--inset)}
.stp .v{font-size:calc(var(--fs)*1.18);font-weight:700;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.huge{width:84px;height:84px;border-radius:24px;background:var(--paper);
 box-shadow:var(--lift),inset 0 0 0 1.5px var(--line2);font-size:36px}
.huge:active{background:var(--inset)}
.big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* checkbox */
.cb{flex:0 0 32px;height:32px;border-radius:10px;background:var(--paper);display:flex;align-items:center;
 justify-content:center;color:#fff;font-size:18px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line2)}
.cb[data-on="1"]{background:var(--good);box-shadow:none}

/* inputs */
input{width:100%;min-height:52px;border:1.5px solid var(--line2);border-radius:var(--r2);padding:10px 14px;
 font-size:calc(var(--fs)*1);background:#fbfcfb;font-variant-numeric:tabular-nums}
input[type=number]{text-align:right}
input:focus{outline:none;background:var(--paper);border-color:var(--ink);box-shadow:0 0 0 3px rgba(16,28,23,.1)}
input[disabled]{background:transparent;border-style:dashed;color:var(--ink3)}
.flbl{font-size:calc(var(--fs)*.76);color:var(--ink2);display:block;margin-bottom:5px;font-weight:600}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* date & number tiles (static) */
.days,.dchip{flex:0 0 52px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;line-height:1}
.days b,.dchip b{font-size:calc(var(--fs)*1.08);font-weight:700;font-variant-numeric:tabular-nums}
.days b i{font-size:22px}
.days span,.dchip span{font-size:calc(var(--fs)*.56);opacity:.85;margin-top:4px;font-weight:700}
.days.s{flex-basis:38px;height:38px;border-radius:11px}
.ddots{display:inline-flex;gap:4px;margin-left:7px;vertical-align:middle}
.ddot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* day picker strip */
.dstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 16px;margin:0 -2px;-webkit-overflow-scrolling:touch;
 scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dbtn{flex:0 0 56px;min-height:70px;border-radius:15px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:2px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink3)}
.dbtn.due{background:var(--dw);color:var(--di);box-shadow:var(--lift)}
.dbtn[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:var(--lift2)}
.dbtn .dwk{font-size:calc(var(--fs)*.64);font-weight:700}
.dbtn .dn{font-size:calc(var(--fs)*1.06);font-weight:700;font-variant-numeric:tabular-nums}
.dbtn .dp{width:6px;height:6px;border-radius:50%;background:currentColor}

/* ---------- tab bar ---------- */
.navwrap{position:fixed;left:0;right:0;bottom:0;z-index:900;background:rgba(255,255,255,.97);
 backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
 border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav{display:grid;max-width:560px;margin:0 auto;padding:0 6px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:var(--navh);
 padding:9px 2px 10px;color:var(--ink2);font-size:calc(var(--fs)*.78);font-weight:600;line-height:1.15}
.nav .ic{width:62px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;
 transition:background-color .15s,color .15s}
.nav i{font-size:27px}
.nav button:active{transform:none}
.nav button:active .ic{background:var(--inset)}
.nav button[aria-selected="true"]{color:var(--ink);font-weight:800}
.nav button[aria-selected="true"] .ic{background:var(--ink);color:#fff}

/* ---------- entry ---------- */
.mark{text-align:center;padding:0 0 40px}
.mw{font-size:calc(var(--fs)*2.6);font-weight:700;letter-spacing:-1px;line-height:1.35}
.mw .s{color:var(--gold)}
.mw .sl{font-weight:200;color:var(--ink3);margin:0 5px}
.msub{font-size:calc(var(--fs)*.72);color:var(--ink3);letter-spacing:.14em;margin-top:2px;font-weight:600}
.doors{display:grid;gap:12px}
.door{position:relative;width:100%;min-height:112px;border-radius:22px;display:flex;align-items:center;gap:18px;
 padding:0 54px 0 22px;text-align:left}
.door.d1{background:var(--ink);color:#fff;box-shadow:var(--lift2)}
.door.d2{background:var(--paper);box-shadow:var(--lift),inset 0 0 0 1px var(--line)}
.door>i{font-size:34px;opacity:.92}
.door-t{font-size:calc(var(--fs)*1.4);font-weight:700;line-height:1.3;display:block}
.door-s{font-size:calc(var(--fs)*.8);opacity:.72;display:block}
.dots{display:flex;justify-content:center;gap:17px;margin:26px 0 12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line2);transition:transform .14s,background .14s}
.dot.on{background:var(--a);transform:scale(1.18)}
.pmsg{display:flex;justify-content:center;align-items:center;min-height:34px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{min-height:74px;border-radius:20px;background:var(--paper);box-shadow:var(--lift),inset 0 0 0 1px var(--line);
 font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--inset)}
.pad button.blank{background:transparent;box-shadow:none}
.pad button.act{font-size:calc(var(--fs)*.9);color:var(--ink2);background:transparent;box-shadow:none;font-weight:600}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--ink3);padding:36px 20px}
.empty>i{display:block;font-size:42px;margin-bottom:8px;opacity:.7}
.spin{width:30px;height:30px;border-radius:50%;margin:40px auto;
 border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ordertxt{font-size:calc(var(--fs)*1.08);line-height:2;white-space:pre-wrap;word-break:break-word;
 font-variant-numeric:tabular-nums}
#map{height:220px;border-radius:var(--r1);margin-bottom:12px;border:1px solid var(--line);overflow:hidden;
 background:var(--inset)}
.sig{width:100%;height:140px;border:2px dashed var(--line2);border-radius:14px;background:#fbfcfb;touch-action:none;
 display:block;margin-top:6px}
.bar{display:flex;gap:3px;height:7px;margin-bottom:16px}
.bar i{flex:1;border-radius:4px;background:var(--line);display:block}
.bar i.on{background:var(--a)}
.step{display:flex;align-items:center;gap:9px;font-size:calc(var(--fs)*.86);font-weight:700;color:var(--ink2);margin:2px 0}
.step b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:inline-flex;
 align-items:center;justify-content:center;font-size:13px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:calc(var(--fs)*.66);font-weight:700;color:var(--ink3);padding:2px 0 6px}
.cel{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:1px;font-size:calc(var(--fs)*.82);font-weight:600;color:var(--ink2)}
.cel.tdy{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.cel small{font-size:calc(var(--fs)*.62);font-weight:700;opacity:.85}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div id="app"></div></div>
<div id="err" role="alert" aria-live="assertive"></div>

function pad(){

 const msg=S.pmsg==="…"?`<div class="spin" style="width:24px;height:24px;margin:0;border-width:2.5px"></div>`

 <div class="pmsg" role="status">${msg}</div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}
  <button class="blank" disabled></button><button data-k="0">0</button>

 <button class="btn g" id="bk" style="margin-top:22px">${icon("arrow-left")}${esc(T().back)}</button>`;
 $("app").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k,len));
 $("bk").onclick=()=>{S.pane="doors";S.pin="";S.pmsg="";showEntry();};

async function key(k,len){
 if(S.busy) return;
 if(k==="del"){S.pin=S.pin.slice(0,-1);S.pmsg="";return pad();}
 if(S.pin.length>=len) return;
 S.pin+=k; pad();
 if(S.pin.length<len) return;
 const p=S.pin; S.busy=true; S.pmsg="…"; pad();
 try{
  if(S.pane==="o6"){
   const {error}=await db.auth.signInWithPassword({email:LOGIN.owner,password:p});
   if(error) throw error;
   S.role="owner"; S.tab="order";
  }else{
   const {error}=await db.auth.signInWithPassword({email:LOGIN.driver,password:DRIVER_PW});
   if(error) throw error;
   const {data,error:e2}=await db.rpc("driver_by_pin",{p});
   if(e2) throw e2;
   const row=Array.isArray(data)?data[0]:data;
   if(!row){await db.auth.signOut();throw new Error(T().wrongPin);}
   S.driver=row; S.role="driver"; S.tab="today";
  }
  S.pin="";S.busy=false;await start();
 }catch(e){
  S.busy=false;S.pin="";
  S.pmsg=/invalid login/i.test(e.message||"")?T().wrongPin:(e.message||T().wrongPin);
  pad();
 }
}

/* ---------- boot ---------- */
async function start(){
 S.screen="app"; $("wrap").classList.remove("bare");
 const now=new Date(); S.dow=now.getDay(); S.today=iso(now); S.week=weekOf(now);
 S.calMonth=now.getMonth(); applyType(); clearErr();
 $("navwrap").classList.add("hide");              // no empty tab bar while loading
 $("app").innerHTML='<div class="empty"><div class="spin"></div></div>';
 try{
  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(
   S.lang==="th"?"โหลดช้าเกินไป ลองใหม่อีกครั้ง":"Taking too long — check your connection")),ms))]);
  const {data:{session}}=await withTimeout(db.auth.getSession(),10000);
  if(!session) return showEntry();
  S.user=session.user;
  if(!S.role){
   const {data:pf}=await withTimeout(db.from("profiles").select("role").eq("id",session.user.id).maybeSingle(),10000);
   S.role=pf?pf.role:"driver";
   if(S.role==="driver"&&!S.driver){await db.auth.signOut();return showEntry();}
   S.tab=S.role==="driver"?"today":"order";
  }
  await withTimeout(load(),20000);
  S.stops=buildStops();
  render();
 }catch(e){
  $("app").innerHTML=`<div style="padding-top:40px">
   ${alertBox("bad",T().loadFail,e.message||String(e),"wifi-off")}
   <button class="btn acc" id="retry">${icon("refresh")}${esc(T().retry)}</button>
   <button class="btn g" id="bail">${icon("logout")}${esc(T().signOut)}</button></div>`;
  $("retry").onclick=()=>start();
  $("bail").onclick=async()=>{try{await db.auth.signOut();}catch(x){} location.href=location.pathname;};
 }
}

 const {data:pr}=await db.from("products").select("id,name,name_th,returnable").eq("active",true);

 if(S.role==="owner"){

/* ---------- helpers ---------- */
const spOf=(s,p)=>S.prices.filter(x=>x.store_id===s&&x.product_id===p)[0];
const dueOn=(dow,wk)=>S.stores.filter(s=>(s.delivery_days||[]).indexOf(dow)>=0 &&
 (!(s.weeks_of_month||[]).length||s.weeks_of_month.indexOf(wk)>=0));
function nextDelivery(off){
 for(let i=off;i<9;i++){const d=new Date();d.setDate(d.getDate()+i);
  if(dueOn(d.getDay(),weekOf(d)).length) return d;}
 return null;
}
function orderTarget(){
 const t=nextDelivery(1); if(!t) return null;
 return Math.round((t-new Date(S.today+"T00:00:00"))/864e5)===1?t:null;
}
const runToday=()=>dueOn(S.dow,S.week);
const orderFor=d=>S.orders.filter(o=>o.for_delivery_on===d)[0]||null;
const deliveredToday=s=>S.lines.some(l=>l.deliveries.store_id===s&&l.deliveries.delivered_on===S.today);
function buildStops(){
 return runToday().map(s=>{
  const open=S.lines.filter(l=>l.settled_at==null&&l.deliveries.store_id===s.id);
  return {store:s,done:(!S.forceRun&&deliveredToday(s.id)),docket:null,
   back:open.filter(l=>isRet(l.product_id)).map(l=>({id:l.id,pid:l.product_id,out:l.qty_out,price:Number(l.unit_price),qty:0})),
   cold:open.filter(l=>!isRet(l.product_id)).map(l=>({id:l.id,pid:l.product_id,out:l.qty_out,price:Number(l.unit_price)})),
   out:S.prices.filter(p=>p.store_id===s.id).map(p=>({pid:p.product_id,price:Number(p.sell_price),
    cost:S.costs[p.product_id]||0,qty:p.default_qty||0}))};});
}
const dueFor=st=>st.back.reduce((a,b)=>a+(b.out-b.qty)*b.price,0);

const OWNER_TABS=[["order","clipboard-list"],["money","cash"],["stores","map-pin"],

   <span class="ic"><i class="ti ti-${t[1]}" aria-hidden="true"></i></span><span>${esc(T()[t[0]])}</span></button>`).join("");

let LAST_KEY="";
const screenKey=()=>[S.role,S.tab,S.sub,S.storeOpen,S.histStore,S.calView,S.storeView,
 S.calMonth,S.dv.phase,S.dv.si,S.dv.pi].join("|");
/* Every tap used to redraw the page and throw away the scroll position.
   Now: same screen keeps its place; a new screen fades in from the top. */
function render(){
 const key=screenKey(), same=(key===LAST_KEY), y=window.scrollY;
 renderInner();
 if(same){ window.scrollTo(0,y); }
 else{
  window.scrollTo(0,0);
  const a=$("app"); a.classList.remove("enter"); void a.offsetWidth; a.classList.add("enter");
 }
 LAST_KEY=key;
}

 if(S.histStore) return storeHistory();
 if(S.storeOpen) return storeDetail();
 if(S.tab==="money") return moneyTab();
 if(S.tab==="stores") return storesTab();
 if(S.tab==="calendar") return calendarTab();
 if(S.tab==="setup") return setupTab();
 if(S.sub==="order") return orderScreen();

function hero(t,s,right){

 return `<header class="hero"><div style="min-width:0">

/* ---------- owner: ORDER tab (today + order) ---------- */
function orderTab(){
 const tgt=orderTarget(), stops=S.stops||[];
 const isOrd=!!tgt, isRun=stops.length>0, quiet=!isOrd&&!isRun;
 let task="",peek="";
 if(isOrd){
  const sent=orderFor(iso(tgt));
  let boxes=0,cost=0;
  dueOn(tgt.getDay(),weekOf(tgt)).forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
   const q=oVal(s.id,p.product_id);boxes+=q;cost+=q*(S.costs[p.product_id]||0);}));
  task=sent?`<div class="state good">${icon("circle-check")}
    <span><span class="tt">${esc(T().orderSent)}</span>
    <span class="ts">${esc(T().forDay(dayName(tgt.getDay())))} · ${boxes} ${esc(T().boxes)}</span></span></div>`
   :`<button class="task" data-go="order">${icon("message-2")}
    <span><span class="tt">${esc(T().sendOrder)}</span>
    <span class="ts">${esc(T().forDay(dayName(tgt.getDay())))} · ${boxes} ${esc(T().boxes)} · ${money(cost)}</span></span></button>`;
 }else if(isRun){
  const left=stops.filter(x=>!x.done).length;
  const boxes=stops.reduce((a,s)=>a+s.out.reduce((x,o)=>x+o.qty,0),0);
  task=left===0?`<div class="state good">${icon("circle-check")}<span class="tt">${esc(T().roundDone)}</span></div>
    <button class="btn g" id="redo">${icon("refresh")}${esc(T().runAgain)}</button>`
   :`<button class="task" data-go="run">${icon("truck-delivery")}
    <span><span class="tt">${esc(T().roundOf(dayName(S.dow)))}</span>
    <span class="ts">${esc(T().stopsLoad(left,boxes))}</span></span></button>`;
 }else{
  const nx=nextDelivery(1), od=nx?new Date(nx.getTime()-864e5):null;
  task=`<div class="state">${icon("coffee")}
   <span><span class="tt" style="color:var(--ink)">${esc(T().nothingDue)}</span>
   ${od?`<span class="ts">${esc(T().nextOrder(dayName(od.getDay())))}</span>`:""}</span></div>`;
 }
 const nd=nextDelivery(1);
 if(nd&&!isOrd){
  const already=orderFor(iso(nd));
  peek=`<div class="item link" data-go="order" role="button" tabindex="0">
   <span class="nm">${esc(T().sendOrder)} · ${esc(dayName(nd.getDay()))} ${nd.getDate()}/${nd.getMonth()+1}</span>
   ${already?badge("good",T().orderSent,"check"):""}</div>`;
 }
 const slow=frozenRows().filter(r=>r.slow).length;
 const warn=slow?alertBox("warn",T().slowTitle(slow),T().slowBody,"snowflake"):"";
 $("app").innerHTML=hero(T().itsDay(dayName(S.dow)),
  isOrd?T().orderDay:isRun?T().runDay:T().quietDay)+task+warn+peek+frozenBlock(quiet)+ordersList();
 $("app").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.go;render();});
 $("app").querySelectorAll("[data-oped]").forEach(b=>b.onclick=()=>{
  S.orderPick=b.dataset.oped;S.sub="order";render();});
 const rd=$("redo"); if(rd) rd.onclick=()=>{S.forceRun=true;S.stops=buildStops();S.sub="run";render();};
}
function ordersList(){
 if(!S.orders.length) return "";
 return `<div class="lbl">${esc(T().hist)}</div>`+S.orders.slice(0,5).map(o=>{
  const dt=new Date(o.for_delivery_on+"T12:00:00");
  const lines=S.orderLines.filter(l=>l.purchase_order_id===o.id);
  const tot=lines.reduce((a,l)=>a+l.qty_plain+l.qty_price_tagged,0);
  return `<div class="card link" data-oped="${o.for_delivery_on}" role="button" tabindex="0"><div class="fr">

   ${statusBadge(o.status)}</div></div>`;
 }).join("");

function avgClear(sid,pid){
 const d=S.lines.filter(l=>l.deliveries.store_id===sid&&l.product_id===pid&&l.settled_at);
 if(!d.length) return null;
 return Math.round(d.reduce((a,l)=>a+Math.round((new Date(l.settled_at)-new Date(l.deliveries.delivered_on))/864e5),0)/d.length);
}
function frozenRows(){
 return S.lines.filter(l=>!isRet(l.product_id)&&l.settled_at==null).map(l=>{
  const st=S.stores.filter(s=>s.id===l.deliveries.store_id)[0];
  const days=Math.round((new Date(S.today)-new Date(l.deliveries.delivered_on))/864e5);
  const avg=avgClear(l.deliveries.store_id,l.product_id);
  return {name:st?st.name:"—",pid:l.product_id,qty:l.qty_out,days,avg,
   val:l.qty_out*Number(l.unit_price),slow:!!(avg&&days>avg)};})
  .sort((a,b)=>b.days-a.days);
}
function frozenBlock(full){
 const rows=frozenRows();
 if(!rows.length) return "";
 return `<div class="lbl"><span>${esc(T().frozen)}</span><span class="n">${esc(T().daysUsual)}</span></div>`+
 (full?rows:rows.filter((r,i)=>i<2||r.slow)).map(r=>`<div class="card"><div class="fr">
  <div class="days" style="background:${r.slow?"var(--badw)":"var(--goodw)"};color:${r.slow?"var(--bad)":"var(--good)"}">
   <b>${r.days}</b><span>${S.lang==="th"?"วัน":"days"}</span></div>
  <div class="grow"><div class="nm">${esc(r.name)}</div>
  <div class="mut">${esc(pname(r.pid))} ×${r.qty}${r.avg?" · "+esc(T().usually(r.avg)):""}</div>
  ${r.slow?`<div style="margin-top:5px">${badge("bad",T().slow,"alert-triangle")}</div>`:""}</div>
  <div class="rv">${money(r.val)}</div></div></div>`).join("");
}

/* ---------- order screen: pick any day, edit or delete what's there ---------- */
const oKey=(s,p)=>s+"|"+p;
function oVal(s,p){
 const k=oKey(s,p); if(S.orderQty[k]!=null) return S.orderQty[k];
 const x=spOf(s,p); return x&&x.default_qty?x.default_qty:0;
}
function dayStrip(selISO){
 const days=[];
 for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d);}
 return `<div class="dstrip" role="tablist">${days.map(d=>{
  const dISO=iso(d), due=dueOn(d.getDay(),weekOf(d)).length>0, sel=dISO===selISO, c=DAY[d.getDay()];
  return `<button class="dbtn ${due?"due":""}" data-pd="${dISO}" role="tab" aria-selected="${sel}"
   style="--dw:${c.w};--di:${c.i}">
   <span class="dwk">${esc(dayAb(d.getDay()))}</span>
   <span class="dn">${d.getDate()}</span>${due?`<span class="dp"></span>`:""}</button>`;}).join("")}</div>`;
}
function bindDayStrip(){
 $("app").querySelectorAll("[data-pd]").forEach(b=>b.onclick=()=>{
  S.orderPick=b.dataset.pd; S.copied=false; S.confirmDel=null; render();});
}
function orderScreen(){
 const fallback=orderTarget()||nextDelivery(1);
 const pickISO=S.orderPick||(fallback?iso(fallback):S.today);
 const t=new Date(pickISO+"T12:00:00");
 const list=dueOn(t.getDay(),weekOf(t));
 const ord=orderFor(pickISO);

 if(!list.length){
  $("app").innerHTML=hero(T().pickDay,"")+dayStrip(pickISO)+
   `<div class="empty">${icon("calendar-off")}${esc(T().noDelivery)}</div>`+backBtn("bk");
  bindDayStrip();
  $("bk").onclick=()=>{S.sub="home";S.orderPick=null;render();};
  return;
 }

 if(ord){ return orderExisting(pickISO,t,list,ord); }

 const byP={};
 list.forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
  const q=oVal(s.id,p.product_id); if(!q) return;
  const nm=S.prods[p.product_id]?(S.prods[p.product_id].name_th||pname(p.product_id)):pname(p.product_id);
  const g=(s.suburb||"—")+"|"+(s.price_tag_required?"t":"p");
  byP[nm]=byP[nm]||{}; byP[nm][g]=byP[nm][g]||{q:0,tag:s.price_tag_required,st:[]};
  byP[nm][g].q+=q; byP[nm][g].st.push(s.name);}));
 const L=Object.keys(byP).map(nm=>{
  const gs=Object.keys(byP[nm]).map(k=>byP[nm][k]).sort((a,b)=>(a.tag?1:0)-(b.tag?1:0)||b.q-a.q);
  return {nm,txt:nm+" ="+gs.map(g=>g.q+(g.tag?"(ติดราคา)":"")).join("+"),gs};});
 const msg="สั่งขนม\n"+L.map(l=>l.txt).join("\n");
 let boxes=0,cost=0;
 list.forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
  const q=oVal(s.id,p.product_id);boxes+=q;cost+=q*(S.costs[p.product_id]||0);}));

 $("app").innerHTML=hero(T().forDay(dayName(t.getDay())),boxes+" "+T().boxes+" · "+money(cost))+
 dayStrip(pickISO)+
 `<div class="lbl">${esc(T().msgMum)}</div>
 <div class="card"><div class="ordertxt">${esc(msg)}</div>
  <div class="badges">${L.map(l=>l.gs.map(g=>badge("",g.st.join(" + ")+" "+g.q)).join("")).join("")}</div></div>
 <div class="lbl">${esc(T().stores)}</div>
 ${list.map(s=>`<div class="card"><div class="ct">${esc(s.name)}</div>
  ${S.prices.filter(p=>p.store_id===s.id).map(p=>`<div class="row">
   <span class="rt">${esc(pname(p.product_id))}</span>
   <span class="stp"><button data-oq="${s.id}|${p.product_id}|-1" aria-label="−">−</button>
   <span class="v">${oVal(s.id,p.product_id)}</span>
   <button data-oq="${s.id}|${p.product_id}|1" aria-label="+">+</button></span></div>`).join("")}</div>`).join("")}
 <button class="btn g" id="cp">${icon(S.copied?"check":"copy")}${esc(S.copied?T().copied:T().copy)}</button>
 <button class="btn acc" id="sub" ${S.copied?"":"disabled"}>${icon("send")}${esc(T().markSent)}</button>
 ${S.copied?"":`<div class="help">${esc(T().copyFirst)}</div>`}
 ${backBtn("bk")}`;

 bindDayStrip();
 $("app").querySelectorAll("[data-oq]").forEach(b=>b.onclick=()=>{
  const p=b.dataset.oq.split("|");
  S.orderQty[oKey(p[0],p[1])]=Math.max(0,oVal(p[0],p[1])+ +p[2]);S.copied=false;render();});
 $("cp").onclick=async()=>{try{await navigator.clipboard.writeText(msg);}catch(e){}S.copied=true;render();};
 $("bk").onclick=()=>{S.sub="home";S.orderPick=null;render();};
 $("sub").onclick=async()=>{
  const b=$("sub");b.disabled=true;b.textContent="…";
  const d=pickISO;
  const {data:po,error}=await db.from("purchase_orders").insert({
   supplier_id:S.supplierId,ordered_on:S.today,for_delivery_on:d,
   sent_at:new Date().toISOString(),status:"sent"}).select("id").single();
  if(error){b.disabled=false;b.innerHTML=icon("send")+esc(T().markSent);return fail(error.message);}
  const rows=[];
  list.forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
   const q=oVal(s.id,p.product_id); if(!q) return;
   rows.push({purchase_order_id:po.id,product_id:p.product_id,store_id:s.id,
    qty_plain:s.price_tag_required?0:q,qty_price_tagged:s.price_tag_required?q:0,
    unit_cost:S.costs[p.product_id]||0});}));
  if(rows.length){
   const {data:nl}=await db.from("purchase_order_lines").insert(rows)
    .select("id,purchase_order_id,product_id,store_id,qty_plain,qty_price_tagged");
   (nl||[]).forEach(l=>S.orderLines.push(l));
  }
  S.orders.unshift({id:po.id,for_delivery_on:d,status:"sent"});
  S.sub="home";S.copied=false;S.orderPick=null;render();};
}
/* An order that's already been placed for the picked day: editable in place,
   deletable outright — this is what makes the day picker actually useful for testing. */
function orderExisting(pickISO,t,list,ord){
 const lines=S.orderLines.filter(l=>l.purchase_order_id===ord.id);
 const byProd={};
 lines.forEach(l=>{byProd[l.product_id]=(byProd[l.product_id]||0)+l.qty_plain+l.qty_price_tagged;});
 const tot=Object.keys(byProd).reduce((a,k)=>a+byProd[k],0);
 const cost=Object.keys(byProd).reduce((a,k)=>a+byProd[k]*(S.costs[k]||0),0);
 const confirming=S.confirmDel===ord.id;
 $("app").innerHTML=hero(T().forDay(dayName(t.getDay())),tot+" "+T().boxes+" · "+money(cost))+
 dayStrip(pickISO)+
 alertBox("info",T().existingOrder,T().savesNow,"send")+
 `<div class="card on">
  <div class="row" style="padding-top:0"><span class="ct" style="margin:0">${esc(T().order)}</span>${statusBadge(ord.status)}</div>
  ${Object.keys(byProd).map(pid=>`<div class="row">
   <span class="rt">${esc(pname(pid))}</span>
   <span class="stp"><button data-ce="${pid}|-1" aria-label="−">−</button>
   <span class="v">${byProd[pid]}</span>
   <button data-ce="${pid}|1" aria-label="+">+</button></span></div>`).join("")}
  <div class="mut" id="editedMsg" style="min-height:20px;text-align:right;color:var(--good);font-weight:600"></div>
 </div>
 ${confirming?`<div style="margin-top:16px">${alertBox("bad",T().deleteConfirm,"","trash")}
   <button class="btn danger" id="delYes">${icon("trash")}${esc(T().yesDelete)}</button>
   <button class="btn g" id="delNo">${esc(T().cancel)}</button></div>`
  :`<button class="btn g dt" id="del">${icon("trash")}${esc(T().deleteOrder)}</button>`}
 ${backBtn("bk")}`;

 bindDayStrip();
 $("app").querySelectorAll("[data-ce]").forEach(b=>b.onclick=async()=>{
  const p=b.dataset.ce.split("|");
  const line=lines.filter(l=>l.product_id===p[0])[0]; if(!line) return;
  const tag=line.qty_price_tagged>0;
  const cur=tag?line.qty_price_tagged:line.qty_plain;
  const nv=Math.max(0,cur+ +p[1]);
  if(tag) line.qty_price_tagged=nv; else line.qty_plain=nv;
  b.parentNode.querySelector(".v").textContent=(line.qty_plain+line.qty_price_tagged);
  const em=$("editedMsg"); if(em) em.textContent=T().edited+" ✓";
  await db.from("purchase_order_lines")
   .update(tag?{qty_price_tagged:nv}:{qty_plain:nv}).eq("id",line.id);});
 $("bk").onclick=()=>{S.sub="home";S.orderPick=null;S.confirmDel=null;render();};
 const del=$("del"); if(del) del.onclick=()=>{S.confirmDel=ord.id;render();};
 const dn=$("delNo"); if(dn) dn.onclick=()=>{S.confirmDel=null;render();};
 const dy=$("delYes"); if(dy) dy.onclick=async()=>{
  dy.disabled=true;dy.textContent="…";
  try{
   await db.from("purchase_order_lines").delete().eq("purchase_order_id",ord.id);
   const {error}=await db.from("purchase_orders").delete().eq("id",ord.id);
   if(error) throw error;
   S.orders=S.orders.filter(o=>o.id!==ord.id);
   S.orderLines=S.orderLines.filter(l=>l.purchase_order_id!==ord.id);
   S.confirmDel=null; render();
  }catch(e){ dy.disabled=false; dy.innerHTML=icon("trash")+esc(T().yesDelete); fail(e.message||String(e)); }
 };
}

/* ---------- owner: run ---------- */
function runScreen(){
 const R=S.stops||[], act=R.filter(s=>!s.done)[0];
 if(!act){
  $("app").innerHTML=hero(T().roundDone,"")+

async function saveStop(i,btn){
 const st=S.stops[i];
 if(btn){btn.disabled=true;btn.textContent="…";}
 const now=new Date().toISOString();
 try{
  for(let k=0;k<st.back.length;k++){
   const b=st.back[k];
   const {error}=await db.from("delivery_lines")
    .update({qty_back:b.qty,reason:b.qty>0?"unsold":null,settled_at:now}).eq("id",b.id);
   if(error) throw error;
   const l=S.lines.filter(x=>x.id===b.id)[0];
   if(l){l.qty_back=b.qty;l.settled_at=now;}
  }
  const amt=dueFor(st);
  if(amt>0){
   await db.from("store_payments").insert({store_id:st.store.id,amount:amt,paid_on:S.today,
    notes:S.driver?("Collected by "+S.driver.name):"Collected on delivery"});
   S.payments.push({store_id:st.store.id,amount:amt,paid_on:S.today});
  }
  const rows=st.out.filter(o=>o.qty>0);
  if(rows.length){
   const {data:del,error:de}=await db.from("deliveries").insert({
    store_id:st.store.id,delivered_on:S.today,completed_at:now,
    recorded_by:S.user?S.user.id:null,driver_ref:S.driver?S.driver.id:null,
    docket_photo:st.docket||null}).select("id").single();
   if(de) throw de;
   const {data:nl,error:le}=await db.from("delivery_lines").insert(rows.map(o=>({
    delivery_id:del.id,product_id:o.pid,supplier_id:S.supplierId,
    qty_out:o.qty,unit_price:o.price,unit_cost:o.cost})))
    .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at");
   if(le) throw le;
   (nl||[]).forEach(l=>S.lines.push(Object.assign({},l,
    {deliveries:{id:del.id,store_id:st.store.id,delivered_on:S.today}})));
  }
  st.done=true; return true;
 }catch(e){
  if(btn){btn.disabled=false;btn.textContent=T().saveStop;}
  fail(e.message||String(e)); return false;
 }
}

function balances(){
 const set=S.lines.filter(l=>l.settled_at!=null);
 const rev=set.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_price),0);
 const cost=set.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_cost),0);
 const paid=S.payments.reduce((a,p)=>a+Number(p.amount),0);
 const mumPaid=S.supPay.reduce((a,p)=>a+Number(p.amount),0);
 const flight=S.lines.filter(l=>l.settled_at==null&&isRet(l.product_id))
  .reduce((a,l)=>a+l.qty_out*Number(l.unit_price),0);
 const mth=set.filter(l=>l.deliveries.delivered_on.slice(0,7)===S.today.slice(0,7));
 const mr=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_price),0);
 const mc=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_cost),0);
 return {owed:rev-paid,flight,mum:cost-mumPaid,margin:rev-cost,month:mr-mc};
}
function batchList(){
 const M={};
 S.lines.filter(l=>isRet(l.product_id)).forEach(l=>{
  const d=l.deliveries.delivered_on;
  M[d]=M[d]||{d,stores:{},out:0,back:0,cost:0,counted:true};
  const m=M[d];m.stores[l.deliveries.store_id]=1;m.out+=l.qty_out;
  if(l.settled_at==null)m.counted=false;
  const sold=l.qty_back==null?0:(l.qty_out-l.qty_back);
  m.back+=l.qty_back||0;m.cost+=sold*Number(l.unit_cost);});
 const cl={}; S.supPay.forEach(p=>(p.covers_dates||[]).forEach(d=>{cl[d]=1;}));
 return Object.keys(M).sort().reverse().map(k=>Object.assign({},M[k],
  {stores:Object.keys(M[k].stores).length,cleared:!!cl[k]}));
}

function sigPad(cv){
 const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
 cv.width=r.width*dp;cv.height=r.height*dp;
 const x=cv.getContext("2d");x.scale(dp,dp);
 x.strokeStyle="#101c17";x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";
 let d=false;
 const pt=e=>{const b=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
  return[t.clientX-b.left,t.clientY-b.top];};
 const st=e=>{e.preventDefault();d=true;const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);};
 const mv=e=>{if(!d)return;e.preventDefault();const p=pt(e);x.lineTo(p[0],p[1]);x.stroke();
  if(!S.bDrawn){S.bDrawn=true;const o=$("sok");if(o)o.disabled=false;}};
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);
 window.addEventListener("mouseup",()=>{d=false;});
 cv.addEventListener("touchstart",st,{passive:false});
 cv.addEventListener("touchmove",mv,{passive:false});
 cv.addEventListener("touchend",()=>{d=false;});
}

function hav(a,b){const R=6371,t=x=>x*Math.PI/180;
 const dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);
 const x=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));}
const road=k=>k*1.35, mins=k=>Math.max(2,Math.round(road(k)/34*60));
const hasLL=s=>s&&isFinite(Number(s.latitude))&&isFinite(Number(s.longitude));
const ll=s=>({lat:Number(s.latitude),lng:Number(s.longitude)});
function sellPct(sid){
 const ls=S.lines.filter(l=>l.deliveries.store_id===sid&&l.settled_at&&isRet(l.product_id));
 const out=ls.reduce((a,l)=>a+l.qty_out,0),back=ls.reduce((a,l)=>a+(l.qty_back||0),0);
 return out?Math.round(100*(out-back)/out):null;
}

let MAP_HOST=null, MAP_LAYER=null, MAP_FIT="";
function drawMap(list,K){
 const slot=$("map"); if(!slot) return;
 if(typeof window.L==="undefined"){slot.innerHTML='<div class="empty">—</div>';return;}
 const kk=K||(hasLL(S.kitchen)?ll(S.kitchen):null);
 const pts=(kk?[{name:T().kitchen,lat:kk.lat,lng:kk.lng,home:1}]:[])
  .concat(list.filter(hasLL).map(s=>({name:s.name,lat:Number(s.latitude),lng:Number(s.longitude)})));
 if(!pts.length){slot.innerHTML='<div class="empty">'+esc(T().noStores)+'</div>';return;}
 try{
  if(!MAP_HOST){
   MAP_HOST=document.createElement("div");
   MAP_HOST.style.cssText="width:100%;height:100%;border-radius:inherit;overflow:hidden";
   S.map=window.L.map(MAP_HOST,{scrollWheelZoom:false,zoomControl:false});
   window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(S.map);
   MAP_LAYER=window.L.layerGroup().addTo(S.map);
  }
  slot.appendChild(MAP_HOST);           // move the live map in; tiles stay loaded
  MAP_LAYER.clearLayers();
  const acc=DAY[S.storeView==="thu"?4:S.storeView==="sun"?0:S.dow].i;
  const loop=kk?pts.concat([pts[0]]):pts;
  if(loop.length>1) window.L.polyline(loop.map(p=>[p.lat,p.lng]),
   {color:acc,weight:3,opacity:.7,dashArray:"6,5"}).addTo(MAP_LAYER);
  pts.forEach((p,i)=>window.L.marker([p.lat,p.lng],{icon:window.L.divIcon({className:"",html:
   '<div style="width:29px;height:29px;border-radius:50%;background:'+(p.home?"#93a09a":acc)+
   ';color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px Anuphan,sans-serif;'+
   'border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)">'+(p.home?"⌂":(kk?i:i+1))+'</div>',
   iconSize:[29,29],iconAnchor:[14,14]})}).addTo(MAP_LAYER).bindPopup("<b>"+esc(p.name)+"</b>"));
  const fitKey=pts.map(p=>p.lat.toFixed(4)+","+p.lng.toFixed(4)).join(";");
  const refit=()=>{ if(!S.map) return; S.map.invalidateSize();
   if(fitKey!==MAP_FIT){ S.map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[36,36]}); MAP_FIT=fitKey; } };
  requestAnimationFrame(refit); setTimeout(refit,260);
 }catch(e){slot.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}

  else x.due.forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{

 <div class="lbl">${esc(T().drivers)}</div>
 ${S.drivers.map(d=>S.confirmDrv===d.id?`<div style="margin-bottom:12px">
   ${alertBox("bad",T().removeConfirm(d.name_th||d.name),"","user-x")}
   <div class="g2"><button class="btn g" data-drn="1" style="margin-top:0">${esc(T().cancel)}</button>
   <button class="btn danger" data-dry="${d.id}" style="margin-top:0">${icon("trash")}${esc(T().yesRemove)}</button></div></div>`
  :`<div class="card"><div class="fr">
  <div class="grow"><span class="nm">${esc(d.name_th||d.name)}</span> <span class="mut">${esc(d.name)}</span>
   <div class="mut">${esc(T().pin)} <b class="num" style="color:var(--ink);letter-spacing:.08em">${esc(d.pin)}</b></div></div>
  <button class="sm dt" data-drm="${d.id}">${icon("trash")}${esc(T().remove)}</button></div></div>`).join("")}
 <div class="card">
  <div class="ct" style="margin-bottom:12px">${esc(T().addDriver)}</div>
  <div class="g2">
  <div><span class="flbl">${esc(T().name)}</span><input id="dn1" style="text-align:left" autocomplete="off"></div>
  <div><span class="flbl">${esc(T().nameTh)}</span><input id="dn2" style="text-align:left" autocomplete="off"></div></div>
  <div style="margin-top:10px"><span class="flbl">${esc(T().pin)}</span>
   <input id="dp1" type="number" inputmode="numeric" style="text-align:left"></div>
  <button class="btn acc" id="dadd">${icon("user-plus")}${esc(T().addDriver)}</button></div>
 <button class="btn g" id="out2" style="margin-top:24px">${icon("logout")}${esc(T().signOut)}</button>`;
 $("app").querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{
  S.lang=b.dataset.lg;localStorage.setItem("ss_lang",S.lang);applyType();render();});
 $("app").querySelectorAll("[data-fz]").forEach(b=>b.onclick=()=>{
  S.fz=+b.dataset.fz;localStorage.setItem("ss_fz",S.fz);applyType();render();});
 $("app").querySelectorAll("[data-drm]").forEach(b=>b.onclick=()=>{S.confirmDrv=b.dataset.drm;render();});
 $("app").querySelectorAll("[data-drn]").forEach(b=>b.onclick=()=>{S.confirmDrv=null;render();});
 $("app").querySelectorAll("[data-dry]").forEach(b=>b.onclick=async()=>{
  const id=b.dataset.dry;S.drivers=S.drivers.filter(d=>d.id!==id);S.confirmDrv=null;render();
  const {error}=await db.from("drivers").delete().eq("id",id);
  if(error) fail(error.message);});
 $("dadd").onclick=async()=>{
  const n=$("dn1").value.trim(),nt=$("dn2").value.trim(),p=$("dp1").value.trim();
  if(!n||!/^[0-9]{4}$/.test(p)) return fail(T().required);
  const {data,error}=await db.from("drivers").insert({name:n,name_th:nt||null,pin:p})
   .select("id,name,name_th,pin,active").single();
  if(error) return fail(error.message);
  S.drivers.push(data);render();};
 $("out2").onclick=async()=>{await db.auth.signOut();location.href=location.pathname;};
}

/* ---------- go ---------- */
if("serviceWorker" in navigator && location.protocol==="https:")
 navigator.serviceWorker.register("sw.js").catch(()=>{});
applyType();
db.auth.getSession().then(r=>{
 if(r.data&&r.data.session) return start();
 showEntry();
}).catch(()=>showEntry());
</script>
</body>
</html>
