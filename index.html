<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F8">
<title>สั่ง/ส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="สั่ง/ส่ง">
<style>
/* สั่ง/ส่ง — modern refresh.
   One rule carries the UI: white lifted card + ›  = tap it · soft tinted tile = just a number · coloured border + icon disc = warning.
   The accent (--a) is the signed-in role's theme colour, set by the distributor in Settings. */
:root{
 --ink:#11171C;--mut:#46525C;--faint:#66727C;--line:#DAE0E5;--paper:#fff;--wash:rgba(17,23,28,.045);--flat:rgba(17,23,28,.06);
 --bg:#E9EDF0;--a:#0B8277;--a2:#0A5F57;--aw:#E1F3F0;
 --gold:#E0A020;--good:#1E7B3C;--goodw:#E7F4EA;--bad:#B3261E;--badw:#FDEEEC;--badl:#EFB3AD;
 --warn:#8A5000;--warnw:#FFF4DE;--warnl:#F2C66E;--info:#1D4F86;--infow:#EAF2FB;--infol:#BCD2EA;
 --fs:18px;--r:22px;--r2:16px;
 --sh:0 1px 2px rgba(20,26,31,.04),0 6px 18px rgba(20,26,31,.06);
 --sh2:0 12px 30px rgba(20,26,31,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;touch-action:manipulation;overscroll-behavior:none}
body{font-family:"Sarabun",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:var(--fs);
 line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;transition:background-color .3s}
button,input,a{font-family:inherit;color:inherit;touch-action:manipulation}
button{border:0;cursor:pointer;background:none;-webkit-user-select:none;user-select:none;
 transition:transform .1s ease,background-color .15s ease,box-shadow .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.pt{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(112px + env(safe-area-inset-bottom))}
.pt.bare{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#v.enter{animation:enter .22s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#v.enter,#err .alert{animation:none}button{transition:none}}

/* greeting header */
.top{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.av{flex:0 0 44px;height:44px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:22px;box-shadow:0 0 0 4px var(--aw)}
.hi{font-size:calc(var(--fs)*1.2);font-weight:600;line-height:1.3}
.rolechip{flex:0 0 auto;background:var(--aw);color:var(--a2);border-radius:99px;padding:6px 12px;font-size:calc(var(--fs)*.8);font-weight:500}
.ptitle{font-size:calc(var(--fs)*1.6);font-weight:600;line-height:1.25;margin:4px 2px 14px}
/* page / section header */
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 2px 14px}
.h1{font-size:calc(var(--fs)*1.5);font-weight:600;line-height:1.25}
.h2{font-size:calc(var(--fs)*.9);color:var(--mut);margin-top:2px}
.hero .hd{flex:0 0 auto}
.dn,.dm{text-align:center}
.hero .hd>.dn{font-size:calc(var(--fs)*1.35);font-weight:600;line-height:1;color:var(--a2);background:var(--aw);border-radius:16px 16px 0 0;
 padding:9px 12px 2px;min-width:58px}
.hero .hd>.dm{font-size:calc(var(--fs)*.72);font-weight:500;color:var(--a2);background:var(--aw);border-radius:0 0 16px 16px;padding:2px 12px 8px}
.sbar{display:none}

/* surfaces */
.card{background:var(--paper);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);display:block;width:100%;text-align:left}
.card.on{box-shadow:0 0 0 2px var(--a),var(--sh)}
.card.bad{box-shadow:0 0 0 2px var(--bad),var(--sh)}
.card.row{padding:12px 16px}
.card.tap{position:relative;padding-right:38px;cursor:pointer}
.card.tap::after{content:"";position:absolute;right:17px;top:50%;width:9px;height:9px;margin-top:-5px;border-top:2px solid var(--faint);
 border-right:2px solid var(--faint);transform:rotate(45deg);border-radius:1px}
.card.tap:active{transform:scale(.985);background:var(--aw)}
.lbl{font-size:calc(var(--fs)*.92);font-weight:600;color:#3A4650;margin:20px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lbl>span:last-child:not(:first-child){font-weight:400}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:var(--fs)}
.card .row+.row{border-top:1px solid var(--line)}
.rv{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{font-size:calc(var(--fs)*.9);color:var(--mut);line-height:1.55}
.b{font-weight:600}
.fr{display:flex;align-items:center;gap:11px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* stats: soft tinted tiles, never tappable */
.k{background:var(--aw);border-radius:var(--r2);padding:12px 14px;min-width:0}
.k.c{text-align:center}
.kk{font-size:calc(var(--fs)*.86);color:var(--a2);font-weight:500;opacity:.85}
.kv{font-size:calc(var(--fs)*1.35);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k.tap{background:var(--paper);box-shadow:var(--sh);cursor:pointer;position:relative}
.k.tap .kk{color:var(--mut)}
.k.tap:active{transform:scale(.97)}

/* buttons: pills. accent = the one main action */
.btn{width:100%;min-height:52px;border-radius:99px;background:var(--ink);color:#fff !important;font-size:var(--fs);font-weight:600;
 margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;text-decoration:none;line-height:1.25}
.btn i{font-size:1.25em}
.btn.gold,.btn.good{background:var(--a);box-shadow:0 6px 14px -8px rgba(var(--argb),.7)}
.btn.g{background:var(--paper);color:var(--ink) !important;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.bad{background:var(--bad)}
.btn.bt{background:var(--paper);color:var(--bad) !important;box-shadow:inset 0 0 0 1.5px var(--badl)}
.btn.big{min-height:62px;font-size:calc(var(--fs)*1.06);justify-content:flex-start;padding:0 8px}
.btn.big>i:first-child{flex:0 0 46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;margin-right:6px}
.btn.big:not(:has(>i:first-child)){justify-content:center}
.btn[disabled]{background:var(--flat) !important;color:var(--faint) !important;box-shadow:none !important;cursor:default}
.btn[disabled]:active{transform:none}
.btn[disabled]>i:first-child{background:transparent}
.nomt{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--wash);border-radius:99px;padding:4px 11px;
 font-size:calc(var(--fs)*.86);font-weight:500;color:var(--mut);white-space:nowrap;line-height:1.4}
button.chip{min-height:44px;padding:0 14px;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--paper)}
.chip[data-on="1"]{background:var(--ink);color:#fff;box-shadow:none}
.chip.good{background:var(--goodw);color:var(--good)}
.chip.bad{background:var(--badw);color:var(--bad)}
.chip.warn{background:var(--warnw);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warnl)}
.chip.gold{background:#FFF1D1;color:#7A4B00}
.chip.blue{background:var(--aw);color:var(--a2)}
.sub{display:grid;gap:4px;margin-bottom:12px;background:var(--flat);border-radius:99px;padding:4px}
.sub button{min-height:46px;border-radius:99px;color:var(--mut);font-size:calc(var(--fs)*.94);font-weight:500}
.sub button[data-on="1"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 2px 8px rgba(20,26,31,.1)}
.stp{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.stp button{width:48px;height:48px;border-radius:14px;background:var(--paper);font-size:21px;color:var(--ink);
 display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.stp button:active{background:var(--aw)}
.stp .v{font-size:calc(var(--fs)*1.3);font-weight:600;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.huge{width:74px;height:74px;border-radius:22px;background:var(--paper);box-shadow:var(--sh),inset 0 0 0 1.5px var(--line);
 font-size:30px;display:flex;align-items:center;justify-content:center}
.huge:active{background:var(--aw)}
.big{font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.cb{flex:0 0 34px;height:34px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 2px #C9D1D8;
 display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.cb[data-on="1"]{background:var(--a);box-shadow:none}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:14px 15px;margin-bottom:12px;
 border:1.5px solid;font-size:calc(var(--fs)*.95);line-height:1.5}
.alert .ai{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.alert b{display:block;font-weight:600}
.alert.warn{background:var(--warnw);border-color:var(--warnl);color:var(--warn)}.alert.warn .ai{background:#E08E00}
.alert.bad{background:var(--badw);border-color:var(--badl);color:var(--bad)}.alert.bad .ai{background:var(--bad)}
.alert.good{background:var(--goodw);border-color:#A9D5B2;color:var(--good)}.alert.good .ai{background:var(--good)}
.alert.info{background:var(--infow);border-color:var(--infol);color:var(--info)}.alert.info .ai{background:#2F6FA8}
.alert .x{margin:-6px -6px -6px auto;width:44px;height:44px;font-size:20px;color:inherit;flex:0 0 auto}
#err{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);z-index:1000;padding:0 12px;pointer-events:none}
#err .alert{max-width:516px;margin:0 auto;box-shadow:var(--sh2);pointer-events:auto;animation:drop .22s ease}

/* week grid: every day of the week visible at once; days with orders filled in the theme colour with a count */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;min-height:46px}
.wkl{font-weight:600;font-size:calc(var(--fs)*1.02)}
.wkg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:10px}
.wkg button{height:84px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;
 background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mut);position:relative}
.wkg .w{font-size:calc(var(--fs)*.84);font-weight:500;line-height:1.1}
.wkg .n{font-size:calc(var(--fs)*1.25);font-weight:600;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.wkg .c{min-width:24px;height:24px;border-radius:12px;padding:0 5px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;font-style:normal}
.wkg .tl{position:absolute;left:3px;right:3px;bottom:-1px;transform:translateY(55%);background:var(--a);color:#fff;border-radius:8px;
 font-size:11.5px;font-weight:600;line-height:1.5;text-align:center;white-space:nowrap;overflow:hidden}
.wkg button[disabled]{opacity:.35;box-shadow:none;background:transparent}
.wkg .due{box-shadow:none;outline:2px dashed var(--a);outline-offset:-2px}
.wkg .has{background:var(--aw);box-shadow:inset 0 0 0 2.5px var(--a);color:var(--a2);outline:0}
.wkg .has .n{color:var(--a2)}
.wkg .has .c{background:var(--a);color:#fff}
.wkg .c.p{background:#FFB020 !important;color:#1A1300 !important}
.wkg .c:empty{background:transparent !important}
.tf[type=date]{min-width:0;display:block;-webkit-appearance:none;appearance:none;text-align:left}
.wkg button[data-sel="1"]{background:var(--ink);box-shadow:0 8px 18px -8px rgba(17,23,28,.6);color:rgba(255,255,255,.85);outline:0}
.wkg button[data-sel="1"] .n{color:#fff}
.wkg button[data-sel="1"] .c{background:#fff;color:var(--ink)}
.wkg{margin-bottom:22px !important}
.wkbtns{display:none}
.wkbtns .btn{margin:0;min-height:52px;font-size:calc(var(--fs)*.9);font-weight:500;padding:0 10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 4px 16px;font-size:calc(var(--fs)*.86);color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:6px;display:inline-block}
.legend .lh{background:var(--aw);box-shadow:inset 0 0 0 2px var(--a)}
.legend .lp{background:#FFB020;border-radius:50%}
.legend .lu{outline:1.5px dashed var(--a);outline-offset:-2px}

/* map, inputs, misc */
#map{height:200px;border-radius:var(--r);margin-bottom:12px;background:#E8EEEC;overflow:hidden;box-shadow:var(--sh)}
.ph{width:100%;aspect-ratio:16/9;border-radius:16px;background:var(--wash);display:flex;align-items:center;
 justify-content:center;color:var(--faint);font-size:26px;margin-bottom:10px}
.tf{width:100%;min-height:52px;border:1.5px solid #C9D1D8;border-radius:14px;padding:0 14px;font-size:max(16px,var(--fs));background:#FBFCFD}
.tf:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 4px var(--aw)}
.tf[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.flbl{font-size:calc(var(--fs)*.9);color:var(--mut);margin:0 0 5px;display:block;font-weight:500}
.fld{margin-bottom:12px}
.sig{width:100%;height:130px;border:1.5px dashed #C9D1D8;border-radius:16px;background:var(--wash);margin-top:6px;touch-action:none;display:block}
.bar{display:flex;gap:4px;height:6px;margin:2px 0 14px}
.bar i{flex:1;border-radius:3px;background:var(--line)}.bar i.on{background:var(--a)}
.empty{text-align:center;color:var(--mut);padding:28px 12px;font-size:calc(var(--fs)*.95)}
.spin{width:30px;height:30px;border-radius:50%;margin:48px auto;border:3px solid var(--line);border-top-color:var(--a);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{display:block;width:100%;background:var(--a);border-radius:8px 8px 3px 3px;min-height:3px}
.bars i.neg{background:var(--bad)}
.bars span{font-size:calc(var(--fs)*.68);color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--a);height:32px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.pinm{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;
 font:600 13px Sarabun,sans-serif;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.3);background:var(--a)}
.when{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:6px;font-size:calc(var(--fs)*.92);line-height:1.4}
.when .wl{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.when .wl i{font-size:1.15em;color:var(--faint)}
.when .wk{color:var(--mut)}
.when b{font-weight:600}
.dtile{flex:0 0 44px;height:48px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
 background:var(--aw);color:var(--a2)}
.dtile b{font-size:calc(var(--fs)*1.12);font-weight:600}.dtile span{font-size:calc(var(--fs)*.72);font-weight:500}
.th{flex:0 0 auto;border-radius:12px;object-fit:cover;background:var(--wash);display:inline-flex;align-items:center;
 justify-content:center;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block;background:var(--wash)}
.shopph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;display:block;margin-bottom:12px;background:var(--wash)}
.pick{box-shadow:var(--sh);cursor:pointer}.pick:active{transform:scale(.985)}
/* driver: end-of-round card */
.thanks{background:var(--paper);border-radius:28px;box-shadow:var(--sh2);padding:26px 20px 20px;text-align:center;margin:10px 0 12px}
.thanks .ok{width:60px;height:60px;border-radius:50%;margin:0 auto 10px;background:var(--aw);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:36px}
.thanks .cash{background:var(--wash);border-radius:18px;padding:14px;margin-top:14px}
/* theme picker */
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.sw{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.sw[data-on="1"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
/* slide to confirm */
.slide{position:relative;height:56px;border-radius:99px;background:var(--badw);box-shadow:inset 0 0 0 1.5px var(--badl);
 overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;margin-top:4px}
.slide .fill{position:absolute;left:0;top:0;bottom:0;width:56px;background:rgba(179,38,30,.2);border-radius:99px}
.slide span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:56px;
 color:var(--bad);font-weight:600;pointer-events:none}
.slide .knob{position:absolute;left:0;top:0;width:56px;height:56px;border-radius:50%;background:var(--bad);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 2px 8px rgba(179,38,30,.4);touch-action:none;cursor:grab}

/* weather & events */
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-4px 2px 14px}
.ctx .wxl{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);margin-right:2px}
.ctx .wxl i{font-size:1.35em;color:var(--a)}
.chip.wxc{background:var(--infow);color:var(--info)}
.chip.evc{background:#FFF1D1;color:#6B4200}
button.chip.evc{box-shadow:inset 0 0 0 1.5px #F2C66E}
.wkg .evf{position:absolute;top:3px;right:4px;color:#B7791F;font-size:14px;line-height:1}
.wkg button[data-sel="1"] .evf{color:#FFD27A}
.legend .lf{color:#B7791F;font-size:1.1em;display:inline-flex}
.hbar{height:12px;border-radius:6px;background:var(--flat);overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;border-radius:6px;background:var(--a)}
.eff{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:10px 0}
.card .eff+.eff{border-top:1px solid var(--line)}
.eff .d{font-weight:600;font-size:calc(var(--fs)*.9);white-space:nowrap}
/* short lists inside one card */
button.card,.lrow{font-size:var(--fs)}
.card.list{padding:2px 18px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:58px;padding:10px 0;position:relative}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow.tap{padding-right:26px}
.lrow.tap::after{content:"";position:absolute;right:4px;top:50%;width:9px;height:9px;margin-top:-5px;border-top:2px solid var(--faint);
 border-right:2px solid var(--faint);transform:rotate(45deg)}
.lrow:active{background:var(--aw)}
div.lrow:active{background:none}
.wkn{flex:0 0 46px;height:46px;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);font-size:22px;
 display:flex;align-items:center;justify-content:center;color:var(--ink)}

/* Open-Meteo: free, no account. Past 92 days are observed weather, the next 14 are forecast.
   Saved into weather_days so every phone and the analysis use the same numbers. Refreshed at most every 3 hours. */
async function refreshWeather(){
 let last=0;try{last=+localStorage.getItem("ss_wx_at")||0;}catch(e){}
 if(S.weather[S.today]&&S.weather[addDays(S.today,7)]&&Date.now()-last<3*3600e3) return false;
 const {lat,lng}=wxPoint();
 const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lng+
  "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Australia%2FSydney&past_days=92&forecast_days=14");
 if(!r.ok) return false;
 const dd=(await r.json()).daily;if(!dd||!dd.time) return false;
 const now=new Date().toISOString();
 const rows=dd.time.map((t,i)=>({day:t,tmax:dd.temperature_2m_max[i],tmin:dd.temperature_2m_min[i],rain_mm:dd.precipitation_sum[i],code:dd.weather_code[i],fetched_at:now}))
  .filter(x=>x.tmax!=null);
 rows.forEach(x=>{S.weather[x.day]={tmax:x.tmax,tmin:x.tmin,rain_mm:x.rain_mm,code:x.code};});
 try{localStorage.setItem("ss_wx_at",String(Date.now()));}catch(e){}
 db.from("weather_days").upsert(rows,{onConflict:"day"}).then(()=>{},()=>{});
 return true;
}
/* NSW public holidays, if the free holiday service answers (it's optional; events can always be added by hand) */
function parseHolidays(arr){
 const txt=n=>typeof n==="string"?n:Array.isArray(n)?((n.find(x=>/en/i.test(x.language||x.lang||""))||n[0]||{}).text||""):"";
 return (Array.isArray(arr)?arr:[]).filter(h=>{
  const subs=h.subdivisionCodes||h.counties||null;
  const nat=h.nationalHoliday!=null?h.nationalHoliday:h.global!=null?h.global:!subs;
  return nat||(Array.isArray(subs)&&subs.some(c=>/NSW/i.test(String(c))));
 }).map(h=>({date:String(h.date||h.startDate||"").slice(0,10),name:txt(h.name)||txt(h.localName)})).filter(h=>h.date&&h.name);
}
async function loadHolidays(){
 const y=+S.today.slice(0,4),m=+S.today.slice(5,7),years=[y];
 if(m<=3) years.push(y-1); if(m>=10) years.push(y+1);
 const out=[];
 for(const yr of years){
  let c=null;try{c=JSON.parse(localStorage.getItem("ss_hol_"+yr)||"null");}catch(e){}
  if(!c||Date.now()-c.at>30*864e5){
   let list=[];
   for(const url of ["https://nagerholidays.com/api/v4/Holidays/AU/"+yr,"https://date.nager.at/api/v3/PublicHolidays/"+yr+"/AU"]){
    try{const r=await fetch(url);if(r.ok){list=parseHolidays(await r.json());if(list.length)break;}}catch(e){}
   }
   c={at:Date.now(),list};
   if(list.length) try{localStorage.setItem("ss_hol_"+yr,JSON.stringify(c));}catch(e){}
  }
  out.push(...c.list);
 }
 const was=JSON.stringify(S.holidays);S.holidays=out;return was!==JSON.stringify(out);
}

/* =================== keep your place =================== */
/* iPhones often reload a home-screen app when you switch to Maps and back, which wiped the round.
   The round in progress (which order, which shop, which step, counts typed so far, photos) and the
   current tab/day are saved on the phone after every tap and restored on start. */
const RKEY="ss_round",NKEY="ss_nav";
function saveProgress(){
 try{
  if(!S.acct||S.screen!=="app") return;
  localStorage.setItem(NKEY,JSON.stringify({acct:S.acct.id,tab:S.tab,pick:S.pick,at:Date.now()}));
  if(!isDriver()) return;
  if(!S.round||!S.stops){localStorage.removeItem(RKEY);return;}
  const d={date:S.today,acct:S.acct.id,round:S.round,
   dv:{phase:S.dv.phase,si:S.dv.si,pi:S.dv.pi,loaded:S.dv.loaded},
   stops:S.stops.map(st=>({sid:st.store.id,got:st.got||0,back:st.back.map(b=>[b.pid,b.qty]),out:st.out.map(o=>[o.pid,o.qty])}))};
  localStorage.setItem(RKEY,JSON.stringify(d));
  try{localStorage.setItem(RKEY+"_ph",JSON.stringify(S.dv.photos||[]));}catch(e){localStorage.removeItem(RKEY+"_ph");}
 }catch(e){}
}
function clearProgress(){try{localStorage.removeItem(RKEY);localStorage.removeItem(RKEY+"_ph");}catch(e){}}
function restoreNav(){
 try{const n=JSON.parse(localStorage.getItem(NKEY)||"null");
  if(n&&S.acct&&n.acct===S.acct.id&&Date.now()-n.at<6*3600e3){if(n.tab)S.tab=n.tab;if(n.pick)S.pick=n.pick;}}catch(e){}
}
function restoreRound(){
 if(!isDriver()) return;
 let d=null;try{d=JSON.parse(localStorage.getItem(RKEY)||"null");}catch(e){}
 if(!d||d.date!==S.today||d.acct!==S.acct.id) return clearProgress();
 const o=S.orders.find(x=>x.id===d.round);
 if(!o) return clearProgress();
 S.round=o.id;S.stops=buildStops(o);
 d.stops.forEach(x=>{const st=S.stops.find(y=>y.store.id===x.sid);if(!st)return;
  if(x.got) st.got=x.got;
  x.back.forEach(([pid,q])=>{const b=st.back.find(y=>y.pid===pid);if(b)b.qty=q;});
  x.out.forEach(([pid,q])=>{const e=st.out.find(y=>y.pid===pid);if(e)e.qty=q;});});
 S.dv=Object.assign({phase:"brief",si:0,pi:0,loaded:{},photos:[]},d.dv);
 try{S.dv.photos=JSON.parse(localStorage.getItem(RKEY+"_ph")||"[]");}catch(e){S.dv.photos=[];}
 S.dv.photos=S.dv.photos.map((p,i)=>typeof p==="string"?{id:"old"+i,sid:null,src:p,at:new Date().toISOString()}:p);
 setTimeout(()=>S.dv.photos.forEach(p=>{if(!p.url)phUpload(p);}),0);
 // if the shop we were at got saved before the reload, move on to the next one
 const mid=["go","drop","count","money"].includes(S.dv.phase);
 if(mid&&(!S.stops[S.dv.si]||S.stops[S.dv.si].done)){
  const n=nextTodo(0);
  if(n<0) S.dv.phase="done"; else {S.dv.si=n;S.dv.pi=0;S.dv.phase="go";}
 }
 if(S.dv.phase==="count"){const st=S.stops[S.dv.si];if(!st.back.length)S.dv.phase="drop";else S.dv.pi=Math.min(S.dv.pi,st.back.length-1);}
 S.tab="round";
}

/* days that have orders are filled in the theme colour with a count; amber count = something waiting for the supplier */
/* One week (Sun–Sat) always fully on screen. Days with orders are filled in the theme colour with a count;
   amber count = something waiting for the supplier. Week buttons have words, not just arrows. */
function dayStrip(sel,from,to,mark,act){
 act=act||"pick";
 const min=addDays(S.today,from),max=addDays(S.today,to);
 const start=addDays(sel,-dOf(sel).getDay()),end=addDays(start,6);
 let h="";
 for(let i=0;i<7;i++){
  const dISO=addDays(start,i),d=dOf(dISO),off=dISO<min||dISO>max;
  const os=ordersOn(dISO).filter(o=>o.sup_status!=="rejected"),n=os.length,pend=os.some(o=>o.sup_status==="pending");
  const due=!n&&mark&&mark(dISO,d),isSel=dISO===sel,tdy=dISO===S.today;
  h+=`<button data-a="${act}" data-x="${dISO}" data-sel="${isSel?1:0}" class="${n?"has":due?"due":""} ${tdy?"tdy":""}" ${off?"disabled":""}
   aria-label="${esc(dayName(d.getDay())+" "+d.getDate()+" "+monName(d.getMonth()))}${n?" · "+esc(T().ordersN(n)):""}">
   <span class="w">${esc(dayAb(d.getDay()))}</span><span class="n">${d.getDate()}</span>
   <i class="c ${pend?"p":""}">${n||""}</i>${tdy?`<span class="tl">${esc(T().relToday)}</span>`:""}${eventsOn(dISO).length?`<span class="evf">${ic("flag-3")}</span>`:""}</button>`;
 }
 const prevT=start<=min?null:(addDays(sel,-7)<min?min:addDays(sel,-7));
 const nextT=end>=max?null:(addDays(sel,7)>max?max:addDays(sel,7));
 const showToday=!(S.today>=start&&S.today<=end)&&S.today>=min&&S.today<=max;
 return `<div class="wkhead"><button class="wkn" data-a="${act}" data-x="${prevT||""}" ${prevT?"":"disabled"} aria-label="${esc(T().prevWeek)}">${ic("chevron-left")}</button>
  <span class="wkl">${esc(shortDate(start))} – ${esc(shortDate(end))}
   ${showToday?`<button class="chip" data-a="${act}" data-x="${S.today}" style="margin-top:4px">${ic("calendar")}${esc(T().backToday)}</button>`:""}</span>
  <button class="wkn" data-a="${act}" data-x="${nextT||""}" ${nextT?"":"disabled"} aria-label="${esc(T().nextWeek)}">${ic("chevron-right")}</button></div>
 <div class="wkg">${h}</div>`;
}

async function saveOrder(btn){
 const ob=S.ob,rows=[];
 Object.keys(ob.stores).forEach(sid=>{const s=storeOf(sid);Object.keys(ob.stores[sid]).forEach(pid=>{
  const n=ob.stores[sid][pid];if(!n)return;
  rows.push({product_id:pid,store_id:sid,qty_plain:s&&s.price_tag_required?0:n,qty_price_tagged:s&&s.price_tag_required?n:0,unit_cost:S.costs[pid]||0});});});
 if(!rows.length) return fail(T().emptyOrder);
 btn.disabled=true;
 try{
  let id=ob.id;
  if(id){
   const changed=JSON.stringify(ob.stores)!==ob.orig;
   const patch={recurring:ob.recurring,for_delivery_on:ob.date,driver_id:ob.driver||null};
   if(changed) patch.sup_adjusted=false;
   const {error}=await db.from("purchase_orders").update(patch).eq("id",id);if(error) throw error;
   if(changed){
    const {error:e1}=await db.from("purchase_order_lines").delete().eq("purchase_order_id",id);if(e1) throw e1;
    const {error:e2}=await db.from("purchase_order_lines").insert(rows.map(r=>Object.assign({purchase_order_id:id},r)));if(e2) throw e2;
   }
  }else{
   if(!S.supplier) throw new Error(T().noSupplier);
   const now=new Date().toISOString();
   // straight to production: no answer step
   const {data,error}=await db.from("purchase_orders").insert({supplier_id:S.supplier.id,ordered_on:S.today,for_delivery_on:ob.date,
    label:null,driver_id:ob.driver||null,recurring:ob.recurring,status:"sent",sent_at:now,
    ordered_by:me(),sup_status:"accepted",sup_at:now,sup_seen:true}).select("id").single();
   if(error) throw error;id=data.id;
   const {error:e2}=await db.from("purchase_order_lines").insert(rows.map(r=>Object.assign({purchase_order_id:id},r)));if(e2) throw e2;
  }
  if(ob.driver){try{localStorage.setItem("ss_drv_"+me(),ob.driver);}catch(e){}}
  await reloadOrders();S.pick=ob.date;S.ob=null;S.stops=null;render();
 }catch(e){btn.disabled=false;fail(e.message||String(e));}
}
async function deleteOrder(btn){

  const {error}=await db.from("purchase_orders").delete().eq("id",id);if(error) throw error;
  S.orders=S.orders.filter(o=>o.id!==id);S.ob=null;S.stops=null;render();

}

/* =================== money (shared by distributor & supplier) =================== */
/* A lot = everything delivered on one date. It moves through:
   count (waiting for leftovers) -> check (distributor checks wastage & signs) -> sup (supplier signs) -> closed */
function lots(rid){
 rid=rid||me();
 const M={};
 linesOf(rid).filter(l=>isRet(l.product_id)).forEach(l=>{
  const d=l.deliveries.delivered_on,sid=l.deliveries.store_id;
  const m=M[d]=M[d]||{d,stores:{},items:{},cost:0,out:0,back:0,counted:true,collected:null};
  const it=m.items[l.product_id]=m.items[l.product_id]||{pid:l.product_id,out:0,sold:0,left:0};
  const ss=(m.stores[sid]=m.stores[sid]||{})[l.product_id]=(m.stores[sid]||{})[l.product_id]||{out:0,left:0,counted:true};
  it.out+=l.qty_out;m.out+=l.qty_out;ss.out+=l.qty_out;
  if(!l.settled_at){m.counted=false;ss.counted=false;}
  else{const b=l.qty_back||0,sold=l.qty_out-b;it.sold+=sold;it.left+=b;ss.left+=b;m.back+=b;m.cost+=sold*Number(l.unit_cost);
   const cd=iso(new Date(l.settled_at));if(!m.collected||cd>m.collected)m.collected=cd;}
 });
 const dist=distOf(rid);
 const paid={};S.supPay.filter(p=>p.reseller_id===rid).forEach(p=>(p.covers_dates||[]).forEach(d=>{paid[d]=1;}));
 const so={};S.signoffs.filter(x=>x.reseller_id===rid).forEach(x=>{so[x.lot_date]=x;});
 return Object.values(M).sort((a,b)=>a.d<b.d?1:-1).map(m=>{
  const o=so[m.d]||null;
  m.r=rid;m.k=rid+"_"+m.d;m.so=o;m.waste=m.out?Math.round(100*m.back/m.out):0;
  // a distributor's own deliveries close as soon as they are counted: there is nobody to sign them off
  m.state=!dist?(m.counted?"closed":"count"):paid[m.d]||(o&&o.sup_signed_at)?"closed":o&&o.dist_signed_at?"sup":m.counted?"check":"count";
  return m;});
}
const allLots=rid=>rid?lots(rid):resellers().flatMap(a=>lots(a.id));
const listFor=state=>state==="check"?lots(me()).filter(x=>x.state==="check"):myResellers().flatMap(a=>lots(a.id)).filter(x=>x.state==="sup");
function balances(rid){
 const L=rid?linesOf(rid):S.lines,set=L.filter(l=>l.settled_at);
 const sold=l=>l.qty_out-(l.qty_back||0);
 const rev=set.reduce((a,l)=>a+sold(l)*Number(l.unit_price),0),cost=set.reduce((a,l)=>a+sold(l)*Number(l.unit_cost),0);
 const paid=(rid?paysOf(rid):S.payments).reduce((a,p)=>a+Number(p.amount),0);
 const supPaid=S.supPay.filter(p=>!rid||p.reseller_id===rid).reduce((a,p)=>a+Number(p.amount),0);
 const flight=L.filter(l=>!l.settled_at&&isRet(l.product_id)).reduce((a,l)=>a+l.qty_out*Number(l.unit_price),0);
 const m=S.today.slice(0,7),mt=set.filter(l=>l.deliveries.delivered_on.slice(0,7)===m);
 return {owed:rev-paid,flight,sup:cost-supPaid,margin:rev-cost,
  month:mt.reduce((a,l)=>a+sold(l)*(Number(l.unit_price)-Number(l.unit_cost)),0)};
}

function sigPad(cv,state){
 if(!cv) return;
 const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
 cv.width=r.width*dp;cv.height=r.height*dp;
 const x=cv.getContext("2d");x.scale(dp,dp);x.strokeStyle="#101c17";x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";
 let d=false;
 const pt=e=>{const b=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top];};
 const st=e=>{e.preventDefault();d=true;const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);};
 const mv=e=>{if(!d)return;e.preventDefault();const p=pt(e);x.lineTo(p[0],p[1]);x.stroke();
  if(!S.sigOk[state]){S.sigOk[state]=true;const o=$("ok-"+state);if(o)o.disabled=false;}};
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);window.addEventListener("mouseup",()=>{d=false;});
 cv.addEventListener("touchstart",st,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("touchend",()=>{d=false;});
}

/* What moved sales: every counted lot, grouped by the weather and events while it was on the shelf.
   "Sold %" = boxes sold / boxes left out, fresh (returnable) desserts only, weighted by boxes. */
function salesEffects(){
 const L=allLots(S.statR).filter(x=>x.state!=="count"&&x.out>0).map(x=>({x,c:lotCtx(x),sold:x.out-x.back,out:x.out}));
 const pct=a=>{const o=a.reduce((t,y)=>t+y.out,0);return o?Math.round(100*a.reduce((t,y)=>t+y.sold,0)/o):null;};
 const g=(label,list)=>({label,n:list.length,p:pct(list)});
 const wT=L.filter(y=>y.c.tavg!=null),wW=L.filter(y=>y.c.has);
 const temp=[g(T().hot,wT.filter(y=>y.c.tavg>=30)),g(T().warm,wT.filter(y=>y.c.tavg>=25&&y.c.tavg<30)),g(T().cool,wT.filter(y=>y.c.tavg<25))];
 const rain=[g(T().rainy,wW.filter(y=>y.c.rain>=5)),g(T().dryDays,wW.filter(y=>y.c.rain<5))];
 const ev=[g(T().withEvent,L.filter(y=>y.c.evs.length)),g(T().noEvent,L.filter(y=>!y.c.evs.length))];
 const day=[0,1,2,3,4,5,6].map(k=>g(dayName(k),L.filter(y=>dOf(y.x.d).getDay()===k))).filter(x=>x.n);
 return {L,all:pct(L),temp,rain,ev,day};
}

/* slide-to-confirm: has to be dragged from the left edge all the way across; a tap does nothing */
function bindSlide(){
 const tr=$("slide"),kn=$("knob"),fl=$("sfill");if(!tr) return;
 let x0=null,max=0,x=0;
 const K=kn.offsetWidth||56;const set=v=>{x=Math.max(0,Math.min(max,v));kn.style.transform=`translateX(${x}px)`;fl.style.width=(x+K)+"px";kn.setAttribute("aria-valuenow",Math.round(100*x/max));};
 kn.addEventListener("pointerdown",e=>{e.preventDefault();kn.setPointerCapture(e.pointerId);max=tr.clientWidth-K;x0=e.clientX-x;kn.style.transition="none";fl.style.transition="none";});
 kn.addEventListener("pointermove",e=>{if(x0==null)return;set(e.clientX-x0);});
 const end=()=>{if(x0==null)return;x0=null;
  if(x>=max*.96){set(max);$("stxt").textContent=T().resetBusy;doReset();}
  else{kn.style.transition="transform .25s ease";fl.style.transition="width .25s ease";set(0);}};
 kn.addEventListener("pointerup",end);kn.addEventListener("pointercancel",end);
}

/* =================== DRIVER =================== */
function buildStops(o){
 const per={};
 o.lines.forEach(l=>{const n=qty(l);if(!n)return;
  per[l.store_id]=per[l.store_id]||{};per[l.store_id][l.product_id]=(per[l.store_id][l.product_id]||0)+n;});
 return S.stores.filter(s=>per[s.id]).map(s=>{
  // leftovers belong to the LAST lot at this shop (anything delivered before today and not counted yet), never today's drop
  const open=S.lines.filter(l=>!l.settled_at&&l.deliveries.store_id===s.id&&l.deliveries.delivered_on<S.today&&isRet(l.product_id))
   .sort((a,b)=>a.deliveries.delivered_on<b.deliveries.delivered_on?1:-1);
  const back={};
  open.forEach(l=>{const b=back[l.product_id]=back[l.product_id]||{pid:l.product_id,out:0,qty:0,lines:[],date:l.deliveries.delivered_on};
   b.out+=l.qty_out;b.lines.push({id:l.id,out:l.qty_out,price:Number(l.unit_price)});});
  // a stop is done when THIS order has been delivered there; another round to the same shop today doesn't count
  return {store:s,done:S.dels.some(d=>d.purchase_order_id===o.id&&d.store_id===s.id),back:Object.values(back),
   out:Object.keys(per[s.id]).map(pid=>{const sp=spOf(s.id,pid);
    return {pid,qty:per[s.id][pid],price:sp?Number(sp.sell_price):0,cost:S.costs[pid]||0};})};});
}
/* leftovers are put against the newest stock first; the rest of each line counts as sold */
function alloc(b){let left=b.qty;return b.lines.map(l=>{const bk=Math.min(left,l.out);left-=bk;return {id:l.id,back:bk,sold:l.out-bk,price:l.price};});}
const dueFor=st=>st.back.reduce((a,b)=>a+alloc(b).reduce((x,l)=>x+l.sold*l.price,0),0);
function nextTodo(from){const R=S.stops;for(let i=from;i<R.length;i++) if(!R[i].done) return i;return -1;}
function dvBar(){return `<div class="bar">${S.stops.map((s,i)=>`<i class="${s.done||i<=S.dv.si||S.dv.phase==="done"?"on":""}"></i>`).join("")}</div>`;}
function driverRound(){
 const o=S.round&&S.orders.find(x=>x.id===S.round);
 if(!o){S.round=null;S.stops=null;return roundList();}
 if(!S.stops) S.stops=buildStops(o);
 const R=S.stops,dv=S.dv;
 if(dv.phase!=="done"&&nextTodo(0)<0) return band(statusBar())+`<div class="card center" style="padding:26px 14px;background:var(--goodw);color:var(--good)">
  <div style="font-size:44px;line-height:1">✓</div><div class="b" style="font-size:calc(var(--fs)*1.2);margin-top:6px">${esc(orderTitle(o))} · ${esc(T().roundDone)}</div></div>
  <button class="btn g" data-a="roundBack">${ic("arrow-left")}${esc(T().backRounds)}</button>`;
 if(dv.phase==="brief") return dvBriefV(R,o);
 if(dv.phase==="done") return dvDoneV(R);
 const st=R[dv.si];
 if(dv.phase==="go") return dvGoV(st,R);
 if(dv.phase==="count") return dvCountV(st);
 if(dv.phase==="money") return dvMoneyV(st);
 return dvDropV(st);
}

function phUpload(p){
 if(p.url) return Promise.resolve();
 if(PH_PR.has(p.id)) return PH_PR.get(p.id);

   const path="rounds/"+S.today+"/"+(S.round||"x")+"/"+p.id+".jpg";
   const {error}=await db.storage.from("photos").upload(path,blob,{contentType:"image/jpeg",upsert:true});

   if(S.tab==="round"&&S.screen==="app") render();

async function saveStop(st){
 // one call, one transaction on the server: today's drop + last lot's leftovers + the cash.
 // All or nothing, and safe to repeat (a second tap after a lost reply changes nothing).
 const back=[];st.back.forEach(b=>alloc(b).forEach(a=>back.push({id:a.id,back:a.back})));
 const {data:r,error}=await db.rpc("finish_stop",{p:{order:S.round,store:st.store.id,day:S.today,
  driver:isDriver()?S.acct.id:null,note:"Collected by "+(S.acct.name||""),
  back,out:st.out.filter(o=>o.qty>0).map(o=>({product_id:o.pid,supplier_id:S.supplier?S.supplier.id:null,qty_out:o.qty,unit_price:o.price,unit_cost:o.cost}))}});
 if(error) throw error;
 const at=r.at||new Date().toISOString();
 if(!S.dels.some(d=>d.id===r.delivery_id)) S.dels.push({id:r.delivery_id,store_id:st.store.id,delivered_on:S.today,purchase_order_id:S.round,completed_at:at});
 const bk={};back.forEach(x=>{bk[x.id]=x.back;});
 (r.settled||[]).forEach(id=>{const l=S.lines.find(x=>x.id===id);if(l){l.qty_back=bk[id];l.settled_at=at;}});
 (r.lines||[]).forEach(l=>{if(!S.lines.some(x=>x.id===l.id)) S.lines.push(Object.assign(l,{deliveries:{id:r.delivery_id,store_id:st.store.id,delivered_on:S.today}}));});
 const paid=Number(r.paid)||0;
 if(paid>0&&!S.payments.some(x=>x.delivery_id===r.delivery_id)) S.payments.push({store_id:st.store.id,amount:paid,paid_on:S.today,delivery_id:r.delivery_id});
 st.got=paid;
 st.done=true;
}

/* product totals for a set of orders, with the per-shop split behind each */
function makeTotals(orders){
 const pt={};
 orders.forEach(o=>o.lines.forEach(l=>{const n=qty(l);if(!n)return;
  const x=pt[l.product_id]=pt[l.product_id]||{q:0,tag:0,st:{}};x.q+=n;x.tag+=l.qty_price_tagged||0;
  const y=x.st[l.store_id]=x.st[l.store_id]||{q:0,tag:0};y.q+=n;y.tag+=l.qty_price_tagged||0;}));
 return pt;
}

/* What to make today, sized by how much is needed: the biggest job gets the biggest box.
   Every box shows its number large, because box sizes are only a quick guide. Tap a box for the per-store split. */
function makeTiles(pt){
 const items=Object.keys(pt).map(pid=>Object.assign({pid},pt[pid])).filter(x=>x.q>0).sort((a,b)=>b.q-a.q);
 if(!items.length) return `<div class="empty">—</div>`;
 const tot=items.reduce((a,x)=>a+x.q,0),rows=[],rest=items.slice();
 // a clear majority gets its own full-width row; otherwise products pair up two to a row
 if(rest.length===1||rest[0].q/tot>=.4){rows.push([rest.shift()]);while(rest.length) rows.push(rest.splice(0,rest.length<=3?rest.length:2));}
 else while(rest.length) rows.push(rest.splice(0,2));
 const H=rows.length===1?150:270;
 const tile=x=>{
  const sh=x.q/tot,cls=sh>=.35?"t1":sh>=.15?"t2":"t3",p=S.prods[x.pid],open=S.mk===x.pid;
  return `<button class="mk ${cls}" data-a="mkPick" data-x="${x.pid}" aria-expanded="${open}" style="flex:${x.q} 1 0">
   ${p&&p.photo_1?`<img src="${esc(p.photo_1)}" alt="">`:`<span class="mki">${ic(TYPE_IC[p?p.type:"fresh"]||"bowl")}</span>`}
   <span class="mkn">${esc(pname(x.pid))}</span>
   <span class="mkq">${x.q}</span>
   <span class="mku">${esc(T().boxesWord)} · ${Math.round(100*sh)}%</span>
   ${x.tag?`<span class="mkt">${esc(T().tagged(x.tag))}</span>`:""}</button>`;
 };
 const sel=S.mk&&pt[S.mk]?pt[S.mk]:null;
 return `<div class="mkg">${rows.map(r=>{const rs=r.reduce((a,x)=>a+x.q,0);
   return `<div class="mkr" style="min-height:${rows.length===1?H:Math.max(108,Math.round(H*rs/tot))}px">${r.map(tile).join("")}</div>`;}).join("")}</div>
 ${sel?`<div class="card on" style="margin-top:10px"><div class="b">${esc(T().byStoreOf(pname(S.mk)))}</div>
   ${Object.keys(sel.st).map(sid=>{const st=storeOf(sid),y=sel.st[sid];
    return `<div class="row"><span>${esc(st?st.name:"—")}${y.tag?` <span class="chip gold">${esc(T().tagged(y.tag))}</span>`:""}</span><span class="rv" style="font-size:calc(var(--fs)*1.3)">${y.q}</span></div>`;}).join("")}</div>`
  :`<div class="mut" style="margin:8px 4px 0">${ic("hand-finger")} ${esc(T().tapTile)}</div>`}`;
}
function periodFrom(){

const cfg=()=>Object.assign({fresh:{mode:"pct",pct:35},dry:{mode:"pct",pct:35},frozen:{mode:"pct",pct:35}},(S.supplier&&S.supplier.cost_cfg)||{});
function supCalc(){
 const from=periodFrom(),c=cfg(),r={};
 TYPES.forEach(t=>{r[t]={rev:0,cost:0,out:0,back:0,made:0,ret:Object.values(S.prods).some(p=>p.type===t&&p.returnable!==false)};});
 S.lines.filter(l=>l.settled_at&&l.deliveries.delivered_on>=from).forEach(l=>{
  const p=S.prods[l.product_id];if(!p)return;const x=r[p.type];const sold=l.qty_out-(l.qty_back||0);
  x.rev+=sold*Number(l.unit_cost);x.made+=l.qty_out;
  if(c[p.type].mode==="prod") x.cost+=(S.make[l.product_id]||0)*l.qty_out;
  if(isRet(l.product_id)){x.out+=l.qty_out;x.back+=l.qty_back||0;}});
 TYPES.forEach(t=>{if(c[t].mode!=="prod") r[t].cost=r[t].rev*(c[t].pct||0)/100;});
 return r;
}

  if(S.names[id])S.names[id].distributor_id=x.distributor_id;render();await upd("drivers",id,{distributor_id:x.distributor_id});},
 lotSign:async(el)=>{
  const state=el.dataset.x,L=listFor(state).filter(x=>S.sel.has(x.k));if(!L.length)return;
  el.disabled=true;const now=new Date().toISOString(),sig=$("sig-"+state).toDataURL("image/png"),who=nm(S.acct);
  try{
   if(state==="check"){
    // the reseller checks wastage and signs: goes to their distributor
    L.forEach(x=>{const e=$("ln-"+x.k);if(e)S.lotNotes[x.k]=e.value.trim();});
    const rows=L.map(x=>({reseller_id:x.r,lot_date:x.d,amount:x.cost,waste_pct:x.waste,dist_signed_at:now,dist_signed_by:who,dist_signature:sig,note:S.lotNotes[x.k]||null}));
    const {error}=await db.from("lot_signoffs").upsert(rows,{onConflict:"reseller_id,lot_date"});if(error) throw error;
    rows.forEach(r=>{const o=S.signoffs.find(x=>x.reseller_id===r.reseller_id&&x.lot_date===r.lot_date);
     const v={reseller_id:r.reseller_id,lot_date:r.lot_date,amount:r.amount,waste_pct:r.waste_pct,dist_signed_at:now,dist_signed_by:who,note:r.note};
     o?Object.assign(o,v):S.signoffs.push(v);});
    L.forEach(x=>S.sel.delete(x.k));S.sigOk={};render();toast(T().signSend(L.length,sup()));
   }else{
    // the distributor signs to close: one payment per reseller
    const by={};L.forEach(x=>{(by[x.r]=by[x.r]||[]).push(x);});
    for(const rid of Object.keys(by)){
     const dates=by[rid].map(x=>x.d),amt=by[rid].reduce((a,x)=>a+x.cost,0);
     const {data,error}=await db.from("supplier_payments").insert({supplier_id:S.supplier.id,reseller_id:rid,amount:amt,paid_on:S.today,covers_dates:dates,
      signed_at:now,signature:sig,signed_by:who}).select("id").single();if(error) throw error;
     const {error:e2}=await db.from("lot_signoffs").update({sup_signed_at:now,sup_signed_by:who,sup_signature:sig,payment_id:data.id}).eq("reseller_id",rid).in("lot_date",dates);
     if(e2) throw e2;
     S.supPay.push({amount:amt,paid_on:S.today,covers_dates:dates,reseller_id:rid});
     S.signoffs.forEach(o=>{if(o.reseller_id===rid&&dates.includes(o.lot_date)){o.sup_signed_at=now;o.sup_signed_by=who;}});
    }
    L.forEach(x=>S.sel.delete(x.k));S.sigOk={};render();toast(T().signClose(L.length));
   }
  }catch(e){el.disabled=false;fail(e.message||String(e));}},
 lotOpen:async(el)=>{const k=el.dataset.x;S.lotOpen=S.lotOpen===k?null:k;render();

  if(error) fail(error.message);},

 /* supplier */
 supAns:async(el)=>{const [id,st]=el.dataset.x.split("|");const o=S.orders.find(x=>x.id===id);if(!o)return;
  const prev={s:o.sup_status,seen:o.sup_seen};o.sup_status=st;
  const patch={sup_status:st,sup_at:st==="pending"?null:new Date().toISOString()};
  if(st==="rejected"){patch.sup_seen=false;o.sup_seen=false;}
  render();
  const {error}=await db.from("purchase_orders").update(patch).eq("id",id);
  if(error){o.sup_status=prev.s;o.sup_seen=prev.seen;render();fail(error.message);}},
 adjOpen:(el)=>{const o=S.orders.find(x=>x.id===el.dataset.x);if(!o)return;
  const q={};o.lines.forEach(l=>{q[l.id]=qty(l);});S.adj={id:o.id,q};render();},
 adjCancel:()=>{S.adj=null;render();},
 adjQ:(el)=>{const [id,d]=el.dataset.x.split("|");S.adj.q[id]=Math.max(0,S.adj.q[id]+ +d);render();},
 supAccept:async(el)=>{const o=S.orders.find(x=>x.id===el.dataset.x);if(!o)return;el.disabled=true;
  try{
   const ch=S.adj&&S.adj.id===o.id?o.lines.filter(l=>S.adj.q[l.id]!==qty(l)):[];
   for(const l of ch){
    const n=S.adj.q[l.id],tag=(l.qty_price_tagged||0)>0,patch=tag?{qty_price_tagged:n}:{qty_plain:n};
    if(l.qty_ordered==null) patch.qty_ordered=qty(l);
    const {error}=await db.from("purchase_order_lines").update(patch).eq("id",l.id);if(error) throw error;
    Object.assign(l,patch);
   }
   const patch={sup_status:"accepted",sup_at:new Date().toISOString()};
   if(ch.length){patch.sup_adjusted=true;patch.sup_seen=false;}
   const {error}=await db.from("purchase_orders").update(patch).eq("id",o.id);if(error) throw error;
   Object.assign(o,patch);S.adj=null;S.stops=null;render();
  }catch(e){el.disabled=false;fail(e.message||String(e));}},
 period:(el)=>{S.period=el.dataset.x;render();},
 ctype:(el)=>{S.ctype=el.dataset.x;render();},
 ctBack:()=>{S.ctype=null;render();},
 cmode:async(el)=>{const c=cfg();c[S.ctype]=Object.assign({},c[S.ctype],{mode:el.dataset.x});S.supplier.cost_cfg=c;render();
  const {error}=await db.rpc("set_cost_cfg",{cfg:c});if(error)fail(error.message);}
};
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el||el.disabled) return;
 const f=ACT[el.dataset.a];if(f){e.preventDefault&&el.tagName!=="A"&&e.preventDefault();
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(x){}
  f(el,e);}
});
/* text / number fields save when you leave them */
document.addEventListener("change",async e=>{
 const el=e.target,k=el.dataset&&el.dataset.in;if(!k) return;
 if(k==="label"){if(S.ob)S.ob.label=el.value;return;}
 if(k.startsWith("lotnote:")){S.lotNotes[k.slice(8)]=el.value.trim();return;}
 if(k.startsWith("f:")){const o=openObj(),f=k.slice(2);if(!o)return;o[f]=el.value.trim()||null;
  if(await upd(TBL[S.open.kind],o.id,{[f]:o[f]})) render();return;}
 if(k.startsWith("sp:")){const [,pid,f]=k.split(":"),s=openObj(),sp=spOf(s.id,pid);if(!sp)return;
  const v=f==="default_qty"?Math.max(0,parseInt(el.value,10)||0):Math.max(0,Number(el.value)||0);sp[f]=v;
  const {error}=await db.from("store_products").update({[f]:v}).eq("store_id",s.id).eq("product_id",pid);if(error)fail(error.message);return;}
 if(k==="cost"){const p=openObj(),v=Math.max(0,Number(el.value)||0);S.costs[p.id]=v;
  const {error}=await db.from("supplier_products").upsert({supplier_id:S.supplier.id,product_id:p.id,unit_cost:v},{onConflict:"supplier_id,product_id"});
  if(error)fail(error.message);return;}
 if(k.startsWith("make:")){const pid=k.slice(5),v=el.value===""?null:Math.max(0,Number(el.value)||0);S.make[pid]=v;
  const {error}=await db.rpc("set_make_cost",{pid,c:v});if(error)fail(error.message);render();return;}
 if(k==="pct"){const c=cfg();c[S.ctype]=Object.assign({},c[S.ctype],{pct:+el.value});S.supplier.cost_cfg=c;
  const {error}=await db.rpc("set_cost_cfg",{cfg:c});if(error)fail(error.message);return;}
});
document.addEventListener("input",e=>{
 const el=e.target;if(!el.dataset||el.dataset.in!=="pct") return;
 const r=supCalc()[S.ctype],v=+el.value;
 $("pctOut").textContent=v+"%";$("pctNote").textContent=T().costOf(money(r.rev*v/100),money(r.rev));
});
$("fp").addEventListener("change",e=>{
 const f=e.target.files&&e.target.files[0];if(!f) return;
 if(S.photoTarget) return uploadPhoto(f);
 const sid=S.phSid||null;S.phSid=null;
 shrink(f,1200).then(b=>{const r=new FileReader();r.onload=()=>{
  const p={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),sid,src:r.result,at:new Date().toISOString()};
  phList().push(p);saveProgress();render();phUpload(p);};r.readAsDataURL(b);}).catch(()=>{});
});
function shrink(file,max){
 return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?res(b):rej(new Error("image")),"image/jpeg",.82);};im.src=r.result;};r.readAsDataURL(file);});
}
/* photos go to the public "photos" bucket; a new file name each time so phones never show the old one */
async function uploadPhoto(file){
 const t=S.photoTarget;S.photoTarget=null;S.uploading=t.kind+t.id;render();
 try{
  const blob=await shrink(file,t.kind==="store"?1400:900);
  const path=(t.kind==="store"?"stores/":"products/")+t.id+"-"+Date.now()+".jpg";
  const up=await db.storage.from("photos").upload(path,blob,{contentType:"image/jpeg",upsert:false});
  if(up.error) throw up.error;
  const url=db.storage.from("photos").getPublicUrl(path).data.publicUrl;
  const col=t.kind==="store"?"photo_approach":"photo_1",tbl=t.kind==="store"?"stores":"products";
  const obj=t.kind==="store"?storeOf(t.id):S.prods[t.id],old=obj&&obj[col];
  const {error}=await db.from(tbl).update({[col]:url}).eq("id",t.id);if(error) throw error;
  if(obj) obj[col]=url;
  const op=old&&old.split("/object/public/photos/")[1];
  if(op) db.storage.from("photos").remove([op]).then(()=>{},()=>{});
 }catch(e){fail(e.message||String(e));}
 S.uploading=null;render();
}
/* end of a stop: settle last lot's leftovers, record the cash, record today's drop */
async function finishStop(el){
 el.disabled=true;
 try{await saveStop(S.stops[S.dv.si]);}catch(e){el.disabled=false;return fail(e.message||String(e));}
 const n=nextTodo(S.dv.si+1);
 if(n<0&&nextTodo(0)<0){
  S.dv.phase="done";
  const o=S.orders.find(x=>x.id===S.round),now=new Date().toISOString();
  if(o){o.delivered_at=now;db.from("purchase_orders").update({delivered_at:now}).eq("id",o.id).then(()=>{},()=>{});}
 }else{S.dv.si=n<0?nextTodo(0):n;S.dv.pi=0;S.dv.phase="go";}
 render();
}
/* pull fresh orders when the app comes back to the front, or on the refresh button.
   Never mid-task: an open order, signature, adjustment, or a round already started. */
async function softReload(force,btn){
 if(S.screen!=="app"||!S.acct) return;
 if(!force&&Date.now()-LAST_LOAD<20000) return;
 const busy=S.ob||S.adj||S.sel.size||S.reset||S.payForm||S.addAcct||S.open||S.evForm||S.pinEdit||(S.round&&S.dv.phase!=="brief");
 if(busy&&!force) return;
 if(btn) btn.disabled=true;
 try{
  await load();
  if(!S.round||S.dv.phase==="brief") S.stops=null;
  render();
  if(force) toast(T().refreshed);
 }catch(e){if(btn) btn.disabled=false;if(force) fail(e.message||String(e));}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") softReload(false);});

/* =================== boot =================== */
applyType();
(async()=>{
 try{const {data:{session}}=await withTimeout(db.auth.getSession(),8000);
  if(session&&S.acct) return start();
  if(session) await db.auth.signOut();
 }catch(e){}
 localStorage.removeItem("ss_acct");S.acct=null;pinScreen();
})();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
