<style>
:root{
  --ink:#101c17;--ink2:#5f6f67;--ink3:#93a09a;
  --paper:#fff;--wash:#f4f6f4;--line:#e6ebe7;--line2:#c6d0ca;
  --good:#2E7D32;--goodw:#edf7ee;
  --bad:#8e2020;--badw:#fdeeee;
  --warn:#9A5B06;--warnw:#fdf3e6;
  --gold:#E0A020;
  --a:#101c17;--aw:#eef1ef;
  --fs:17px;--lh:1.55;
  --r:18px;--rs:14px;
  --sh:0 1px 2px rgba(16,28,23,.05);
  --sh2:0 6px 20px rgba(16,28,23,.13);
  --tap:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{font-family:"Anuphan",system-ui,sans-serif;background:var(--wash);color:var(--ink);
  font-size:var(--fs);line-height:var(--lh);-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:var(--ink);border:0;background:none}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.97)}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px calc(104px + env(safe-area-inset-bottom))}
.wrap.bare{padding-bottom:32px}
.num{font-variant-numeric:tabular-nums}
.mut{font-size:calc(var(--fs)*.8);color:var(--ink3)}
.hide{display:none}

/* hero */
.hero{background:var(--aw);border-radius:var(--r);padding:17px 18px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.h1{font-size:calc(var(--fs)*1.5);font-weight:700;color:var(--a);line-height:1.24;letter-spacing:-.02em}
.h2{font-size:calc(var(--fs)*.82);color:var(--a);opacity:.68;margin-top:2px}
.dnum{font-size:calc(var(--fs)*1.5);font-weight:700;color:var(--a);line-height:1;text-align:right}
.dmon{font-size:calc(var(--fs)*.64);color:var(--a);opacity:.6;text-align:right;
  letter-spacing:.08em;margin-top:4px;font-weight:600}

/* big action */
.task{background:var(--a);border-radius:var(--r);padding:20px 18px;color:#fff;margin-bottom:12px;
  display:flex;align-items:center;gap:15px;width:100%;text-align:left;box-shadow:var(--sh2);min-height:88px}
.task.q{background:var(--paper);color:var(--ink);box-shadow:var(--sh)}
.task i{font-size:31px;flex:0 0 auto;opacity:.95}
.tt{font-size:calc(var(--fs)*1.1);font-weight:700;line-height:1.3;display:block;letter-spacing:-.01em}
.ts{font-size:calc(var(--fs)*.82);opacity:.75;line-height:1.5;display:block;margin-top:2px}
.done{background:var(--goodw);border-radius:var(--r);padding:18px;text-align:center;color:var(--good)}
.alert{border-radius:var(--rs);padding:12px 14px;margin-bottom:11px;font-size:calc(var(--fs)*.82);
  display:flex;gap:10px;align-items:center;line-height:1.5}
.alert.w{background:var(--warnw);color:var(--warn)}

/* cards */
.card{background:var(--paper);border-radius:var(--r);padding:15px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.card.on{box-shadow:0 0 0 2.5px var(--a),var(--sh2)}
.lbl{font-size:calc(var(--fs)*.72);font-weight:700;color:var(--ink3);margin:20px 0 9px 4px;
  display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.06em;text-transform:uppercase}
.lbl .n{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3)}
.row{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:9px 0}
.rt{font-size:calc(var(--fs)*.95);min-width:0}
.rv{font-size:calc(var(--fs)*.98);font-weight:700;font-variant-numeric:tabular-nums}
.tuck{display:flex;justify-content:space-between;align-items:center;padding:16px;
  background:var(--paper);border-radius:var(--rs);margin-bottom:9px;
  font-size:calc(var(--fs)*.93);box-shadow:var(--sh);min-height:var(--tap)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--paper);border-radius:var(--rs);padding:14px 15px;box-shadow:var(--sh)}
.kk{font-size:calc(var(--fs)*.74);color:var(--ink3);font-weight:500}
.kv{font-size:calc(var(--fs)*1.28);font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;margin-top:3px}

/* stepper — big targets */
.stp{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.stp button{width:52px;height:52px;border-radius:15px;background:var(--wash);
  font-size:23px;font-weight:500;color:var(--ink2)}
.stp button:active{background:var(--aw);color:var(--a)}
.stp .v{font-size:calc(var(--fs)*1.2);font-weight:700;min-width:38px;text-align:center;
  font-variant-numeric:tabular-nums}

/* buttons */
.btn{width:100%;min-height:var(--tap);border-radius:16px;background:var(--ink);color:#fff;
  font-size:calc(var(--fs)*.98);font-weight:600;padding:0 18px;margin-top:10px;box-shadow:var(--sh)}
.btn.acc{background:var(--a)}
.btn.g{background:var(--paper);color:var(--ink)}
.btn.good{background:var(--good)}
.btn.big{min-height:68px;font-size:calc(var(--fs)*1.12);border-radius:19px}
.btn[disabled]{opacity:.32;box-shadow:none}
.btn[disabled]:active{transform:none}
.sm{min-height:46px;font-size:calc(var(--fs)*.84);padding:0 15px;border-radius:13px;
  background:var(--wash);color:var(--ink2);width:auto;margin:0;font-weight:600}

input{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;
  font-size:calc(var(--fs)*1.0);background:var(--wash);font-variant-numeric:tabular-nums}
input[type=number]{text-align:right}
input:focus{outline:none;background:var(--paper);border-color:var(--a)}
.flbl{font-size:calc(var(--fs)*.72);color:var(--ink3);display:block;margin-bottom:5px;font-weight:500}

.days{flex:0 0 50px;height:50px;border-radius:15px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1}
.days b{font-size:calc(var(--fs)*1.1);font-weight:700;font-variant-numeric:tabular-nums}
.days span{font-size:calc(var(--fs)*.5);letter-spacing:.09em;opacity:.7;margin-top:3px;font-weight:600}
.fr{display:flex;align-items:center;gap:13px}
.sbar{flex:0 0 72px;height:7px;border-radius:99px;background:var(--wash);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.cb{flex:0 0 32px;height:32px;border-radius:11px;background:var(--wash);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;
  box-shadow:inset 0 0 0 2.5px var(--line2)}
.cb[data-on="1"]{background:var(--a);box-shadow:none}
.dchip{flex:0 0 50px;height:50px;border-radius:15px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1}

/* bottom tabs — bolder */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:900}
.nav-in{max-width:560px;margin:0 auto;display:grid}
.nav button{padding:11px 2px 12px;font-size:calc(var(--fs)*.66);font-weight:600;
  color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.nav button:active{transform:none;opacity:.6}
.nav button i{font-size:23px}
.nav button[aria-selected="true"]{color:var(--a)}
.nav button[aria-selected="true"] i{transform:scale(1.06)}

/* entry */
.brand{text-align:center;padding:36px 0 30px}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.door{min-height:176px;border-radius:22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:16px 10px;box-shadow:var(--sh)}
.door.d1{background:var(--aw);color:var(--a);box-shadow:var(--sh2)}
.door.d2{background:var(--paper)}
.door i{font-size:40px;opacity:.92}
.dots{display:flex;justify-content:center;gap:17px;margin:26px 0 12px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line2);transition:transform .14s,background .14s}
.dot.on{background:var(--a);transform:scale(1.18)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{min-height:74px;border-radius:20px;background:var(--paper);box-shadow:var(--sh);
  font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--aw);color:var(--a)}
.pad button.blank{background:transparent;box-shadow:none}
.pad button.act{font-size:calc(var(--fs)*.88);color:var(--ink3);background:transparent;box-shadow:none;font-weight:600}
.pmsg{text-align:center;font-size:calc(var(--fs)*.85);min-height:28px;line-height:1.6;color:var(--bad)}
.langrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:22px}
.langrow button{min-height:52px;border-radius:15px;background:var(--paper);box-shadow:var(--sh);
  font-size:calc(var(--fs)*.9);font-weight:600;color:var(--ink2)}
.langrow button[data-on="1"]{background:var(--ink);color:#fff}

.msg{padding:13px 15px;border-radius:var(--rs);font-size:calc(var(--fs)*.85);margin:10px 0}
.msg.err{background:var(--badw);color:var(--bad)}
.empty{text-align:center;color:var(--ink3);padding:44px 20px}
.ordertxt{font-size:calc(var(--fs)*1.12);line-height:2.05;white-space:pre-wrap;word-break:break-word;
  font-variant-numeric:tabular-nums}
.chip{background:var(--wash);border-radius:99px;padding:5px 12px;font-size:calc(var(--fs)*.75);color:var(--ink2)}
.seg{display:grid;gap:8px;margin-bottom:12px}
.seg button{min-height:50px;border-radius:15px;background:var(--paper);color:var(--ink2);
  font-size:calc(var(--fs)*.88);font-weight:600;box-shadow:var(--sh)}
.seg button[aria-selected="true"]{background:var(--ink);color:#fff}
#map{height:220px;border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh)}
.sig{width:100%;height:136px;border:2px dashed var(--line2);border-radius:var(--rs);
  background:var(--wash);touch-action:none;display:block;margin-top:9px}
.bar{display:flex;gap:3px;height:7px;margin-bottom:16px}
.bar i{flex:1;border-radius:4px;background:var(--line);display:block}
.bar i.on{background:var(--a)}
.big{font-size:66px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.huge{width:82px;height:82px;border-radius:24px;background:var(--paper);box-shadow:var(--sh);font-size:36px}
</style>
</head>

async function tapKey(k,len){
 if(S.busy) return;
 if(k==="del"){S.pin=S.pin.slice(0,-1);S.pmsg="";return entryPad();}
 if(S.pin.length>=len) return;
 S.pin+=k; entryPad();
 if(S.pin.length<len) return;
 const pin=S.pin; S.busy=true; S.pmsg="…"; entryPad();
 try{
  if(S.pane==="o6"){
   const {error}=await db.auth.signInWithPassword({email:LOGIN.owner,password:pin});
   if(error) throw error;
   S.role="owner";
  } else {
   const {error}=await db.auth.signInWithPassword({email:LOGIN.driver,password:DRIVER_PW});
   if(error) throw error;
   const {data,error:e2}=await db.rpc("driver_by_pin",{p:pin});
   if(e2) throw e2;
   const row=Array.isArray(data)?data[0]:data;
   if(!row){ await db.auth.signOut(); throw new Error(T().wrongPin); }
   S.driver=row; S.role="driver";
  }
  S.pin=""; S.busy=false;
  await start();
 }catch(e){
  S.busy=false; S.pin="";
  S.pmsg=/invalid login/i.test(e.message||"")?T().wrongPin:(e.message||T().wrongPin);
  entryPad();
 }
}

/* ---------------- boot ---------------- */
async function start(){
 S.screen="app"; $("wrap").classList.remove("bare");
 const now=new Date(); S.dow=now.getDay(); S.today=iso(now); S.week=weekOf(now);
 applyType(); clearErr();
 $("app").innerHTML='<div class="empty">…</div>';
 const {data:{session}}=await db.auth.getSession();
 if(!session) return showEntry();
 S.user=session.user;
 if(!S.role){
  const {data:pf}=await db.from("profiles").select("role,lang").eq("id",session.user.id).maybeSingle();
  S.role=pf?pf.role:"driver";
  if(S.role==="driver" && !S.driver){ await db.auth.signOut(); return showEntry(); }
 }
 if(S.role==="driver"){ S.lang="th"; applyType(); }
 await loadData();
 S.stops=buildStops();
 render();
}
async function loadData(){
 const {data:sup}=await db.from("suppliers").select("id").eq("active",true).limit(1);
 S.supplierId=sup&&sup[0]?sup[0].id:null;
 const {data:pr}=await db.from("products").select("id,name,name_th,returnable").eq("active",true);
 (pr||[]).forEach(p=>{S.prods[p.id]=p;});
 const {data:st,error}=await db.from("stores")
  .select("id,name,suburb,address,terms,price_tag_required,delivery_days,weeks_of_month,route_position,latitude,longitude,parking_note,is_kitchen")
  .eq("active",true).order("route_position",{ascending:true,nullsFirst:false});
 if(error) return fail(error.message);
 S.kitchen=(st||[]).filter(x=>x.is_kitchen)[0]||null;
 S.stores=(st||[]).filter(x=>!x.is_kitchen);
 const ids=S.stores.map(x=>x.id); if(!ids.length) return;
 const {data:sp}=await db.from("store_products")
  .select("store_id,product_id,sell_price,retail_price,default_qty").in("store_id",ids);
 S.prices=sp||[];
 const {data:dl}=await db.from("delivery_lines")
  .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at,deliveries!inner(id,store_id,delivered_on)")
  .in("deliveries.store_id",ids);
 S.lines=dl||[];
 const {data:pay}=await db.from("store_payments").select("store_id,amount,paid_on").in("store_id",ids);
 S.payments=pay||[];
 if(S.role==="owner"){
  const {data:cs}=await db.from("supplier_products").select("product_id,unit_cost").eq("supplier_id",S.supplierId);
  (cs||[]).forEach(c=>{S.costs[c.product_id]=Number(c.unit_cost);});
  const {data:spy}=await db.from("supplier_payments").select("amount,paid_on,covers_dates").eq("supplier_id",S.supplierId);
  S.supPay=spy||[];
  const {data:po}=await db.from("purchase_orders").select("id,for_delivery_on,status")
   .order("for_delivery_on",{ascending:false}).limit(10);
  S.orders=po||[];
  const {data:dv}=await db.from("drivers").select("id,name,name_th,pin,active").order("name");
  S.drivers=dv||[];
 }
}

/* ---------------- helpers ---------------- */
const spOf=(sid,pid)=>S.prices.filter(p=>p.store_id===sid&&p.product_id===pid)[0];
function dueOn(dow,week){
 return S.stores.filter(s=>(s.delivery_days||[]).indexOf(dow)>=0 &&
  (!(s.weeks_of_month||[]).length || s.weeks_of_month.indexOf(week)>=0));
}
function nextDeliveryFrom(off){
 for(let i=off;i<9;i++){
  const d=new Date(); d.setDate(d.getDate()+i);
  if(dueOn(d.getDay(),weekOf(d)).length) return d;
 }
 return null;
}
function orderTarget(){
 const t=nextDeliveryFrom(1); if(!t) return null;
 return Math.round((t-new Date(S.today+"T00:00:00"))/864e5)===1?t:null;
}
const runToday=()=>dueOn(S.dow,S.week);
const orderFor=d=>S.orders.filter(o=>o.for_delivery_on===d)[0]||null;
const deliveredToday=sid=>S.lines.some(l=>
 l.deliveries.store_id===sid && l.deliveries.delivered_on===S.today);

function buildStops(){
 return runToday().map(s=>{
  const open=S.lines.filter(l=>l.settled_at==null && l.deliveries.store_id===s.id);
  return {
   store:s,
   done:(!S.forceRun && deliveredToday(s.id)),
   back:open.filter(l=>isRet(l.product_id)).map(l=>({
     id:l.id,pid:l.product_id,out:l.qty_out,price:Number(l.unit_price),qty:0})),
   cold:open.filter(l=>!isRet(l.product_id)).map(l=>({
     id:l.id,pid:l.product_id,out:l.qty_out,price:Number(l.unit_price),
     days:Math.round((new Date(S.today)-new Date(l.deliveries.delivered_on))/864e5)})),
   out:S.prices.filter(p=>p.store_id===s.id).map(p=>({
     pid:p.product_id,price:Number(p.sell_price),cost:S.costs[p.product_id]||0,
     qty:p.default_qty||0})),
   docket:null
  };
 });
}
const dueFor=st=>st.back.reduce((a,b)=>a+(b.out-b.qty)*b.price,0);

function hero(t,s,right){

 return `<div class="hero"><div style="min-width:0">
  <div class="h1">${esc(t)}</div><div class="h2">${esc(s||"")}</div></div>

  <div class="dmon">${esc(monName(d.getMonth())).toUpperCase()}</div>`}</div></div>`;

/* ---------------- TODAY ---------------- */
function todayTab(){
 const tgt=orderTarget();
 const stops=S.stops||[];
 const isOrder=!!tgt, isRun=stops.length>0;
 const quiet=!isOrder && !isRun;
 let task="",alert="",peek="";

 if(isOrder){
  const sent=orderFor(iso(tgt));
  let boxes=0,cost=0;
  dueOn(tgt.getDay(),weekOf(tgt)).forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
   const q=oVal(s.id,p.product_id);boxes+=q;cost+=q*(S.costs[p.product_id]||0);}));
  task=sent
   ?`<div class="done"><div style="font-weight:700">${esc(T().orderSent)} ✓</div>
     <div class="mut" style="color:inherit;opacity:.8">${boxes} · ${esc(T().forDay(dayName(tgt.getDay())))}</div></div>`
   :`<button class="task" data-go="order"><i class="ti ti-message-2" aria-hidden="true"></i>
     <span><span class="tt">${esc(T().sendOrder)}</span>
     <span class="ts">${esc(T().forDay(dayName(tgt.getDay())))} · ${boxes} · ${money(cost)}</span></span></button>`;
 } else if(isRun){
  const left=stops.filter(x=>!x.done).length;
  const boxes=stops.reduce((a,s)=>a+s.out.reduce((x,o)=>x+o.qty,0),0);
  task=left===0
   ?`<div class="done"><div style="font-weight:700">${esc(T().roundDone)} ✓</div>
     <div class="mut" style="color:inherit;opacity:.8">${stops.length} ${esc(T().stops)}</div></div>
     <button class="btn g" id="redo">${esc(T().runAgain)}</button>`
   :`<button class="task" data-go="run"><i class="ti ti-truck-delivery" aria-hidden="true"></i>
     <span><span class="tt">${esc(T().roundOf(dayName(S.dow)))}</span>
     <span class="ts">${esc(T().stopsLoad(left,boxes))}</span></span></button>`;
  const ord=orderFor(S.today);
  if(ord && ord.status!=="collected")
   alert=`<div class="alert w"><i class="ti ti-alert-triangle" style="font-size:19px" aria-hidden="true"></i>
    <span>${esc(T().orderNotCollected)}</span></div>`;
 } else {
  const nx=nextDeliveryFrom(1);
  const od=nx?new Date(nx.getTime()-864e5):null;
  task=`<div class="task q"><i class="ti ti-coffee" aria-hidden="true"></i>
   <span><span class="tt">${esc(T().nothingDue)}</span>
   <span class="ts mut">${od?esc(T().nextOrder(dayName(od.getDay()))):""}</span></span></div>`;
 }
 const nd=nextDeliveryFrom(1);
 if(nd && !isOrder){
  const already=orderFor(iso(nd));
  peek=`<div class="tuck" data-go="order">
   <span>${esc(T().sendOrder)} · ${esc(dayName(nd.getDay()))} ${nd.getDate()}/${nd.getMonth()+1}</span>
   <span class="mut">${already?esc(T().orderSent)+" ✓":"›"}</span></div>`;
 }

 $("app").innerHTML=hero(T().itsDay(dayName(S.dow)),
   isOrder?T().orderDay:isRun?T().runDay:T().quietDay)
  +alert+task+peek+frozenBlock(quiet)+moneyBlock(quiet)+(quiet?sellBlock():"");

 $("app").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.sub=b.dataset.go;render();});
 const rd=$("redo");
 if(rd) rd.onclick=()=>{S.forceRun=true;S.stops=buildStops();S.sub="run";render();};
}
function avgClear(sid,pid){
 const done=S.lines.filter(l=>l.deliveries.store_id===sid&&l.product_id===pid&&l.settled_at);
 if(!done.length) return null;
 const t=done.reduce((a,l)=>a+Math.round((new Date(l.settled_at)-new Date(l.deliveries.delivered_on))/864e5),0);
 return Math.round(t/done.length);
}
function frozenBlock(full){
 const open=S.lines.filter(l=>!isRet(l.product_id)&&l.settled_at==null);
 if(!open.length) return "";
 const rows=open.map(l=>{
  const st=S.stores.filter(s=>s.id===l.deliveries.store_id)[0];
  return {name:st?st.name:"—",pid:l.product_id,qty:l.qty_out,
   days:Math.round((new Date(S.today)-new Date(l.deliveries.delivered_on))/864e5),
   avg:avgClear(l.deliveries.store_id,l.product_id),
   val:l.qty_out*Number(l.unit_price)};}).sort((a,b)=>b.days-a.days);
 const show=full?rows:rows.slice(0,1);
 return `<div class="lbl"><span>${esc(T().frozenShelf)}</span><span class="n">${esc(T().daysUsual)}</span></div>`+
 show.map(r=>{const slow=r.avg&&r.days>r.avg;
  return `<div class="card"><div class="fr">
  <div class="days" style="background:${slow?"var(--badw)":"var(--goodw)"};color:${slow?"var(--bad)":"var(--good)"}">
   <b>${r.days}</b><span>${S.lang==="th"?"วัน":"DAYS"}</span></div>
  <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(r.name)}</div>
  <div class="mut">${esc(pname(r.pid))} ×${r.qty}${r.avg?" · "+esc(T().usually(r.avg)):""}</div></div>
  <div class="rv">${money(r.val)}</div></div></div>`;}).join("");
}
function balances(){
 const set=S.lines.filter(l=>l.settled_at!=null);
 const rev=set.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_price),0);
 const cost=set.reduce((a,l)=>a+(l.qty_back==null?l.qty_out:l.qty_out-l.qty_back)*Number(l.unit_cost),0);
 const paid=S.payments.reduce((a,p)=>a+Number(p.amount),0);
 const mumPaid=S.supPay.reduce((a,p)=>a+Number(p.amount),0);
 const flight=S.lines.filter(l=>l.settled_at==null&&isRet(l.product_id))
  .reduce((a,l)=>a+l.qty_out*Number(l.unit_price),0);
 const mth=set.filter(l=>l.deliveries.delivered_on.slice(0,7)===S.today.slice(0,7));
 const mr=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_price),0);
 const mc=mth.reduce((a,l)=>a+(l.qty_out-(l.qty_back||0))*Number(l.unit_cost),0);
 return {owed:rev-paid,flight,mum:cost-mumPaid,margin:rev-cost,monthMargin:mr-mc};
}
function moneyBlock(full){
 const b=balances();
 return `<div class="lbl">${esc(T().moneyLbl)}</div><div class="g2">
 <div class="k"><div class="kk">${esc(T().shopsOwe)}</div><div class="kv">${money(b.owed)}</div></div>
 <div class="k"><div class="kk">${esc(T().outCons)}</div><div class="kv">${money(b.flight)}</div></div>
 ${full?`<div class="k"><div class="kk">${esc(T().mumOwed)}</div><div class="kv">${money(b.mum)}</div></div>
 <div class="k"><div class="kk">${esc(T().marginMonth)}</div><div class="kv">${money(b.monthMargin)}</div></div>`:""}
 </div>`;
}
function sellPct(sid){
 const ls=S.lines.filter(l=>l.deliveries.store_id===sid&&l.settled_at&&isRet(l.product_id));
 const out=ls.reduce((a,l)=>a+l.qty_out,0), back=ls.reduce((a,l)=>a+(l.qty_back||0),0);
 return out?Math.round(100*(out-back)/out):null;
}
function sellBlock(){
 const rows=S.stores.filter(s=>s.terms==="consignment")
  .map(s=>({n:s.name,pct:sellPct(s.id)})).filter(r=>r.pct!=null)
  .sort((a,b)=>b.pct-a.pct);
 if(!rows.length) return "";
 return `<div class="lbl"><span>${esc(T().sellThrough)}</span><span class="n">${esc(T().lastDrops)}</span></div>
 <div class="card">${rows.map(r=>`<div class="row" style="padding:7px 0">
  <span class="rt" style="flex:1">${esc(r.n)}</span>
  <span class="sbar"><i style="width:${r.pct}%"></i></span>
  <span class="rv" style="flex:0 0 44px;text-align:right">${r.pct}%</span></div>`).join("")}</div>`;
}

/* ---------------- ORDER ---------------- */
const oKey=(s,p)=>s+"|"+p;
function oVal(s,p){
 const k=oKey(s,p);
 if(S.orderQty[k]!=null) return S.orderQty[k];
 const x=spOf(s,p); return x&&x.default_qty?x.default_qty:0;
}
function orderScreen(){
 const t=orderTarget()||nextDeliveryFrom(1);
 if(!t){S.sub="home";return render();}
 const list=dueOn(t.getDay(),weekOf(t));
 const byP={};
 list.forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{
  const q=oVal(s.id,p.product_id); if(!q) return;
  const nm=S.prods[p.product_id]?(S.prods[p.product_id].name_th||pname(p.product_id)):pname(p.product_id);
  const g=(s.suburb||"—")+"|"+(s.price_tag_required?"t":"p");
  byP[nm]=byP[nm]||{};
  byP[nm][g]=byP[nm][g]||{q:0,tag:s.price_tag_required,st:[]};
  byP[nm][g].q+=q; byP[nm][g].st.push(s.name);}));
 const L=Object.keys(byP).map(nm=>{
  const gs=Object.keys(byP[nm]).map(k=>byP[nm][k])
   .sort((a,b)=>(a.tag?1:0)-(b.tag?1:0)||b.q-a.q);
  return {nm,txt:nm+" ="+gs.map(g=>g.q+(g.tag?"(ติดราคา)":"")).join("+"),gs};});
 const msg="สั่งขนม\n"+L.map(l=>l.txt).join("\n");
 let boxes=0,cost=0;
 list.forEach(s=>S.prices.filter(p=>p.store_id===s.id).forEach(p=>{

async function saveStop(i,btn){
 const st=S.stops[i];
 if(btn){btn.disabled=true;btn.textContent="…";}
 const now=new Date().toISOString();
 try{
  for(let k=0;k<st.back.length;k++){
   const b=st.back[k];
   const {error}=await db.from("delivery_lines")
    .update({qty_back:b.qty,reason:b.qty>0?"unsold":null,settled_at:now}).eq("id",b.id);
   if(error) throw error;
   const l=S.lines.filter(x=>x.id===b.id)[0];
   if(l){l.qty_back=b.qty;l.settled_at=now;}
  }
  const amt=dueFor(st);
  if(amt>0){
   await db.from("store_payments").insert({store_id:st.store.id,amount:amt,paid_on:S.today,
    notes:S.driver?("Collected by "+S.driver.name):"Collected on delivery"});
   S.payments.push({store_id:st.store.id,amount:amt,paid_on:S.today});
  }
  const rows=st.out.filter(o=>o.qty>0);
  if(rows.length){
   const {data:del,error:de}=await db.from("deliveries").insert({
    store_id:st.store.id,delivered_on:S.today,completed_at:now,
    recorded_by:S.user?S.user.id:null,driver_ref:S.driver?S.driver.id:null,
    docket_photo:st.docket||null}).select("id").single();
   if(de) throw de;
   const {data:nl,error:le}=await db.from("delivery_lines").insert(rows.map(o=>({
    delivery_id:del.id,product_id:o.pid,supplier_id:S.supplierId,
    qty_out:o.qty,unit_price:o.price,unit_cost:o.cost})))
    .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at");
   if(le) throw le;
   (nl||[]).forEach(l=>S.lines.push(Object.assign({},l,
    {deliveries:{id:del.id,store_id:st.store.id,delivered_on:S.today}})));
  }
  st.done=true;
  return true;
 }catch(e){
  if(btn){btn.disabled=false;btn.textContent=T().saveStop;}
  fail(e.message||String(e));
  return false;
 }
}

}

function sigPad(cv){
 const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
 cv.width=r.width*dp;cv.height=r.height*dp;
 const x=cv.getContext("2d");x.scale(dp,dp);
 x.strokeStyle="#101c17";x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";
 let d=false;
 const pt=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;
  return[t.clientX-b.left,t.clientY-b.top];};
 const st=e=>{e.preventDefault();d=true;const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);};
 const mv=e=>{if(!d)return;e.preventDefault();const p=pt(e);x.lineTo(p[0],p[1]);x.stroke();
  if(!S.bDrawn){S.bDrawn=true;const o=$("sok");if(o)o.disabled=false;}};
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);
 window.addEventListener("mouseup",()=>{d=false;});
 cv.addEventListener("touchstart",st,{passive:false});
 cv.addEventListener("touchmove",mv,{passive:false});
 cv.addEventListener("touchend",()=>{d=false;});
}

function hav(a,b){
 const R=6371,t=x=>x*Math.PI/180;
 const dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);
 const x=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;
 return 2*R*Math.asin(Math.sqrt(x));
}
const road=k=>k*1.35;
const mins=k=>Math.max(2,Math.round(road(k)/34*60));
const hasLL=s=>s&&isFinite(Number(s.latitude))&&isFinite(Number(s.longitude));
const ll=s=>({lat:Number(s.latitude),lng:Number(s.longitude)});

function drawMap(list,K){
 const el=$("map"); if(!el) return;
 if(typeof window.L==="undefined"){el.innerHTML='<div class="empty">Map unavailable.</div>';return;}
 if(S.map){try{S.map.remove();}catch(e){} S.map=null;}
 const kk = K || (hasLL(S.kitchen)?ll(S.kitchen):null);
 const pts=(kk?[{name:T().kitchen,lat:kk.lat,lng:kk.lng,home:1}]:[])
  .concat(list.filter(hasLL).map(s=>({name:s.name,lat:Number(s.latitude),lng:Number(s.longitude)})));
 if(!pts.length){el.innerHTML='<div class="empty">'+esc(T().noStores)+'</div>';return;}
 try{
  S.map=window.L.map(el,{scrollWheelZoom:false,zoomControl:false});
  window.L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
   {maxZoom:19,attribution:"© OpenStreetMap"}).addTo(S.map);
  const acc=DAY[S.storeView==="thu"?4:S.storeView==="sun"?0:S.dow].i;
  const loop=kk?pts.concat([pts[0]]):pts;
  if(loop.length>1) window.L.polyline(loop.map(p=>[p.lat,p.lng]),
   {color:acc,weight:3,opacity:.7,dashArray:"6,5"}).addTo(S.map);
  pts.forEach((p,i)=>window.L.marker([p.lat,p.lng],{icon:window.L.divIcon({className:"",html:
   '<div style="width:29px;height:29px;border-radius:50%;background:'+(p.home?"#93a09a":acc)+
   ';color:#fff;display:flex;align-items:center;justify-content:center;font:700 14px Anuphan,sans-serif;'+
   'border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)">'+(p.home?"⌂":(kk?i:i+1))+'</div>',
   iconSize:[29,29],iconAnchor:[14,14]})}).addTo(S.map).bindPopup("<b>"+esc(p.name)+"</b>"));
  S.map.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[36,36]});
  requestAnimationFrame(()=>{if(S.map)S.map.invalidateSize();});
  setTimeout(()=>{if(S.map)S.map.invalidateSize();},320);
 }catch(e){el.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}
}
