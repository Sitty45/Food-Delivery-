<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f4">
<title>สั่ง/ส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Visual language taken straight from prototype.html, sized up for phones.
   Tappable = white card with shadow and a › ; stats = flat grey tile ; warnings = coloured border + icon. */
:root{--ink:#101c17;--mut:#5f6f67;--faint:#84918a;--line:#e6ebe7;--paper:#fff;--wash:#f4f6f4;--flat:#e9edea;
 --gold:#E0A020;--good:#2E7D32;--goodw:#edf7ee;--bad:#b3261e;--badw:#fdeeee;--badl:#eeb0aa;
 --warn:#8a5000;--warnw:#fff3dc;--warnl:#efc36a;--info:#1d4f7a;--infow:#eaf2fa;--infol:#b9d0e6;
 --fs:15px;--sh:0 1px 2px rgba(16,28,23,.06),0 2px 8px rgba(16,28,23,.05);--navh:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--wash)}
html,body{margin:0;touch-action:manipulation;overscroll-behavior:none}
body{font-family:"Anuphan",system-ui,sans-serif;color:var(--ink);font-size:var(--fs);line-height:1.5;
 -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,a{font-family:inherit;color:inherit;touch-action:manipulation}
button{border:0;cursor:pointer;background:none;-webkit-user-select:none;user-select:none;
 transition:transform .09s ease,background-color .15s ease}
button:active{transform:scale(.97)}
:focus-visible{outline:3px solid #2f6fa8;outline-offset:2px}
.pt{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(var(--navh) + 30px + env(safe-area-inset-bottom))}
.pt.bare{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#v.enter{animation:enter .2s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#v.enter,#err .alert{animation:none}button{transition:none}}

/* header + day bar */
.hero{background:#eef1ef;border-radius:15px;padding:14px 15px;margin-bottom:10px;display:flex;
 justify-content:space-between;align-items:flex-start;gap:12px}
.h1{font-size:calc(var(--fs)*1.5);font-weight:700;line-height:1.25}
.h2{font-size:calc(var(--fs)*.86);opacity:.7;margin-top:2px}
.dn{font-size:calc(var(--fs)*1.5);font-weight:700;text-align:right;line-height:1}
.dm{font-size:calc(var(--fs)*.72);opacity:.6;text-align:right;font-weight:700;margin-top:3px}
.sbar{border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:9px;
 font-weight:700;font-size:calc(var(--fs)*1.05)}
.sbar i.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* surfaces */
.card{background:var(--paper);border-radius:14px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--sh);display:block;width:100%;text-align:left}
.card.on{box-shadow:0 0 0 2px var(--ink)}
.card.bad{box-shadow:0 0 0 2px var(--bad)}
.card.row{padding:11px 14px}
.card.tap{position:relative;padding-right:36px;cursor:pointer}
.card.tap::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-52%);
 font-size:calc(var(--fs)*1.6);color:var(--faint);line-height:1}
.card.tap:active{transform:scale(.985);background:#fafbfa}
.lbl{font-size:calc(var(--fs)*.8);font-weight:700;color:var(--faint);margin:16px 0 7px 2px;display:flex;
 justify-content:space-between;align-items:baseline;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:var(--fs)}
.card .row+.row{border-top:1px solid var(--line)}
.rv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{font-size:calc(var(--fs)*.84);color:var(--faint);line-height:1.45}
.b{font-weight:700}
.fr{display:flex;align-items:center;gap:11px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* stats: flat, never tappable */
.k{background:var(--flat);border-radius:12px;padding:11px 12px;min-width:0}
.k.c{text-align:center}
.kk{font-size:calc(var(--fs)*.8);color:var(--mut);font-weight:500}
.kv{font-size:calc(var(--fs)*1.3);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tappable stat tile (supplier cost types) */
.k.tap{background:var(--paper);box-shadow:var(--sh);cursor:pointer;position:relative}
.k.tap:active{transform:scale(.97)}

/* buttons */
.btn{width:100%;min-height:52px;border-radius:13px;background:var(--ink);color:#fff;font-size:var(--fs);font-weight:600;
 margin-top:8px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;text-decoration:none;line-height:1.25}
.btn i{font-size:1.25em}
.btn.g{background:var(--paper);color:var(--ink);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btn.good{background:var(--good)}
.btn.bad{background:var(--bad)}
.btn.bt{background:var(--paper);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--badl)}
.btn.big{min-height:62px;font-size:calc(var(--fs)*1.1)}
.btn[disabled]{background:var(--flat);color:var(--faint);box-shadow:none;cursor:default}
.btn[disabled]:active{transform:none}
.nomt{margin-top:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--wash);border-radius:99px;padding:5px 11px;
 font-size:calc(var(--fs)*.82);font-weight:600;color:var(--mut);white-space:nowrap;line-height:1.3}
button.chip{min-height:36px;box-shadow:inset 0 0 0 1px var(--line)}
.chip[data-on="1"]{background:var(--ink);color:#fff;box-shadow:none}
.chip.good{background:var(--good);color:#fff}
.chip.bad{background:var(--bad);color:#fff}
.chip.warn{background:var(--warnw);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warnl)}
.chip.gold{background:var(--gold);color:#fff}
.sub{display:grid;gap:6px;margin-bottom:10px}
.sub button{min-height:46px;border-radius:11px;background:var(--paper);color:var(--mut);font-size:calc(var(--fs)*.93);
 font-weight:600;box-shadow:var(--sh)}
.sub button[data-on="1"]{background:var(--ink);color:#fff}
.stp{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.stp button{width:44px;height:44px;border-radius:11px;background:var(--wash);font-size:22px;color:var(--ink);
 display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
.stp .v{font-size:calc(var(--fs)*1.15);font-weight:700;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.huge{width:70px;height:70px;border-radius:18px;background:var(--paper);box-shadow:var(--sh),inset 0 0 0 1px var(--line);
 font-size:28px;display:flex;align-items:center;justify-content:center}
.big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.cb{flex:0 0 28px;height:28px;border-radius:8px;background:var(--paper);box-shadow:inset 0 0 0 2px #c6d0ca;
 display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.cb[data-on="1"]{background:var(--good);box-shadow:none}

/* alerts */
.alert{display:flex;gap:11px;align-items:flex-start;border-radius:14px;padding:12px 13px;margin-bottom:10px;
 border:1.5px solid;font-size:calc(var(--fs)*.92);line-height:1.45}
.alert .ai{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.alert b{display:block}
.alert.warn{background:var(--warnw);border-color:var(--warnl);color:var(--warn)}.alert.warn .ai{background:#e08e00}
.alert.bad{background:var(--badw);border-color:var(--badl);color:var(--bad)}.alert.bad .ai{background:var(--bad)}
.alert.info{background:var(--infow);border-color:var(--infol);color:var(--info)}.alert.info .ai{background:#2f6fa8}
.alert .x{margin:-6px -6px -6px auto;width:40px;height:40px;font-size:20px;color:inherit;flex:0 0 auto}
#err{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);z-index:1000;padding:0 12px;pointer-events:none}
#err .alert{max-width:516px;margin:0 auto;box-shadow:0 10px 26px rgba(16,28,23,.2);pointer-events:auto;animation:drop .22s ease}

/* day strip */
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dstrip::-webkit-scrollbar{display:none}
.dstrip button{flex:0 0 52px;min-height:62px;border-radius:13px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:1px}
.dstrip .w{font-size:calc(var(--fs)*.72);font-weight:700}
.dstrip .n{font-size:calc(var(--fs)*1.12);font-weight:700;font-variant-numeric:tabular-nums}
.dstrip .p{width:5px;height:5px;border-radius:50%}

/* map, inputs, misc */
#map{height:190px;border-radius:14px;margin-bottom:10px;background:#e9eee9;overflow:hidden;box-shadow:var(--sh)}
.ph{width:100%;aspect-ratio:16/9;border-radius:10px;background:var(--wash);display:flex;align-items:center;
 justify-content:center;color:var(--faint);font-size:24px;margin-bottom:10px}
.tf{width:100%;min-height:48px;border:1.3px solid #cfd8d2;border-radius:11px;padding:0 12px;font-size:16px;background:#fbfcfb}
.tf:focus{outline:none;border-color:var(--ink);background:#fff}
.tf[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.flbl{font-size:calc(var(--fs)*.8);color:var(--mut);margin:0 0 4px;display:block;font-weight:600}
.fld{margin-bottom:10px}
.sig{width:100%;height:120px;border:1.5px dashed #c6d0ca;border-radius:10px;background:var(--wash);margin-top:6px;
 touch-action:none;display:block}
.bar{display:flex;gap:3px;height:6px;margin-bottom:12px}
.bar i{flex:1;border-radius:3px;background:var(--line)}.bar i.on{background:var(--ink)}
.empty{text-align:center;color:var(--faint);padding:26px 12px;font-size:calc(var(--fs)*.93)}
.spin{width:28px;height:28px;border-radius:50%;margin:40px auto;border:3px solid var(--line);border-top-color:var(--ink);
 animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
.bars i.neg{background:var(--bad)}
.bars span{font-size:calc(var(--fs)*.66);color:var(--faint)}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.pinm{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;
 font:700 13px Anuphan,sans-serif;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:900;background:rgba(255,255,255,.97);
 -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
 padding-bottom:env(safe-area-inset-bottom)}
.tabs nav{display:grid;max-width:540px;margin:0 auto}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--navh);
 color:var(--faint);font-size:calc(var(--fs)*.84);font-weight:600;padding:6px 1px 8px;position:relative;line-height:1.2}
.tabs button i{font-size:27px}
.tabs button:active{transform:none;opacity:.6}
.tabs button[data-on="1"]{color:var(--ink);font-weight:800}
.tabs button[data-on="1"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* PIN screen */
.pinw{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center}
.lang{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:28px}
.lang button{min-height:44px;border-radius:12px;background:var(--paper);box-shadow:var(--sh);color:var(--mut);font-weight:600}
.lang button[data-on="1"]{background:var(--ink);color:#fff}
.dots{display:flex;justify-content:center;gap:18px;margin:22px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;background:#c6d0ca;transition:transform .12s,background .12s}
.dots i.on{background:var(--ink);transform:scale(1.15)}
.pmsg{min-height:34px;display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:6px}
.pad button{min-height:70px;border-radius:18px;background:var(--paper);box-shadow:var(--sh);font-size:28px;font-weight:500;
 font-variant-numeric:tabular-nums}
.pad button:active{background:#eef1ef}
.pad button.x{background:transparent;box-shadow:none;font-size:24px;color:var(--mut)}
</style>
</head>

async function pressKey(k){
 if(S.busy) return;
 if(k==="del"){S.pin=S.pin.slice(0,-1);S.pmsg="";return pinScreen();}
 if(S.pin.length>=4) return;
 S.pin+=k;S.pmsg="";
 if(S.pin.length<4) return pinScreen();
 S.busy=true;pinScreen();
 const p=S.pin;
 try{
  const {data,error}=await db.rpc("pin_login",{p});
  if(error) throw error;
  const a=Array.isArray(data)?data[0]:data;
  if(!a) throw new Error(T().wrongPin);
  const {error:e2}=await db.auth.signInWithPassword({email:a.email,password:a.secret});
  if(e2) throw e2;
  S.acct={id:a.account_id,name:a.name,name_th:a.name_th,role:a.role};
  localStorage.setItem("ss_acct",JSON.stringify(S.acct));
  S.pin="";S.busy=false;S.tab=null;
  await start();
 }catch(e){
  S.busy=false;S.pin="";
  S.pmsg=/too_many/.test(e.message||"")?T().locked:T().wrongPin;
  pinScreen();
 }
}

/* =================== render loop =================== */
let LAST="",AFTER=[];

function render(){
 const key=screenKey(),same=key===LAST,y=window.scrollY;
 AFTER=[];clearErr();
 const tabs=role()==="distributor"?[["order","clipboard-list","tOrder"],["sp","building-store","tSP"],["pay","cash","tPay"],["stats","chart-bar","tStats"],["set","settings","tSet"]]
  :role()==="driver"?[["round","truck-delivery","tRound"],["hist","history","tHist"],["set","settings","tSet"]]
  :[["sorder","clipboard-list","tOrder"],["spay","cash","tPay"],["sstats","chart-bar","tStats"],["set","settings","tSet"]];
 $("v").innerHTML=screen();
 $("tabs").hidden=false;
 $("nav").style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
 $("nav").innerHTML=tabs.map(t=>`<button role="tab" data-a="tab" data-x="${t[0]}" data-on="${S.tab===t[0]?1:0}" aria-selected="${S.tab===t[0]}">
  ${ic(t[1])}<span>${esc(T()[t[2]])}</span></button>`).join("");
 AFTER.forEach(f=>{try{f();}catch(e){console.error(e);}});
 if(same) window.scrollTo(0,y);

}
function screen(){
 const t=S.tab;
 if(t==="set") return setTab();
 if(isDist()){
  if(t==="order") return S.ob?orderBuild():orderTab();
  if(t==="sp") return S.open?(S.open.kind==="store"?storeDetail():S.open.kind==="hub"?hubDetail():productDetail()):spTab();

  if(t==="hist") return S.ob?qtyEditor():driverHistory();
  return driverRound();
 }

function dayStrip(sel,from,to,mark){
 let h="";
 for(let i=from;i<=to;i++){
  const dISO=addDays(S.today,i),d=dOf(dISO),c=DAY[d.getDay()];
  const due=mark(dISO,d),isSel=dISO===sel,has=ordersOn(dISO).length>0;
  const bg=isSel?"var(--ink)":due?c.w:"var(--paper)",fg=isSel?"#fff":due?c.i:"var(--faint)";
  h+=`<button data-a="pick" data-x="${dISO}" data-sel="${isSel?1:0}" style="background:${bg};color:${fg};${isSel?"":"box-shadow:var(--sh)"}">
   <span class="w">${esc(dayAb(d.getDay()))}</span><span class="n">${d.getDate()}</span>
   <span class="p" style="background:${has?(isSel?"#fff":c.i):"transparent"}"></span></button>`;
 }
 after(()=>{const s=document.querySelector('.dstrip [data-sel="1"]');if(s)s.scrollIntoView({inline:"center",block:"nearest"});});
 return `<div class="dstrip">${h}</div>`;
}

async function saveOrder(btn){
 const ob=S.ob;const lab=($("lbl")?$("lbl").value:ob.label).trim();
 const rows=[];
 Object.keys(ob.stores).forEach(sid=>{const s=storeOf(sid);Object.keys(ob.stores[sid]).forEach(pid=>{
  const n=ob.stores[sid][pid];if(!n)return;
  rows.push({product_id:pid,store_id:sid,qty_plain:s&&s.price_tag_required?0:n,qty_price_tagged:s&&s.price_tag_required?n:0,unit_cost:S.costs[pid]||0});});});
 if(!rows.length) return fail(T().emptyOrder);
 btn.disabled=true;
 try{
  let id=ob.id;
  if(id){
   const changed=JSON.stringify(ob.stores)!==ob.orig;
   const patch={label:lab||null,recurring:ob.recurring};
   if(changed){patch.sup_status="pending";patch.sup_at=null;}
   const {error}=await db.from("purchase_orders").update(patch).eq("id",id);if(error) throw error;
   if(changed){
    const {error:e1}=await db.from("purchase_order_lines").delete().eq("purchase_order_id",id);if(e1) throw e1;
    const {error:e2}=await db.from("purchase_order_lines").insert(rows.map(r=>Object.assign({purchase_order_id:id},r)));if(e2) throw e2;
   }
  }else{
   if(!S.supplier) throw new Error(T().noSupplier);
   const {data,error}=await db.from("purchase_orders").insert({supplier_id:S.supplier.id,ordered_on:S.today,for_delivery_on:ob.date,
    label:lab||null,recurring:ob.recurring,status:"sent",sent_at:new Date().toISOString(),sup_status:"pending"}).select("id").single();
   if(error) throw error;id=data.id;
   const {error:e2}=await db.from("purchase_order_lines").insert(rows.map(r=>Object.assign({purchase_order_id:id},r)));if(e2) throw e2;
  }
  await reloadOrders();S.ob=null;S.stops=null;render();
 }catch(e){btn.disabled=false;fail(e.message||String(e));}
}
async function deleteOrder(btn){
 btn.disabled=true;
 try{
  const id=S.ob.id;
  const {error:e1}=await db.from("purchase_order_lines").delete().eq("purchase_order_id",id);if(e1) throw e1;
  const {error}=await db.from("purchase_orders").delete().eq("id",id);if(error) throw error;
  S.orders=S.orders.filter(o=>o.id!==id);S.ob=null;S.stops=null;render();
 }catch(e){btn.disabled=false;fail(e.message||String(e));}
}

function balances(){
 const set=S.lines.filter(l=>l.settled_at);
 const sold=l=>l.qty_out-(l.qty_back||0);
 const rev=set.reduce((a,l)=>a+sold(l)*Number(l.unit_price),0),cost=set.reduce((a,l)=>a+sold(l)*Number(l.unit_cost),0);
 const paid=S.payments.reduce((a,p)=>a+Number(p.amount),0),mumPaid=S.supPay.reduce((a,p)=>a+Number(p.amount),0);
 const flight=S.lines.filter(l=>!l.settled_at&&isRet(l.product_id)).reduce((a,l)=>a+l.qty_out*Number(l.unit_price),0);
 const m=S.today.slice(0,7),mt=set.filter(l=>l.deliveries.delivered_on.slice(0,7)===m);
 return {owed:rev-paid,flight,mum:cost-mumPaid,margin:rev-cost,
  month:mt.reduce((a,l)=>a+sold(l)*(Number(l.unit_price)-Number(l.unit_cost)),0)};
}
function batches(){
 const M={};
 S.lines.filter(l=>isRet(l.product_id)).forEach(l=>{
  const d=l.deliveries.delivered_on;
  const m=M[d]=M[d]||{d,stores:{},items:{},cost:0,counted:true};
  m.stores[l.deliveries.store_id]=1;
  const it=m.items[l.product_id]=m.items[l.product_id]||{pid:l.product_id,out:0,sold:0};
  it.out+=l.qty_out;
  if(!l.settled_at){m.counted=false;}else{const s=l.qty_out-(l.qty_back||0);it.sold+=s;m.cost+=s*Number(l.unit_cost);}
 });
 const cl={};S.supPay.forEach(p=>(p.covers_dates||[]).forEach(d=>{cl[d]=1;}));
 return Object.values(M).sort((a,b)=>a.d<b.d?1:-1).map(m=>Object.assign(m,{cleared:!!cl[m.d]}));
}

function sigPad(cv){
 if(!cv) return;
 const r=cv.getBoundingClientRect(),dp=window.devicePixelRatio||1;
 cv.width=r.width*dp;cv.height=r.height*dp;
 const x=cv.getContext("2d");x.scale(dp,dp);x.strokeStyle="#101c17";x.lineWidth=2.4;x.lineCap="round";x.lineJoin="round";
 let d=false;
 const pt=e=>{const b=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-b.left,t.clientY-b.top];};
 const st=e=>{e.preventDefault();d=true;const p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);};
 const mv=e=>{if(!d)return;e.preventDefault();const p=pt(e);x.lineTo(p[0],p[1]);x.stroke();
  if(!S.sigDrawn){S.sigDrawn=true;const o=$("sigOk");if(o)o.disabled=false;}};
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);window.addEventListener("mouseup",()=>{d=false;});
 cv.addEventListener("touchstart",st,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("touchend",()=>{d=false;});
}

const deliveredToday=sid=>S.lines.some(l=>l.deliveries.store_id===sid&&l.deliveries.delivered_on===S.today);
function buildStops(){
 const per={};
 ordersOn(S.today).filter(o=>o.sup_status!=="rejected").forEach(o=>o.lines.forEach(l=>{const n=qty(l);if(!n)return;
  per[l.store_id]=per[l.store_id]||{};per[l.store_id][l.product_id]=(per[l.store_id][l.product_id]||0)+n;}));
 return S.stores.filter(s=>per[s.id]).map(s=>{
  const open=S.lines.filter(l=>!l.settled_at&&l.deliveries.store_id===s.id&&l.deliveries.delivered_on<S.today&&isRet(l.product_id));
  return {store:s,done:deliveredToday(s.id),
   back:open.map(l=>({id:l.id,pid:l.product_id,out:l.qty_out,price:Number(l.unit_price),qty:0})),
   out:Object.keys(per[s.id]).map(pid=>{const sp=spOf(s.id,pid);
    return {pid,qty:per[s.id][pid],price:sp?Number(sp.sell_price):0,cost:S.costs[pid]||0};})};});
}

async function saveStop(st){
 const now=new Date().toISOString();
 for(const b of st.back){
  const {error}=await db.from("delivery_lines").update({qty_back:b.qty,reason:b.qty>0?"unsold":null,settled_at:now}).eq("id",b.id);
  if(error) throw error;
  const l=S.lines.find(x=>x.id===b.id);if(l){l.qty_back=b.qty;l.settled_at=now;}
 }
 const amt=dueFor(st);
 if(amt>0){
  const {error}=await db.from("store_payments").insert({store_id:st.store.id,amount:amt,paid_on:S.today,notes:"Collected by "+(S.acct.name||"")});
  if(error) throw error;
  S.payments.push({store_id:st.store.id,amount:amt,paid_on:S.today});
 }
 st.got=amt;
 const rows=st.out.filter(o=>o.qty>0);
 if(rows.length){
  const {data:del,error:de}=await db.from("deliveries").insert({store_id:st.store.id,delivered_on:S.today,completed_at:now,
   driver_ref:role()==="driver"?S.acct.id:null}).select("id").single();
  if(de) throw de;
  const {data:nl,error:le}=await db.from("delivery_lines").insert(rows.map(o=>({delivery_id:del.id,product_id:o.pid,
   supplier_id:S.supplier?S.supplier.id:null,qty_out:o.qty,unit_price:o.price,unit_cost:o.cost})))
   .select("id,product_id,qty_out,qty_back,unit_price,unit_cost,settled_at");
  if(le) throw le;
  (nl||[]).forEach(l=>S.lines.push(Object.assign(l,{deliveries:{id:del.id,store_id:st.store.id,delivered_on:S.today}})));
 }
 st.done=true;
}

function periodFrom(){
 if(S.period==="month") return S.today.slice(0,8)+"01";
 const x=dOf(S.today);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x);

const cfg=()=>Object.assign({fresh:{mode:"pct",pct:35},dry:{mode:"pct",pct:35},frozen:{mode:"pct",pct:35}},(S.supplier&&S.supplier.cost_cfg)||{});
function supCalc(){
 const from=periodFrom(),c=cfg(),r={};
 TYPES.forEach(t=>{r[t]={rev:0,cost:0,out:0,back:0,made:0,ret:Object.values(S.prods).some(p=>p.type===t&&p.returnable!==false)};});
 S.lines.filter(l=>l.settled_at&&l.deliveries.delivered_on>=from).forEach(l=>{
  const p=S.prods[l.product_id];if(!p)return;const x=r[p.type];const sold=l.qty_out-(l.qty_back||0);
  x.rev+=sold*Number(l.unit_cost);x.made+=l.qty_out;
  if(c[p.type].mode==="prod") x.cost+=(S.make[l.product_id]||0)*l.qty_out;
  if(isRet(l.product_id)){x.out+=l.qty_out;x.back+=l.qty_back||0;}});
 TYPES.forEach(t=>{if(c[t].mode!=="prod") r[t].cost=r[t].rev*(c[t].pct||0)/100;});
 return r;
}

 payCancel:()=>{S.payForm=null;render();},
 paySave:async(el)=>{const amt=Number($("payAmt").value);if(!(amt>0))return fail(T().amount);
  el.disabled=true;const row={store_id:S.payForm.sid,amount:amt,paid_on:S.today,notes:"Recorded by distributor"};
  const {error}=await db.from("store_payments").insert(row);
  if(error){el.disabled=false;return fail(error.message);}
  S.payments.push(row);S.payForm=null;render();},
 sigOpen:(el)=>{S.signing=el.dataset.x;S.sigDrawn=false;render();},
 sigNo:()=>{S.signing=null;render();},
 sigOk:async(el)=>{const d=el.dataset.x,b=batches().find(x=>x.d===d);if(!b||!S.supplier)return;el.disabled=true;
  const row={supplier_id:S.supplier.id,amount:b.cost,paid_on:S.today,covers_dates:[d],signed_at:new Date().toISOString(),
   signature:$("sig").toDataURL("image/png"),signed_by:nm(S.acct)};
  const {error}=await db.from("supplier_payments").insert(row);
  if(error){el.disabled=false;return fail(error.message);}
  S.supPay.push({amount:b.cost,paid_on:S.today,covers_dates:[d]});S.signing=null;render();},

 /* settings / accounts */
 acOpen:()=>{S.addAcct={role:"driver"};render();},
 acRole:(el)=>{const a=S.addAcct;a.th=$("acTh").value;a.en=$("acEn").value;a.pin=$("acPin").value;a.role=el.dataset.x;render();},
 acCancel:()=>{S.addAcct=null;render();},
 acSave:async(el)=>{const th=$("acTh").value.trim(),en=$("acEn").value.trim(),pin=$("acPin").value.trim();
  if(!th&&!en) return fail(T().needName);
  if(!/^[0-9]{4}$/.test(pin)) return fail(T().pinRule);
  if(S.accounts.some(x=>x.pin===pin)) return fail(T().pinTaken);
  el.disabled=true;
  const {data,error}=await db.from("drivers").insert({name:en||th,name_th:th||null,pin,role:S.addAcct.role}).select("id,name,name_th,pin,role,active").single();
  if(error){el.disabled=false;return fail(error.code==="23505"?T().pinTaken:error.message);}
  S.accounts.push(data);S.addAcct=null;render();},
 pinEdit:(el)=>{S.pinEdit=S.pinEdit===el.dataset.x?null:el.dataset.x;render();},
 pinSave:async(el)=>{const pin=$("pinNew").value.trim();if(!/^[0-9]{4}$/.test(pin)) return fail(T().pinRule);
  if(S.accounts.some(x=>x.pin===pin&&x.id!==el.dataset.x)) return fail(T().pinTaken);
  el.disabled=true;const {error}=await db.from("drivers").update({pin}).eq("id",el.dataset.x);
  if(error){el.disabled=false;return fail(error.code==="23505"?T().pinTaken:error.message);}
  const a=S.accounts.find(x=>x.id===el.dataset.x);if(a)a.pin=pin;S.pinEdit=null;render();},
 rmAcct:async()=>{const id=(S.confirm||"").split(":")[1];if(!id)return;
  if(id===S.acct.id) return fail(T().cantRemoveSelf);
  let {error}=await db.from("drivers").delete().eq("id",id);
  if(error) ({error}=await db.from("drivers").update({active:false}).eq("id",id));
  if(error) return fail(error.message);
  S.accounts=S.accounts.filter(a=>a.id!==id);S.confirm=null;render();},

 /* driver round */
 dvBrief:()=>{S.dv.phase="brief";render();},
 ld:(el)=>{S.dv.loaded[el.dataset.x]=!S.dv.loaded[el.dataset.x];render();},
 dvStart:()=>{S.dv.si=nextTodo(0);S.dv.pi=0;S.dv.phase="go";render();
  db.from("runs").upsert({run_date:S.today,driver_ref:role()==="driver"?S.acct.id:null},{onConflict:"run_date"}).then(()=>{},()=>{});},
 dvHere:()=>{const st=S.stops[S.dv.si];S.dv.pi=0;S.dv.phase=st.back.length?"count":"drop";render();},
 cnt:(el)=>{const st=S.stops[S.dv.si],b=st.back[S.dv.pi];b.qty=Math.max(0,Math.min(b.out,b.qty+ +el.dataset.x));
  $("cv").textContent=b.qty;$("soldTxt").textContent=T().soldN(b.out-b.qty);},
 cntNext:()=>{const st=S.stops[S.dv.si];if(S.dv.pi<st.back.length-1)S.dv.pi++;else S.dv.phase="money";render();},
 cntBack:()=>{if(S.dv.pi>0)S.dv.pi--;else S.dv.phase="go";render();},
 dvMoneyOk:()=>{S.dv.phase="drop";render();},
 dvMoneyBack:()=>{const st=S.stops[S.dv.si];S.dv.phase="count";S.dv.pi=Math.max(0,st.back.length-1);render();},
 drop:(el)=>{const [j,d]=el.dataset.x.split("|");const o=S.stops[S.dv.si].out[+j];o.qty=Math.max(0,o.qty+ +d);$("dq"+j).textContent=o.qty;},
 dvDropBack:()=>{const st=S.stops[S.dv.si];S.dv.phase=st.back.length?"money":"go";render();},
 dvDropOk:async(el)=>{el.disabled=true;
  try{await saveStop(S.stops[S.dv.si]);}catch(e){el.disabled=false;return fail(e.message||String(e));}
  const n=nextTodo(S.dv.si+1);
  if(n<0) S.dv.phase="done"; else {S.dv.si=n;S.dv.pi=0;S.dv.phase="go";}
  render();},
 photo:()=>{$("fp").value="";$("fp").click();},
 dvFinish:async(el)=>{el.disabled=true;
  try{await db.from("runs").update({finished_at:new Date().toISOString(),photos:S.dv.photos}).eq("run_date",S.today);}catch(e){}
  S.dv={phase:"notify",si:0,pi:0,loaded:{},photos:[]};S.stops=null;render();},
 lq:async(el)=>{const [id,d]=el.dataset.x.split("|");
  const o=S.orders.find(x=>x.id===S.ob.id),l=o&&o.lines.find(x=>x.id===id);if(!l)return;
  const tag=(l.qty_price_tagged||0)>0,cur=tag?l.qty_price_tagged:l.qty_plain,nv=Math.max(0,cur+ +d);
  if(tag)l.qty_price_tagged=nv;else l.qty_plain=nv;
  $("lq-"+id).textContent=qty(l);S.stops=null;
  const {error}=await db.from("purchase_order_lines").update(tag?{qty_price_tagged:nv}:{qty_plain:nv}).eq("id",id);
  if(error) fail(error.message);},

 /* supplier */
 supAns:async(el)=>{const [id,st]=el.dataset.x.split("|");const o=S.orders.find(x=>x.id===id);if(!o)return;
  const prev=o.sup_status;o.sup_status=st;render();
  const {error}=await db.from("purchase_orders").update({sup_status:st,sup_at:st==="pending"?null:new Date().toISOString()}).eq("id",id);
  if(error){o.sup_status=prev;render();fail(error.message);}},
 period:(el)=>{S.period=el.dataset.x;render();},
 ctype:(el)=>{S.ctype=el.dataset.x;render();},
 ctBack:()=>{S.ctype=null;render();},
 cmode:async(el)=>{const c=cfg();c[S.ctype]=Object.assign({},c[S.ctype],{mode:el.dataset.x});S.supplier.cost_cfg=c;render();
  const {error}=await db.rpc("set_cost_cfg",{cfg:c});if(error)fail(error.message);}
};
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el||el.disabled) return;
 const f=ACT[el.dataset.a];if(f){e.preventDefault&&el.tagName!=="A"&&e.preventDefault();f(el,e);}
});
/* text / number fields save when you leave them */
document.addEventListener("change",async e=>{
 const el=e.target,k=el.dataset&&el.dataset.in;if(!k) return;
 if(k==="label"){if(S.ob)S.ob.label=el.value;return;}
 if(k.startsWith("f:")){const o=openObj(),f=k.slice(2);if(!o)return;o[f]=el.value.trim()||null;
  if(await upd(TBL[S.open.kind],o.id,{[f]:o[f]})) render();return;}
 if(k.startsWith("sp:")){const [,pid,f]=k.split(":"),s=openObj(),sp=spOf(s.id,pid);if(!sp)return;
  const v=f==="default_qty"?Math.max(0,parseInt(el.value,10)||0):Math.max(0,Number(el.value)||0);sp[f]=v;
  const {error}=await db.from("store_products").update({[f]:v}).eq("store_id",s.id).eq("product_id",pid);if(error)fail(error.message);return;}
 if(k==="cost"){const p=openObj(),v=Math.max(0,Number(el.value)||0);S.costs[p.id]=v;
  const {error}=await db.from("supplier_products").upsert({supplier_id:S.supplier.id,product_id:p.id,unit_cost:v},{onConflict:"supplier_id,product_id"});
  if(error)fail(error.message);return;}
 if(k.startsWith("make:")){const pid=k.slice(5),v=el.value===""?null:Math.max(0,Number(el.value)||0);S.make[pid]=v;
  const {error}=await db.rpc("set_make_cost",{pid,c:v});if(error)fail(error.message);render();return;}
 if(k==="pct"){const c=cfg();c[S.ctype]=Object.assign({},c[S.ctype],{pct:+el.value});S.supplier.cost_cfg=c;
  const {error}=await db.rpc("set_cost_cfg",{cfg:c});if(error)fail(error.message);return;}
});
document.addEventListener("input",e=>{
 const el=e.target;if(!el.dataset||el.dataset.in!=="pct") return;
 const r=supCalc()[S.ctype],v=+el.value;
 $("pctOut").textContent=v+"%";$("pctNote").textContent=T().costOf(money(r.rev*v/100),money(r.rev));
});
$("fp").addEventListener("change",e=>{
 const f=e.target.files&&e.target.files[0];if(!f) return;
 const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement("canvas"),s=Math.min(1,1000/Math.max(im.width,im.height));
  c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  S.dv.photos.push(c.toDataURL("image/jpeg",.7));render();};im.src=r.result;};r.readAsDataURL(f);
});

/* =================== boot =================== */
applyType();
(async()=>{
 try{const {data:{session}}=await withTimeout(db.auth.getSession(),8000);
  if(session&&S.acct) return start();
  if(session) await db.auth.signOut();
 }catch(e){}
 localStorage.removeItem("ss_acct");S.acct=null;pinScreen();
})();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
